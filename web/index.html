<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fbf8fd" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131316" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Discover music, save favorites and manage your personal music queue with mman.">
  <title>mman — music, made personal</title>
  <link rel="manifest" href="./web/manifest.webmanifest">
  <link rel="icon" href="./web/icon.svg" type="image/svg+xml">

  <!-- Material 3: Roboto + Material Symbols + Material Web components (no framework) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
  <script type="importmap">
    { "imports": { "@material/web/": "https://esm.run/@material/web/" } }
  </script>

  <style>
    /* ───────────── Material 3 tokens (light + dark follow the system) ───────────── */
    :root {
      color-scheme: light dark;
      --md-ref-typeface-brand: "Roboto", system-ui, sans-serif;
      --md-ref-typeface-plain: "Roboto", system-ui, sans-serif;

      --md-sys-color-primary: light-dark(#4355b9, #bac3ff);
      --md-sys-color-on-primary: light-dark(#ffffff, #0c2188);
      --md-sys-color-primary-container: light-dark(#dee0ff, #293ca0);
      --md-sys-color-on-primary-container: light-dark(#00105c, #dee0ff);
      --md-sys-color-secondary: light-dark(#5a5d72, #c3c5dd);
      --md-sys-color-on-secondary: light-dark(#ffffff, #2c2f42);
      --md-sys-color-secondary-container: light-dark(#dfe1f9, #424659);
      --md-sys-color-on-secondary-container: light-dark(#171a2c, #dfe1f9);
      --md-sys-color-tertiary: light-dark(#76546e, #e5bad8);
      --md-sys-color-on-tertiary: light-dark(#ffffff, #43273e);
      --md-sys-color-tertiary-container: light-dark(#ffd7f2, #5c3d55);
      --md-sys-color-on-tertiary-container: light-dark(#2c1229, #ffd7f2);
      --md-sys-color-error: light-dark(#ba1a1a, #ffb4ab);
      --md-sys-color-on-error: light-dark(#ffffff, #690005);
      --md-sys-color-error-container: light-dark(#ffdad6, #93000a);
      --md-sys-color-on-error-container: light-dark(#410002, #ffdad6);
      --md-sys-color-background: light-dark(#fefbff, #1b1b1f);
      --md-sys-color-on-background: light-dark(#1b1b1f, #e4e1e6);
      --md-sys-color-surface: light-dark(#fbf8fd, #131316);
      --md-sys-color-on-surface: light-dark(#1b1b1f, #e4e1e6);
      --md-sys-color-surface-variant: light-dark(#e3e1ec, #46464f);
      --md-sys-color-on-surface-variant: light-dark(#46464f, #c7c5d0);
      --md-sys-color-outline: light-dark(#777680, #918f9a);
      --md-sys-color-outline-variant: light-dark(#c7c5d0, #46464f);
      --md-sys-color-surface-container-lowest: light-dark(#ffffff, #0e0e11);
      --md-sys-color-surface-container-low: light-dark(#f5f2f7, #1b1b1f);
      --md-sys-color-surface-container: light-dark(#f0ecf1, #1f1f23);
      --md-sys-color-surface-container-high: light-dark(#eae7ec, #2a2a2d);
      --md-sys-color-surface-container-highest: light-dark(#e4e1e6, #353438);
      --md-sys-color-inverse-surface: light-dark(#303034, #e4e1e6);
      --md-sys-color-inverse-on-surface: light-dark(#f2f0f4, #303034);
      --md-sys-color-inverse-primary: light-dark(#bac3ff, #4355b9);
      --md-sys-color-surface-tint: light-dark(#4355b9, #bac3ff);
      --md-sys-color-shadow: #000;
      --md-sys-color-scrim: #000;

      --nav-h: 80px;
      --bar-h: 64px;
      --safe-b: env(safe-area-inset-bottom, 0px);
    }

    /* ───────────── Base ───────────── */
    * { box-sizing: border-box; }
    html { background: var(--md-sys-color-surface); }
    body {
      margin: 0;
      min-height: 100vh;
      padding-bottom: calc(var(--nav-h) + var(--safe-b) + 24px);
      background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      font: 400 14px/20px var(--md-ref-typeface-plain);
      letter-spacing: .25px;
      -webkit-font-smoothing: antialiased;
      transition: opacity .2s;
    }
    body:not(.ready) { opacity: 0; }
    body.has-player { padding-bottom: calc(var(--nav-h) + var(--safe-b) + 196px); }
    [hidden] { display: none !important; }
    button { padding: 0; border: 0; color: inherit; background: none; font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:disabled { cursor: default; }
    a { color: var(--md-sys-color-primary); }
    img { display: block; }
    ::selection { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }
    :focus-visible { outline: 3px solid var(--md-sys-color-primary); outline-offset: 2px; }
    md-icon { --md-icon-size: 24px; }
    .fill { font-variation-settings: "FILL" 1; }

    /* Type scale */
    .t-headline { font: 400 28px/36px var(--md-ref-typeface-brand); letter-spacing: 0; }
    .t-title-l { font: 400 22px/28px var(--md-ref-typeface-brand); letter-spacing: 0; }
    .t-title-m { font: 500 16px/24px var(--md-ref-typeface-plain); letter-spacing: .15px; }
    .t-title-s { font: 500 14px/20px var(--md-ref-typeface-plain); letter-spacing: .1px; }
    .t-body-l { font: 400 16px/24px var(--md-ref-typeface-plain); letter-spacing: .5px; }
    .t-body-s { font: 400 12px/16px var(--md-ref-typeface-plain); letter-spacing: .4px; }
    .t-label-m { font: 500 12px/16px var(--md-ref-typeface-plain); letter-spacing: .5px; }
    .variant { color: var(--md-sys-color-on-surface-variant); }

    /* ───────────── Top app bar ───────────── */
    .appbar {
      position: sticky; top: 0; z-index: 30;
      display: flex; align-items: center; gap: 8px;
      height: calc(var(--bar-h) + env(safe-area-inset-top, 0px));
      padding: env(safe-area-inset-top, 0px) 12px 0 16px;
      background: var(--md-sys-color-surface);
      transition: background-color .2s;
    }
    .appbar.scrolled { background: var(--md-sys-color-surface-container); }
    .brand { display: inline-flex; align-items: center; gap: 12px; color: var(--md-sys-color-on-surface); text-decoration: none; }
    .brand-mark { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 14px; background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }
    .brand-name { font: 500 22px/28px var(--md-ref-typeface-brand); letter-spacing: -.2px; }
    .brand-name b { color: var(--md-sys-color-primary); font-weight: 700; }
    .spacer { flex: 1; }
    #acct { --md-filled-tonal-button-container-height: 40px; max-width: 190px; }
    .acct-label { display: inline-block; max-width: 110px; overflow: hidden; vertical-align: bottom; text-overflow: ellipsis; white-space: nowrap; }

    /* ───────────── Navigation: bar (compact) → rail (≥600px) ───────────── */
    .nav {
      position: fixed; z-index: 40; right: 0; bottom: 0; left: 0;
      display: flex;
      height: calc(var(--nav-h) + var(--safe-b));
      padding-bottom: var(--safe-b);
      background: var(--md-sys-color-surface-container);
    }
    .nav-item {
      display: flex; flex: 1; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      min-width: 0; color: var(--md-sys-color-on-surface-variant);
      font: 500 12px/16px var(--md-ref-typeface-plain); letter-spacing: .5px;
    }
    .nav-pill { position: relative; display: grid; place-items: center; width: 64px; height: 32px; overflow: hidden; border-radius: 16px; transition: background-color .2s; }
    .nav-item:hover .nav-pill { background: color-mix(in srgb, var(--md-sys-color-on-surface) 8%, transparent); }
    .nav-item[aria-current="page"] { color: var(--md-sys-color-on-surface); }
    .nav-item[aria-current="page"] .nav-pill { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
    .nav-item[aria-current="page"] md-icon { font-variation-settings: "FILL" 1; }
    .nav-item:focus-visible { outline-offset: -4px; border-radius: 16px; }

    main { width: 100%; max-width: 960px; margin: 0 auto; padding: 8px 16px 24px; }
    .page-enter { animation: fade-in .18s ease-out both; }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    @media (min-width: 600px) {
      body, body.has-player { padding-bottom: 24px; }
      body.has-player { padding-bottom: 150px; }
      .nav {
        top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); right: auto; bottom: 0;
        width: 80px; height: auto; padding: 12px 0 0;
        flex-direction: column; justify-content: flex-start; gap: 12px;
        background: var(--md-sys-color-surface);
      }
      .nav-item { flex: none; padding: 4px 0; }
      .shell-content { margin-left: 80px; }
      main { padding: 8px 24px 32px; }
    }

    /* ───────────── Headings / sections ───────────── */
    .page-title { margin: 8px 0 0; }
    .page-subtitle { max-width: 36rem; margin: 8px 0 0; }
    .section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 28px 0 8px; }
    .section-head h2 { margin: 0; }
    .section-head p { margin: 2px 0 0; }

    /* ───────────── Search ───────────── */
    .searchrow { display: flex; align-items: center; gap: 8px; margin: 20px 0 12px; }
    .searchfield {
      flex: 1; min-width: 0;
      --md-filled-text-field-container-shape: 28px;
      --md-filled-text-field-container-shape-start-start: 28px;
      --md-filled-text-field-container-shape-start-end: 28px;
      --md-filled-text-field-container-shape-end-start: 28px;
      --md-filled-text-field-container-shape-end-end: 28px;
      --md-filled-text-field-container-color: var(--md-sys-color-surface-container-high);
      --md-filled-text-field-active-indicator-height: 0px;
      --md-filled-text-field-hover-active-indicator-height: 0px;
      --md-filled-text-field-focus-active-indicator-height: 0px;
      --md-filled-text-field-input-text-size: 16px;
      --md-filled-text-field-leading-icon-color: var(--md-sys-color-on-surface-variant);
    }
    #searchGo { --md-filled-icon-button-container-width: 56px; --md-filled-icon-button-container-height: 56px; }
    .tabs-row { margin-top: 4px; }
    .sort-row { display: flex; justify-content: flex-end; margin-top: 12px; }
    #sort, #queueFilter { min-width: 180px; --md-outlined-select-text-field-container-shape: 12px; }
    .recent { display: flex; align-items: center; gap: 8px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; }
    .recent::-webkit-scrollbar { display: none; }
    .recent > * { flex: 0 0 auto; }

    .mood-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 24px; }
    .mood {
      position: relative; display: flex; flex-direction: column; justify-content: space-between;
      min-height: 120px; overflow: hidden; padding: 16px; border-radius: 20px; text-align: left;
    }
    .mood md-icon { --md-icon-size: 28px; }
    .mood strong { display: block; font: 500 16px/24px var(--md-ref-typeface-plain); letter-spacing: .15px; }
    .mood small { display: block; font: 400 12px/16px var(--md-ref-typeface-plain); letter-spacing: .4px; opacity: .82; }
    .mood.m1 { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }
    .mood.m2 { background: var(--md-sys-color-tertiary-container); color: var(--md-sys-color-on-tertiary-container); }
    .mood.m3 { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
    .mood.m4 { background: var(--md-sys-color-surface-container-highest); color: var(--md-sys-color-on-surface); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    @media (min-width: 840px) { .mood-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

    /* ───────────── Track rows ───────────── */
    .rows { display: flex; flex-direction: column; }
    .row {
      position: relative;
      display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: center; gap: 4px 12px;
      padding: 8px 4px 8px 8px; border-radius: 16px;
      transition: background-color .15s;
    }
    .row:hover { background: color-mix(in srgb, var(--md-sys-color-on-surface) 8%, transparent); }
    .row.now { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
    .art { position: relative; width: 56px; height: 56px; overflow: hidden; border-radius: 12px; background: var(--md-sys-color-surface-container-highest); }
    .art img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .25s; }
    .art img.image-loaded { opacity: 1; }
    .art-play { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; background: rgb(0 0 0 / .5); opacity: 0; transition: opacity .15s; pointer-events: none; }
    .row:hover .art-play, .art:focus-visible .art-play, .row.now .art-play { opacity: 1; }
    .art:disabled .art-play { display: none; }
    .row-text { min-width: 0; }
    .row-title { display: flex; align-items: center; gap: 8px; min-width: 0; font: 500 16px/24px var(--md-ref-typeface-plain); letter-spacing: .15px; }
    .row-title > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-sub { overflow: hidden; color: var(--md-sys-color-on-surface-variant); font: 400 14px/20px var(--md-ref-typeface-plain); text-overflow: ellipsis; white-space: nowrap; }
    .row.now .row-sub { color: inherit; opacity: .8; }
    .badge { flex: 0 0 auto; padding: 0 8px; border-radius: 8px; background: var(--md-sys-color-surface-container-highest); color: var(--md-sys-color-on-surface-variant); font: 500 11px/18px var(--md-ref-typeface-plain); letter-spacing: .5px; }
    .badge.full { background: var(--md-sys-color-tertiary-container); color: var(--md-sys-color-on-tertiary-container); }
    .row-actions { display: flex; align-items: center; }
    .fav { --md-icon-button-icon-color: var(--md-sys-color-on-surface-variant); }
    .fav.on { --md-icon-button-icon-color: var(--md-sys-color-error); --md-icon-button-hover-icon-color: var(--md-sys-color-error); --md-icon-button-focus-icon-color: var(--md-sys-color-error); --md-icon-button-pressed-icon-color: var(--md-sys-color-error); }
    .fav.on md-icon { font-variation-settings: "FILL" 1; }

    /* Queue extras inside a row */
    .q { grid-column: 2 / -1; min-width: 0; padding: 2px 8px 4px 0; }
    .q-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
    .q-status { display: inline-flex; align-items: center; gap: 6px; font: 500 12px/16px var(--md-ref-typeface-plain); letter-spacing: .5px; text-transform: capitalize; }
    .q-status md-icon { --md-icon-size: 18px; }
    .q.running .q-status md-icon { animation: spin 1.4s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .q md-linear-progress { width: 100%; --md-linear-progress-track-height: 6px; --md-linear-progress-active-indicator-height: 6px; --md-linear-progress-track-shape: 3px; --md-linear-progress-active-indicator-shape: 3px; }
    .q.done md-linear-progress { --md-linear-progress-active-indicator-color: var(--md-sys-color-tertiary); }
    .q.failed md-linear-progress { --md-linear-progress-active-indicator-color: var(--md-sys-color-error); }
    .stages { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin: 10px 0 2px; }
    .stage { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--md-sys-color-outline); font: 500 11px/16px var(--md-ref-typeface-plain); }
    .stage:not(:last-child)::after { position: absolute; top: 4px; left: calc(50% + 8px); width: calc(100% - 16px); height: 2px; border-radius: 1px; background: var(--md-sys-color-outline-variant); content: ""; }
    .stage i { position: relative; z-index: 1; width: 10px; height: 10px; border-radius: 50%; background: var(--md-sys-color-outline-variant); }
    .stage.complete { color: var(--md-sys-color-on-surface-variant); }
    .stage.complete i, .stage.complete::after { background: var(--md-sys-color-primary); }
    .stage.active { color: var(--md-sys-color-primary); }
    .stage.active i { background: var(--md-sys-color-primary); box-shadow: 0 0 0 4px color-mix(in srgb, var(--md-sys-color-primary) 24%, transparent); }
    .q-hint { margin-top: 4px; color: var(--md-sys-color-on-surface-variant); font: 400 12px/16px var(--md-ref-typeface-plain); letter-spacing: .4px; }
    .q.failed .q-hint, .q.failed .q-status { color: var(--md-sys-color-error); }
    .q-links { display: flex; flex-wrap: wrap; gap: 0 4px; margin: 4px 0 0 -12px; }
    .q-links md-text-button { --md-text-button-container-height: 32px; --md-text-button-label-text-size: 13px; }
    .q-local { display: grid; gap: 6px; margin-top: 12px; }
    .q-local .q-top { margin: 0; color: var(--md-sys-color-on-surface-variant); font: 500 12px/16px var(--md-ref-typeface-plain); }
    .q-local md-linear-progress { width: 100%; --md-linear-progress-track-height: 4px; --md-linear-progress-active-indicator-height: 4px; }

    /* ───────────── Albums / artists / detail headers ───────────── */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 20px 16px; }
    .album { min-width: 0; }
    .album-art { position: relative; display: block; width: 100%; aspect-ratio: 1; overflow: hidden; border-radius: 16px; background: var(--md-sys-color-surface-container-highest); }
    .album-art img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .25s; }
    .album-art img.image-loaded { opacity: 1; }
    .album-meta { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin-top: 8px; }
    .album-meta > div { min-width: 0; }
    .album-meta strong, .album-meta span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .album-meta strong { font: 500 14px/20px var(--md-ref-typeface-plain); letter-spacing: .1px; }
    .album-meta span { color: var(--md-sys-color-on-surface-variant); font: 400 12px/16px var(--md-ref-typeface-plain); letter-spacing: .4px; }
    .artist-row { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 8px; border-radius: 16px; }
    .artist-row:hover { background: color-mix(in srgb, var(--md-sys-color-on-surface) 8%, transparent); }
    .avatar { width: 56px; height: 56px; overflow: hidden; border-radius: 50%; background: var(--md-sys-color-surface-container-highest); }
    .avatar img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .25s; }
    .avatar img.image-loaded { opacity: 1; }
    .artist-actions { display: flex; flex-direction: column; gap: 4px; }
    .artist-actions md-outlined-button, .artist-actions md-filled-tonal-button { --md-outlined-button-container-height: 36px; --md-filled-tonal-button-container-height: 36px; }
    .entity { display: flex; align-items: center; gap: 16px; margin: 8px 0 16px; padding: 16px; border-radius: 24px; background: var(--md-sys-color-surface-container); }
    .entity img { flex: 0 0 auto; width: 96px; height: 96px; object-fit: cover; border-radius: 16px; background: var(--md-sys-color-surface-container-highest); }
    .entity img.round { border-radius: 50%; }
    .entity h2 { margin: 0 0 4px; }
    .entity p { margin: 0 0 12px; }
    .entity-meta { min-width: 0; }

    /* ───────────── Queue overview / stats / toolbar ───────────── */
    .stat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 20px 0 12px; }
    .stat {
      position: relative; display: block; min-width: 0; overflow: hidden; padding: 12px 16px; border-radius: 16px;
      background: var(--md-sys-color-surface-container); text-align: left;
    }
    .stat.active { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
    .stat-top { display: flex; align-items: center; justify-content: space-between; }
    .stat strong { font: 400 28px/36px var(--md-ref-typeface-brand); font-variant-numeric: tabular-nums; letter-spacing: 0; }
    .stat span.l { display: block; color: var(--md-sys-color-on-surface-variant); font: 500 12px/16px var(--md-ref-typeface-plain); letter-spacing: .5px; }
    .stat.active span.l { color: inherit; }
    @media (min-width: 600px) { .stat-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .overview { margin: 0 0 12px; padding: 16px; border-radius: 20px; background: var(--md-sys-color-surface-container); }
    .overview-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .overview-head .t-title-m { margin: 0; }
    .overview md-linear-progress { width: 100%; --md-linear-progress-track-height: 8px; --md-linear-progress-active-indicator-height: 8px; --md-linear-progress-track-shape: 4px; --md-linear-progress-active-indicator-shape: 4px; }
    .overview-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; color: var(--md-sys-color-on-surface-variant); font: 400 12px/16px var(--md-ref-typeface-plain); }
    .overview-foot b { color: var(--md-sys-color-on-surface); font-weight: 500; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin: 16px 0 8px; }
    .toolbar-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .pager { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 16px 0 4px; color: var(--md-sys-color-on-surface-variant); }

    /* ───────────── Empty / skeleton ───────────── */
    .empty { margin-top: 16px; padding: 40px 24px; border-radius: 24px; background: var(--md-sys-color-surface-container-low); text-align: center; animation: fade-in .2s both; }
    .empty-icon { display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%; background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }
    .empty-icon md-icon { --md-icon-size: 28px; }
    .empty strong { display: block; margin-bottom: 4px; font: 400 22px/28px var(--md-ref-typeface-brand); letter-spacing: 0; }
    .empty p { max-width: 24rem; margin: 0 auto; color: var(--md-sys-color-on-surface-variant); }
    .empty .actions { margin-top: 20px; }
    .sk { position: relative; overflow: hidden; border-radius: 8px; background: var(--md-sys-color-surface-container-high); }
    .sk::after { position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--md-sys-color-on-surface) 8%, transparent), transparent); content: ""; animation: shimmer 1.4s infinite; }
    @keyframes shimmer { to { transform: translateX(100%); } }
    .sk-row { display: grid; grid-template-columns: 56px 1fr 80px; gap: 12px; align-items: center; padding: 8px; }
    .sk-art { width: 56px; height: 56px; border-radius: 12px; }
    .sk-line { height: 12px; margin: 6px 0; }
    .sk-btn { height: 32px; border-radius: 16px; }
    .banner { margin: 12px 0; padding: 12px 16px; border-radius: 12px; background: var(--md-sys-color-error-container); color: var(--md-sys-color-on-error-container); }

    /* ───────────── Request progress, snackbar, menu, dialog ───────────── */
    .reqprog { position: fixed; z-index: 100; top: 0; right: 0; left: 0; opacity: 0; pointer-events: none; transition: opacity .2s; --md-linear-progress-track-height: 3px; --md-linear-progress-active-indicator-height: 3px; }
    .reqprog.active { opacity: 1; }
    .snackbar {
      position: fixed; z-index: 60; left: 50%; bottom: calc(var(--nav-h) + var(--safe-b) + 12px);
      display: flex; align-items: center; gap: 12px;
      max-width: min(calc(100vw - 16px), 560px); min-height: 48px; padding: 6px 16px;
      border-radius: 4px; background: var(--md-sys-color-inverse-surface); color: var(--md-sys-color-inverse-on-surface);
      box-shadow: 0 3px 8px rgb(0 0 0 / .3);

      transition: opacity .2s, transform .2s;
    }
    .snackbar.show { opacity: 1; transform: translate(-50%, 0); }
    .snackbar md-icon { --md-icon-size: 20px; color: var(--md-sys-color-inverse-primary); }
    body.has-player .snackbar { bottom: calc(var(--nav-h) + var(--safe-b) + 204px); }
    @media (min-width: 600px) {
      .snackbar { bottom: 24px; left: calc(50% + 40px); }
      body.has-player .snackbar { bottom: 160px; }
    }
    md-menu { --md-menu-container-color: var(--md-sys-color-surface-container); min-width: 200px; }
    md-dialog { --md-dialog-container-color: var(--md-sys-color-surface-container-high); --md-dialog-container-max-width: 560px; --md-dialog-container-shape: 28px; max-height: min(640px, 88vh); }
    #dlgActions { display: flex; flex: 1; align-items: center; justify-content: flex-end; gap: 8px; }
    .dlg-sub { margin: 0 0 16px; color: var(--md-sys-color-on-surface-variant); }
    .form { display: grid; gap: 16px; min-width: min(420px, 78vw); padding-top: 4px; }
    .lyrics { color: var(--md-sys-color-on-surface); font: 400 16px/32px var(--md-ref-typeface-plain); white-space: pre-wrap; }
    .detail-top { display: flex; align-items: flex-start; gap: 16px; }
    .detail-top img { flex: 0 0 auto; width: 88px; height: 88px; object-fit: cover; border-radius: 16px; background: var(--md-sys-color-surface-container-highest); }
    .detail-top > div { flex: 1; min-width: 0; }
    .detail-top audio { width: 100%; }
    .kv { display: grid; grid-template-columns: 1fr; gap: 0 24px; margin-top: 16px; }
    .kv-item { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--md-sys-color-outline-variant); font-size: 12px; line-height: 16px; }
    .kv-item span { color: var(--md-sys-color-on-surface-variant); }
    .kv-item strong { max-width: 62%; overflow-wrap: anywhere; font-weight: 500; text-align: right; }
    @media (min-width: 600px) { .kv { grid-template-columns: 1fr 1fr; } }
    .links { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 16px; }
    .context-panel {
      position: fixed; z-index: 34; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 12px); right: 16px; bottom: 164px;
      display: flex; width: min(360px, calc(100vw - 32px)); flex-direction: column; overflow: hidden;
      border: 1px solid var(--md-sys-color-outline-variant); border-radius: 20px; background: var(--md-sys-color-surface-container-low);
      box-shadow: 0 12px 36px rgb(0 0 0 / .2); animation: panel-in .18s ease-out both;
    }
    .context-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 12px 8px 16px; }
    .context-tabs { display: flex; gap: 4px; padding: 0 12px 8px; border-bottom: 1px solid var(--md-sys-color-outline-variant); }
    .context-tab { padding: 7px 12px; border-radius: 999px; color: var(--md-sys-color-on-surface-variant); font: 500 13px/18px var(--md-ref-typeface-plain); }
    .context-tab[aria-selected="true"] { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
    .context-body { min-height: 0; overflow: auto; padding: 16px; }
    .context-track { margin-bottom: 14px; color: var(--md-sys-color-on-surface-variant); font: 500 12px/18px var(--md-ref-typeface-plain); }
    .context-lyrics { display: grid; gap: 10px; padding: 8px 0 36px; }
    .lyric-line { width: 100%; color: var(--md-sys-color-on-surface-variant); text-align: left; font: 500 18px/1.5 var(--md-ref-typeface-brand); transition: color .2s, transform .2s; }
    .lyric-line.active { color: var(--md-sys-color-on-surface); transform: translateX(4px); }
    .lyric-line.past { color: color-mix(in srgb, var(--md-sys-color-on-surface-variant) 58%, transparent); }
    .context-empty { padding: 28px 8px; color: var(--md-sys-color-on-surface-variant); text-align: center; }
    @keyframes panel-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* ───────────── Player ───────────── */
    .player {
      position: fixed; z-index: 35; right: 8px; left: 8px;
      bottom: calc(var(--nav-h) + var(--safe-b) + 8px);
      display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "track end" "center center";
      gap: 2px 8px; padding: 10px 8px 6px 12px;
      border-radius: 24px; background: var(--md-sys-color-surface-container-high);
      --md-elevation-level: 3;
    }
    .player-track { grid-area: track; display: flex; align-items: center; gap: 12px; min-width: 0; }
    .player-art { flex: 0 0 auto; width: 48px; height: 48px; object-fit: cover; border-radius: 12px; background: var(--md-sys-color-surface-container-highest); }
    .player-meta { flex: 1; min-width: 0; }
    .player-meta strong, .player-meta span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .player-meta strong { font: 500 14px/20px var(--md-ref-typeface-plain); letter-spacing: .1px; }
    .player-meta span { color: var(--md-sys-color-on-surface-variant); font: 400 12px/16px var(--md-ref-typeface-plain); letter-spacing: .4px; }
    .player-center { grid-area: center; display: flex; flex-direction: column; align-items: center; min-width: 0; }
    .player-controls { display: flex; align-items: center; justify-content: center; gap: 4px; }
    #toggle { --md-filled-icon-button-container-width: 56px; --md-filled-icon-button-container-height: 56px; --md-filled-icon-button-icon-size: 32px; margin: 0 4px; }
    .player-seek { display: flex; align-items: center; gap: 8px; width: 100%; color: var(--md-sys-color-on-surface-variant); font: 400 12px/16px var(--md-ref-typeface-plain); font-variant-numeric: tabular-nums; }
    .player-seek md-slider { flex: 1; min-width: 0; margin: 0; }
    .player-end { grid-area: end; display: flex; align-items: center; justify-content: flex-end; }
    .player-vol { display: none; align-items: center; gap: 4px; }
    .player-vol md-slider { width: 112px; min-width: 0; margin: 0; }
    .eq { display: inline-flex; align-items: flex-end; gap: 2px; width: 16px; height: 16px; flex: 0 0 auto; opacity: .0; transition: opacity .2s; }
    .eq i { display: block; width: 3px; height: 4px; border-radius: 2px; background: var(--md-sys-color-primary); transform-origin: bottom; }
    .player.is-playing .eq { opacity: 1; }
    .player.is-playing .eq i { animation: eq .7s ease-in-out infinite alternate; }
    .player.is-playing .eq i:nth-child(2) { animation-delay: -.4s; }
    .player.is-playing .eq i:nth-child(3) { animation-delay: -.15s; }
    @keyframes eq { from { height: 3px; } to { height: 16px; } }
    .player.is-loading #toggle { opacity: .7; }
    @media (min-width: 840px) {
      .player {
        right: 16px; left: 96px; bottom: 16px; max-width: 980px; margin-inline: auto;
        grid-template-columns: minmax(200px, 1fr) minmax(320px, 1.6fr) minmax(170px, 1fr); grid-template-areas: "track center end";
        align-items: center; gap: 16px; padding: 10px 12px 10px 16px;
      }
      .player-vol { display: flex; }
    }
    @media (min-width: 1200px) {
      body.context-open .shell-content { margin-right: 392px; }
    }
    @media (max-width: 599px) {
      .context-panel { top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 8px); right: 8px; bottom: calc(var(--nav-h) + var(--safe-b) + 184px); width: calc(100vw - 16px); }
      .context-head { padding-top: 8px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <md-linear-progress class="reqprog" id="requestProgress" indeterminate aria-hidden="true"></md-linear-progress>

  <header class="appbar" id="appbar">
    <a class="brand" href="#" data-page="search" aria-label="mman home">
      <span class="brand-mark"><md-icon>graphic_eq</md-icon></span>
      <span class="brand-name">mman<b>.</b></span>
    </a>
    <span class="spacer"></span>
    <md-filled-tonal-button id="acct" data-action="account">
      <md-icon slot="icon" id="acctIcon">account_circle</md-icon>
      <span class="acct-label" id="acctLabel">Sign in</span>
    </md-filled-tonal-button>
  </header>

  <nav class="nav" aria-label="Main navigation">
    <button class="nav-item" data-page="search" aria-current="page">
      <span class="nav-pill"><md-ripple></md-ripple><md-icon>explore</md-icon></span><span>Discover</span>
    </button>
    <button class="nav-item" data-page="queue">
      <span class="nav-pill"><md-ripple></md-ripple><md-icon>queue_music</md-icon></span><span>My queue</span>
    </button>
    <button class="nav-item" data-page="favorites">
      <span class="nav-pill"><md-ripple></md-ripple><md-icon>favorite</md-icon></span><span>Liked</span>
    </button>
    <button class="nav-item" data-page="offline">
      <span class="nav-pill"><md-ripple></md-ripple><md-icon>offline_pin</md-icon></span><span>Offline</span>
    </button>
  </nav>

  <div class="shell-content">
    <main id="app" aria-live="polite"></main>
  </div>

  <section class="player" id="player" hidden aria-label="Audio player">
    <md-elevation></md-elevation>
    <div class="player-track">
      <img class="player-art" id="p-art" alt="">
      <div class="player-meta">
        <strong id="p-title">Choose a song</strong>
        <span id="p-artist">Nothing playing</span>
      </div>
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <md-icon-button class="fav" id="p-fav" aria-label="Like track"><md-icon>favorite</md-icon></md-icon-button>
    </div>
    <div class="player-center">
      <div class="player-controls">
        <md-icon-button toggle id="shuffle" aria-label="Shuffle"><md-icon>shuffle</md-icon><md-icon slot="selected">shuffle</md-icon></md-icon-button>
        <md-icon-button id="prev" aria-label="Previous track"><md-icon>skip_previous</md-icon></md-icon-button>
        <md-filled-icon-button id="toggle" aria-label="Play"><md-icon>play_arrow</md-icon></md-filled-icon-button>
        <md-icon-button id="next" aria-label="Next track"><md-icon>skip_next</md-icon></md-icon-button>
        <md-icon-button toggle id="repeat" aria-label="Repeat"><md-icon>repeat</md-icon><md-icon slot="selected">repeat</md-icon></md-icon-button>
      </div>
      <div class="player-seek">
        <span id="cur">0:00</span>
        <md-slider id="seek" min="0" max="1000" value="0" aria-label="Seek"></md-slider>
        <span id="tot">0:00</span>
      </div>
    </div>
    <div class="player-end">
      <md-icon-button id="context-toggle" aria-label="Open lyrics and track information" title="Lyrics and track information"><md-icon>lyrics</md-icon></md-icon-button>
      <md-icon-button id="p-dl" aria-label="Download track" hidden><md-icon>download</md-icon></md-icon-button>
      <div class="player-vol">
        <md-icon class="variant">volume_up</md-icon>
        <md-slider id="vol" min="0" max="1" step="0.01" value="0.8" aria-label="Volume"></md-slider>
      </div>
      <md-icon-button id="close" aria-label="Close player"><md-icon>close</md-icon></md-icon-button>
    </div>
    <audio id="audio" preload="none"></audio>
  </section>

  <aside class="context-panel" id="contextPanel" hidden aria-label="Now playing details">
    <div class="context-head"><strong id="contextTitle" class="t-title-m">Now playing</strong><md-icon-button id="context-close" aria-label="Close panel"><md-icon>close</md-icon></md-icon-button></div>
    <div class="context-tabs" role="tablist" aria-label="Track context">
      <button class="context-tab" data-context-tab="lyrics" role="tab" aria-selected="true">Lyrics</button>
      <button class="context-tab" data-context-tab="info" role="tab" aria-selected="false">Track info</button>
    </div>
    <div class="context-body" id="contextBody" role="tabpanel"><div class="context-empty">Choose a track to see its lyrics and details.</div></div>
  </aside>

  <md-menu id="menu" positioning="popover" anchor-corner="end-end" menu-corner="start-end"></md-menu>

  <md-dialog id="dialog">
    <div slot="headline" id="dlgHead"></div>
    <div slot="content" id="dlgBody"></div>
    <div slot="actions" id="dlgActions"></div>
  </md-dialog>

  <div class="snackbar" id="snackbar" role="status" aria-live="polite" aria-atomic="true">
    <md-icon id="snackIcon">info</md-icon><span id="snackText"></span>
  </div>

  <script type="module">
    'use strict';

    // Material Web (M3) components. If the CDN is unreachable the app still runs, just unstyled.
    let componentsOk = true;
    try { await import('@material/web/all.js'); }
    catch (error) { componentsOk = false; console.error('Material Web failed to load', error); }

    // Keep the existing PHP API path and action contract intact.
    const path = location.pathname;
    const base = path.endsWith('/web/index.html')
      ? path.slice(0, -'web/index.html'.length)
      : path.endsWith('/') ? path : path.slice(0, path.lastIndexOf('/') + 1);
    const API = new URL(`${base}api/index.php`, location.origin).toString();
    const RECENT_KEY = `mman-recent-searches:${base}`;

    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
    const app = $('#app');
    const dialog = $('#dialog');
    const menu = $('#menu');
    const audio = $('#audio');
    const RUNNING = ['searching', 'downloading', 'lyrics', 'tagging', 'uploading_bale', 'uploading_telegram'];
    const ENTITIES = ['song', 'album', 'musicArtist'];

    let user = null;
    let page = 'search';
    let entity = 'song';
    let query = '';
    let recent = [];
    let results = [];
    let queuePage = 1;
    let queueStatus = '';
    let favoritesPage = 1;
    let poll = null;
    let searchVersion = 0;
    let toastTimer = null;
    let tracks = [];
    let playlist = [];
    let playlistIndex = -1;
    let shuffleEnabled = false;
    let repeatEnabled = false;
    let seeking = false;
    let apiInFlight = 0;
    let apiProgressTimer = null;
    let apiHideTimer = null;
    let offlineDbPromise = null;
    let offlineHydrated = false;
    const offlineIds = new Set();
    const offlineUrls = new Map();
    const offlineDownloads = new Set();
    let contextTab = 'lyrics';
    let contextTrackId = 0;
    let contextLyrics = [];
    let contextLyricsText = '';
    let activeTrack = null;

    try {
      const stored = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]');
      if (Array.isArray(stored)) recent = stored.filter(v => typeof v === 'string').slice(0, 6);
    } catch { recent = []; }

    /* ───────── helpers ───────── */
    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[char]);
    const seconds = value => value ? `${Math.floor(value / 60)}:${String(Math.floor(value % 60)).padStart(2, '0')}` : '0:00';
    const millis = value => value ? seconds(Math.floor(value / 1000)) : '';
    const post = body => ({ method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const ic = (name, attrs = '') => `<md-icon ${attrs} aria-hidden="true">${name}</md-icon>`;
    const iconBtn = (name, attrs, label, cls = '') => `<md-icon-button class="${cls}" ${attrs} aria-label="${esc(label)}" title="${esc(label)}">${ic(name)}</md-icon-button>`;
    const trackId = track => Number(track?.track_id || track?.trackId || 0);
    const source = track => track?.offline_url || offlineUrls.get(trackId(track)) || ((track?.is_crawled || track?.bale_stream_url)
      ? (track.bale_stream_url || '')
      : (track?.preview_url || track?.previewUrl || ''));
    const asTrack = item => ({
      ...item,
      track_id: item.trackId,
      name: item.trackName,
      artist_name: item.artistName,
      collection_name: item.collectionName,
      duration_ms: item.trackTimeMillis,
      preview_url: item.previewUrl,
      collection_id: item.collectionId,
      artist_id: item.artistId
    });
    const fileName = track => `${track.artist_name || track.artistName || 'Unknown'} - ${track.name || track.trackName || 'Track'}`
      .replace(/[\\/:*?"<>|]/g, '');
    const downloadUrl = track => track?.bale_stream_url || '';
    const currentTrack = () => playlist[playlistIndex] || null;
    const statusLabel = status => String(status || '').replaceAll('_', ' ');

    async function api(action, params = {}, options = {}) {
      const url = `${API}?action=${encodeURIComponent(action)}&${new URLSearchParams(params)}`;
      apiInFlight++;
      clearTimeout(apiHideTimer);
      if (!apiProgressTimer) {
        apiProgressTimer = setTimeout(() => {
          if (apiInFlight > 0) $('#requestProgress')?.classList.add('active');
          apiProgressTimer = null;
        }, 130);
      }
      try {
        const response = await fetch(url, { credentials: 'same-origin', ...options });
        let data;
        try { data = await response.json(); }
        catch { throw new Error(`Server returned HTTP ${response.status}`); }
        if (!response.ok) throw new Error(data.message || data.error || `Request failed (${response.status})`);
        return data;
      } finally {
        apiInFlight = Math.max(0, apiInFlight - 1);
        if (apiInFlight === 0) {
          clearTimeout(apiProgressTimer);
          apiProgressTimer = null;
          apiHideTimer = setTimeout(() => $('#requestProgress')?.classList.remove('active'), 180);
        }
      }
    }

    function notify(message, symbol = 'info') {
      $('#snackText').textContent = message;
      $('#snackIcon').textContent = symbol;
      const el = $('#snackbar');
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
    }

    function openOfflineDb() {
      if (offlineDbPromise) return offlineDbPromise;
      offlineDbPromise = new Promise((resolve, reject) => {
        const request = indexedDB.open(`mman-offline:${base}`, 1);
        request.onupgradeneeded = () => request.result.createObjectStore('tracks', { keyPath: 'track_id' });
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error('Offline storage is unavailable.'));
      });
      return offlineDbPromise;
    }

    async function readOfflineTrack(id) {
      const db = await openOfflineDb();
      return new Promise((resolve, reject) => {
        const request = db.transaction('tracks').objectStore('tracks').get(Number(id));
        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => reject(request.error || new Error('Could not read offline track.'));
      });
    }

    async function readOfflineTracks() {
      const db = await openOfflineDb();
      return new Promise((resolve, reject) => {
        const request = db.transaction('tracks').objectStore('tracks').getAll();
        request.onsuccess = () => resolve(request.result || []);
        request.onerror = () => reject(request.error || new Error('Could not read offline library.'));
      });
    }

    async function hydrateOfflineTracks() {
      if (offlineHydrated) return;
      const saved = await readOfflineTracks();
      saved.forEach(track => {
        const id = Number(track.track_id);
        offlineIds.add(id);
        if (track.blob && !offlineUrls.has(id)) offlineUrls.set(id, URL.createObjectURL(track.blob));
      });
      offlineHydrated = true;
    }

    async function writeOfflineTrack(track, blob) {
      const db = await openOfflineDb();
      const id = trackId(track);
      const record = {
        track_id: id, name: track.name || track.trackName || 'Track',
        artist_name: track.artist_name || track.artistName || 'Unknown artist',
        collection_name: track.collection_name || track.collectionName || '',
        artwork: track.artwork || track.artworkUrl100 || '',
        duration_ms: Number(track.duration_ms || track.trackTimeMillis || 0),
        artist_id: Number(track.artist_id || track.artistId || 0),
        collection_id: Number(track.collection_id || track.collectionId || 0),
        file_name: `${fileName(track)}.mp3`, blob, saved_at: Date.now()
      };
      await new Promise((resolve, reject) => {
        const request = db.transaction('tracks', 'readwrite').objectStore('tracks').put(record);
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error || new Error('Could not save this track offline.'));
      });
      offlineIds.add(id);
      if (offlineUrls.has(id)) URL.revokeObjectURL(offlineUrls.get(id));
      offlineUrls.set(id, URL.createObjectURL(blob));
    }

    function paintOfflineProgress(id, value, label) {
      const row = document.querySelector(`.row[data-track="${Number(id)}"] .q-local`);
      if (!row) return;
      const state = $('.q-local-state', row);
      const progress = $('md-linear-progress', row);
      const save = $('[data-action="save-local"]', row);
      if (state) state.textContent = label;
      if (progress) {
        progress.removeAttribute('indeterminate');
        progress.value = Math.max(0, Math.min(1, value / 100));
      }
      if (save) save.hidden = !offlineIds.has(Number(id));
    }

    async function cacheOfflineTrack(track) {
      const id = trackId(track);
      const url = downloadUrl(track);
      if (!id || !url || offlineIds.has(id) || offlineDownloads.has(id)) return;
      offlineDownloads.add(id);
      paintOfflineProgress(id, 0, 'Preparing offline copy');
      try {
        const response = await fetch(url, { credentials: 'same-origin' });
        if (!response.ok) throw new Error(`Audio request failed (${response.status}).`);
        const total = Number(response.headers.get('content-length')) || 0;
        let blob;
        if (response.body && total) {
          const reader = response.body.getReader();
          const chunks = [];
          let received = 0;
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value);
            received += value.byteLength;
            const percent = Math.min(99, Math.floor(received / total * 100));
            paintOfflineProgress(id, percent, `Saving offline · ${percent}%`);
          }
          blob = new Blob(chunks, { type: response.headers.get('content-type') || 'audio/mpeg' });
        } else {
          blob = await response.blob();
        }
        if (!blob.size) throw new Error('The downloaded audio file was empty.');
        await writeOfflineTrack(track, blob);
        paintOfflineProgress(id, 100, 'Available offline');
      } catch (error) {
        paintOfflineProgress(id, 0, `Offline copy failed: ${error.message}`);
      } finally {
        offlineDownloads.delete(id);
      }
    }

    async function saveOfflineFile(id, button) {
      try {
        const record = await readOfflineTrack(id);
        if (!record?.blob) throw new Error('This track is not saved offline yet.');
        const url = URL.createObjectURL(record.blob);
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.download = record.file_name || 'track.mp3';
        document.body.append(anchor);
        anchor.click();
        anchor.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        notify('File saved to your device', 'download_done');
      } catch (error) {
        notify(error.message, 'error');
      } finally {
        if (button) button.disabled = false;
      }
    }

    async function removeOfflineTrack(id) {
      try {
        const db = await openOfflineDb();
        await new Promise((resolve, reject) => {
          const request = db.transaction('tracks', 'readwrite').objectStore('tracks').delete(Number(id));
          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error || new Error('Could not remove offline track.'));
        });
        offlineIds.delete(Number(id));
        if (offlineUrls.has(Number(id))) URL.revokeObjectURL(offlineUrls.get(Number(id)));
        offlineUrls.delete(Number(id));
        notify('Removed from offline library', 'check_circle');
        renderOffline();
      } catch (error) { notify(error.message, 'error'); }
    }

    function setPage(nextPage) {
      setNavigation(nextPage);
      clearInterval(poll);
      window.scrollTo({ top: 0 });
      if (nextPage === 'queue') {
        renderQueue();

      } else if (nextPage === 'favorites') {

    async function search(term) {
      const nextQuery = String(term ?? $('#searchInput')?.value ?? query).trim();
      if (!nextQuery) return;
      query = nextQuery;
      if (page !== 'search') { setNavigation('search'); renderSearch(); return; }
      const input = $('#searchInput');
      if (input) input.value = query;
      const container = $('#resultsArea');
      if (!container) return;
      container.innerHTML = loadingRows();
      const version = ++searchVersion;
      try {
        const data = await api('search', { term: query, entity, limit: 50 });
        if (version !== searchVersion || page !== 'search') return;
        results = data.results || [];
        recent = [query, ...recent.filter(value => value.toLowerCase() !== query.toLowerCase())].slice(0, 6);
        try { localStorage.setItem(RECENT_KEY, JSON.stringify(recent)); } catch { /* Storage can be unavailable. */ }
        const recentArea = $('#recentArea');
        if (recentArea) recentArea.innerHTML = recentMarkup();
        showResults();
      } catch (error) {
        if (version !== searchVersion) return;
        container.innerHTML = emptyState('Search didn’t finish', error.message, 'error', '<md-filled-tonal-button data-action="retry-search">Try again</md-filled-tonal-button>');
      }
    }

    function showResults() {
      const container = $('#resultsArea');
      if (!container) return;
      if (entity === 'album') {
        tracks = [];
        const albums = results.filter(item => item.wrapperType === 'collection');
        container.innerHTML = albums.length
          ? `${sectionHead(`${albums.length} albums`, `Matching “${esc(query)}”`)}<div class="grid">${albums.map(albumCard).join('')}</div>`
          : emptyState('No albums found', 'Try a different title, artist or spelling.', 'album');
        return;
      }
      if (entity === 'musicArtist') {
        tracks = [];
        container.innerHTML = results.length
          ? `${sectionHead(`${results.length} artists`, `Matching “${esc(query)}”`)}<div class="rows">${results.map(artistRow).join('')}</div>`
          : emptyState('No artists found', 'Try a different name or a shorter search.', 'group');
        return;
      }
      tracks = results.filter(item => item.wrapperType === 'track').map(asTrack);
      container.innerHTML = tracks.length
        ? `${sectionHead(`${tracks.length} songs`, `Matching “${esc(query)}”`, 'Previews and full tracks')}<div class="rows">${tracks.map(track => trackRow(track, { add: true, ctx: 'search' })).join('')}</div>`
        : emptyState('No songs found', 'Try another title or artist. You can also search by album or mood.', 'music_note');
    }

    function albumCard(item) {
      const track = item.track_id ? item : asTrack(item);
      const id = Number(track.collection_id || item.collectionId || 0);
      const title = track.name || track.collection_name || item.collectionName || 'Untitled album';
      const artist = track.artist_name || item.artistName || '';
      return `<article class="album">
        <button class="album-art" data-action="open-album" data-id="${id}" aria-label="Open ${esc(title)}"><md-ripple></md-ripple><img loading="lazy" src="${esc(track.artwork || item.artworkUrl100 || '')}" alt=""></button>
        <div class="album-meta">
          <div><strong title="${esc(title)}">${esc(title)}</strong><span title="${esc(artist)}">${esc(artist)}</span></div>
          ${iconBtn('download', `data-action="queue-add" data-type="collection" data-id="${id}"`, 'Queue album for download')}
        </div>
      </article>`;
    }

    function artistRow(item) {
      const id = Number(item.artistId || 0);
      return `<article class="artist-row">
        <div class="avatar"><img loading="lazy" src="${esc(item.artwork || '')}" alt=""></div>
        <div class="row-text"><div class="row-title"><span>${esc(item.artistName || 'Unknown artist')}</span></div><div class="row-sub">${esc(item.primaryGenreName || 'Artist')}</div></div>
        <div class="artist-actions">
          <md-outlined-button data-action="open-artist" data-id="${id}">View</md-outlined-button>
          <md-filled-tonal-button data-action="queue-add" data-type="artist" data-id="${id}"><md-icon slot="icon">download</md-icon>Crawl catalog</md-filled-tonal-button>

      </article>`;

    /* ───────── track rows ───────── */
    function queueStageMarkup(status) {
      const stages = ['Find', 'Audio', 'Lyrics', 'Tags', 'Publish'];
      const current = ({ searching: 0, downloading: 1, lyrics: 2, tagging: 3, uploading_bale: 4, uploading_telegram: 4, done: 5 })[status] ?? -1;
      return `<div class="stages" aria-label="Processing stages">${stages.map((label, index) => {
        const state = current > index ? 'complete' : current === index ? 'active' : '';
        return `<span class="stage ${state}"><i></i><span>${label}</span></span>`;
      }).join('')}</div>`;
    }

    function queuePhaseHint(status) {
      return ({
        queued: 'Waiting for an available worker',
        searching: 'Looking for a matching audio source',
        downloading: 'Retrieving and preparing the audio file',
        lyrics: 'Finding and matching lyrics',
        tagging: 'Writing track information and artwork',
        uploading_bale: 'Publishing the finished track to Bale',
        uploading_telegram: 'Publishing the finished track to Telegram',
        done: 'Your track is ready to play and download',
        failed: 'This item needs attention. You can try it again.'
      })[status] || 'Waiting for the next processing update';
    }

    function queueBlock(track, id, title, fullUrl) {
      const status = track.status || 'queued';
      const running = RUNNING.includes(status);
      const progress = Math.max(0, Math.min(100, Number(track.progress) || 0));
      const queueId = Number(track.id || 0);
      const locallySaved = offlineIds.has(Number(track.track_id || id));
      const symbol = status === 'done' ? 'check_circle' : status === 'failed' ? 'error' : running ? 'sync' : 'schedule';
      const bar = running && progress === 0 ? 'indeterminate' : `value="${status === 'done' ? 1 : progress / 100}"`;
      return `<div class="q ${running ? 'running' : ''} ${status === 'failed' ? 'failed' : status === 'done' ? 'done' : ''}">
        <div class="q-top"><span class="q-status">${ic(symbol)}${esc(statusLabel(status))}</span><span class="t-label-m variant">${progress}%</span></div>
        <md-linear-progress ${bar} aria-label="Processing progress for ${esc(title)}"></md-linear-progress>
        ${!['done', 'failed'].includes(status) ? queueStageMarkup(status) : ''}
        <div class="q-hint">${esc(track.message || queuePhaseHint(status))}</div>
        ${status === 'done' && fullUrl ? `<div class="q-local"><div class="q-top"><span class="q-local-state">${locallySaved ? 'Available offline' : 'Waiting for offline transfer'}</span><md-icon-button data-action="save-local" data-id="${id}" aria-label="Save file to device" title="Save file to device" ${locallySaved ? '' : 'hidden'}>${ic('download')}</md-icon-button></div>
          <md-linear-progress ${locallySaved ? 'value="1"' : offlineDownloads.has(Number(id)) ? 'value="0"' : 'indeterminate'} aria-label="Offline download progress"></md-linear-progress></div>` : ''}
        <div class="q-links">
          ${status === 'done' && fullUrl ? `<md-text-button data-action="save-local" data-id="${id}">Save file</md-text-button>` : ''}
          ${track.telegram_url ? `<md-text-button href="${esc(track.telegram_url)}" target="_blank">Telegram</md-text-button>` : ''}
          ${track.bale_url ? `<md-text-button href="${esc(track.bale_url)}" target="_blank">Bale</md-text-button>` : ''}
          ${status === 'failed' ? `<md-text-button data-action="retry" data-id="${id}">Try again</md-text-button>` : ''}
          ${['queued', 'failed', 'done'].includes(status) ? `<md-text-button data-action="remove-queue" data-id="${queueId}">Remove</md-text-button>` : ''}
        </div>
      </div>`;
    }

    function trackRow(track, options = {}) {
      const { add = false, queue = false, offline = false, ctx = 'search' } = options;
      const id = trackId(track);
      const title = track.name || track.trackName || 'Unknown track';
      const artist = track.artist_name || track.artistName || 'Unknown artist';
      const playable = source(track);
      const album = track.collection_name || track.collectionName || '';
      const fullUrl = downloadUrl(track);
      const isPlaying = currentTrack() && trackId(currentTrack()) === id && !$('#player').hidden;
      const artwork = track.artwork || track.artworkUrl100 || '';

      return `<article class="row ${isPlaying ? 'now' : ''}" data-track="${id}">
        <button class="art" ${playable ? `data-action="play" data-src="${esc(playable)}" data-title="${esc(title)}" data-artist="${esc(artist)}" data-id="${id}"` : 'disabled'} aria-label="${playable ? `Play ${esc(title)}` : 'No preview available'}">
          <md-ripple></md-ripple><img loading="lazy" src="${esc(artwork)}" alt=""><span class="art-play">${ic('play_arrow')}</span>
        </button>
        <div class="row-text">
          <div class="row-title"><span title="${esc(title)}">${esc(title)}</span><span class="badge ${track.is_crawled || offline ? 'full' : ''}">${offline ? 'Offline' : track.is_crawled ? 'Full' : 'Preview'}</span></div>
          <div class="row-sub" title="${esc(artist)}">${esc(artist)}${album ? ` · ${esc(album)}` : ''}</div>
        </div>
        <div class="row-actions">
          ${iconBtn('favorite', `data-action="favorite" data-id="${id}"`, track.is_favorite ? `Remove ${title} from liked songs` : `Like ${title}`, `fav ${track.is_favorite ? 'on' : ''}`)}
          ${add ? iconBtn('download', `data-action="queue-add" data-type="track" data-id="${id}"`, 'Add to download queue') : ''}
          ${offline ? iconBtn('download', `data-action="save-local" data-id="${id}"`, 'Save file to device') : ''}
          ${offline ? iconBtn('delete', `data-action="remove-offline" data-id="${id}"`, 'Remove offline copy') : ''}
          ${iconBtn('more_vert', `data-action="track-menu" data-id="${id}" data-ctx="${ctx}"`, 'More actions')}
        </div>
        ${queue ? queueBlock(track, id, title, fullUrl) : ''}
      </article>`;
    }

    function openTrackMenu(anchor, id, ctx) {
      const track = [...tracks, ...results].find(item => trackId(item) === id && (item.name || item.trackName));
      if (!track) return;
      const title = track.name || track.trackName || 'Unknown track';
      const artist = track.artist_name || track.artistName || 'Unknown artist';
      const playable = source(track);
      const fullUrl = downloadUrl(track);
      const ready = track.status === 'done' || (ctx !== 'queue' && track.is_crawled);
      const item = (action, symbol, label, attrs = '') => `<md-menu-item data-action="${action}" ${attrs}><md-icon slot="start">${symbol}</md-icon><div slot="headline">${label}</div></md-menu-item>`;
      let html = '';
      if (playable) html += item('play', 'play_arrow', 'Play', `data-src="${esc(playable)}" data-title="${esc(title)}" data-artist="${esc(artist)}" data-id="${id}"`);
      html += item('details', 'info', 'Details', `data-id="${id}"`);
      html += item('lyrics', 'lyrics', 'Lyrics', `data-id="${id}" data-title="${esc(title)}"`);
      if (ready && fullUrl) html += item('download', 'download', 'Download', `data-url="${esc(fullUrl)}" data-name="${esc(fileName(track))}"`);
      if (ctx === 'queue') {
        if (track.status === 'failed') html += item('retry', 'replay', 'Try again', `data-id="${id}"`);
        if (['queued', 'failed', 'done'].includes(track.status)) html += item('remove-queue', 'delete', 'Remove from queue', `data-id="${Number(track.id || 0)}"`);
      }
      showMenu(anchor, html);
    }

    function markNowPlaying() {
      const playing = currentTrack() && !$('#player').hidden ? trackId(currentTrack()) : 0;
      $$('.row[data-track]').forEach(row => row.classList.toggle('now', Boolean(playing) && Number(row.dataset.track) === playing));

            <div class="entity-meta"><h2 class="t-headline">${esc(first.collectionName || 'Album')}</h2><p class="t-body-l variant">${esc(first.artistName || '')} · ${songItems.length} songs</p>

      if (!user) { showAuth(); notify('Sign in to save music to your queue', 'lock'); return; }
      try {
        const data = await api('queue_add', {}, post({ type, id }));
        notify(`${data.added} ${data.added === 1 ? 'song' : 'songs'} added to your queue`, 'check_circle');
        if (page === 'queue') loadQueue(true);
      } catch (error) { notify(error.message, 'error'); }

      button.classList.toggle('on', on);
      button.setAttribute('aria-label', on ? 'Remove from liked songs' : 'Like track');

    async function toggleFavorite(id) {
      if (!id) { notify('Open a song first to like it', 'info'); return; }
      if (!user) { showAuth(); return; }

    async function loadQueue(silent = false) {

        if (page !== 'queue') return;
        $('#queueCount').textContent = `${data.total || 0} ${Number(data.total) === 1 ? 'song' : 'songs'}`;
        const counts = data.status_counts || {};
        const all = Object.values(counts).reduce((sum, value) => sum + Number(value || 0), 0);
        const active = RUNNING.reduce((sum, key) => sum + Number(counts[key] || 0), 0);
        const readyCount = Number(counts.done || 0);
        const waitingCount = Number(counts.queued || 0);
        const completion = all ? Math.round((readyCount / all) * 100) : 0;
        const overview = $('#queueOverview');
        if (overview) {
          overview.hidden = !all;
          overview.innerHTML = all ? `<div class="overview-head">
            <div><div class="t-label-m variant">Queue completion</div><div class="t-title-l">${completion}% prepared</div></div>
            <span class="t-label-m variant">Synced ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
          </div>
          <md-linear-progress value="${completion / 100}" aria-label="Queue completion"></md-linear-progress>
          <div class="overview-foot"><span><b>${readyCount}</b> ready</span><span><b>${active}</b> processing</span><span><b>${waitingCount}</b> waiting</span></div>` : '';
        }
        $('#queueStats').innerHTML = [
          ['', 'All songs', all, 'library_music'],
          ['queued', 'Up next', counts.queued || 0, 'schedule'],
          ['downloading', 'In progress', active, 'sync'],

    function metadataValue(key, value) {
      if (key === 'trackTimeMillis') return `${millis(value)} (${Number(value).toLocaleString()} ms)`;
      if (key === 'releaseDate') return new Date(value).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
      if (typeof value === 'boolean') return value ? 'Yes' : 'No';
      return typeof value === 'object' ? JSON.stringify(value) : String(value);

    function renderDetails(track) {
      const title = track.trackName || track.name || 'Unknown track';
      const artist = track.artistName || track.artist_name || '';
      const excluded = new Set(['artwork', 'artworkUrl30', 'artworkUrl60', 'artworkUrl100', 'previewUrl', 'trackViewUrl', 'collectionViewUrl', 'artistViewUrl', 'is_crawled', 'bale_stream_url']);
      const metadata = Object.entries(track).filter(([key, value]) => !excluded.has(key) && value !== null && value !== '' && value !== undefined);
      let playback;
      if (track.is_crawled) {
        playback = track.bale_stream_url

          : '<p class="t-body-s variant" style="margin:0">Full playback isn’t configured for this track.</p>';
      } else {
        playback = track.previewUrl ? `<audio controls preload="none" src="${esc(track.previewUrl)}"></audio>` : '<p class="t-body-s variant" style="margin:0">No preview available.</p>';
      }
      const externalLink = (url, label) => typeof url === 'string' && /^https:\/\//i.test(url)
        ? `<a class="t-body-s" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${label}</a>` : '';
      $('#dlgHead').textContent = title;
      $('#dlgBody').innerHTML = `<div class="detail-top"><img src="${esc(track.artwork || track.artworkUrl100 || '')}" alt="">
          <div><strong class="t-title-m" style="display:block">${esc(artist)}</strong><p class="t-body-s variant" style="margin:2px 0 12px">${esc(track.collectionName || track.collection_name || 'Single')}</p>${playback}</div>
        </div>
        <div class="kv">${metadata.map(([key, value]) => `<div class="kv-item"><span>${esc(key.replace(/([a-z0-9])([A-Z])/g, '$1 $2').replace(/^./, c => c.toUpperCase()))}</span><strong>${esc(metadataValue(key, value))}</strong></div>`).join('')}</div>

    function parseSyncedLyrics(text) {
      return String(text || '').split(/\r?\n/).flatMap(line => {
        const timestamps = [...line.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
        if (!timestamps.length) return [];
        const lyric = line.replace(/\[\d+:(?:\d+(?:\.\d+)?)\]/g, '').trim();
        return timestamps.map(match => ({
          time: (Number(match[1]) * 60 + Number(match[2])) * 1000,
          text: lyric
        }));
      }).sort((left, right) => left.time - right.time);
    }

    function syncContextLyrics() {
      if ($('#contextPanel').hidden || contextTab !== 'lyrics' || !contextLyrics.length) return;
      const current = (audio.currentTime || 0) * 1000;
      let activeIndex = -1;
      contextLyrics.forEach((line, index) => {
        if (line.time <= current) activeIndex = index;
      });
      $$('.lyric-line', $('#contextBody')).forEach((line, index) => {
        line.classList.toggle('past', index < activeIndex);
        line.classList.toggle('active', index === activeIndex);
        if (index === activeIndex && line.dataset.index !== String(contextLyrics.lastActiveIndex)) {
          line.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
      });
      contextLyrics.lastActiveIndex = activeIndex;
    }

    async function renderContextLyrics(track) {
      const id = trackId(track);
      const body = $('#contextBody');
      if (!id) {
        body.innerHTML = '<div class="context-empty">Choose a track to see its lyrics.</div>';
        return;

      body.innerHTML = '<div class="context-empty">Finding lyrics…</div>';
      try {
        const data = await api('lyrics', { track_id: id });
        if (contextTrackId !== id || contextTab !== 'lyrics') return;
        contextLyricsText = data.lyrics_synced || '';
        contextLyrics = parseSyncedLyrics(contextLyricsText);
        const title = track.name || track.trackName || 'Unknown track';
        const artist = track.artist_name || track.artistName || 'Unknown artist';
        const sourceLabel = data.lyrics_source ? ` · ${esc(data.lyrics_source)}` : '';
        if (contextLyrics.length) {
          body.innerHTML = `<div class="context-track">${esc(title)} · ${esc(artist)}${sourceLabel}</div><div class="context-lyrics">${contextLyrics.map((line, index) => `<button class="lyric-line" data-action="lyric-seek" data-time="${line.time}" data-index="${index}">${esc(line.text || '♪')}</button>`).join('')}</div>`;
          syncContextLyrics();
        } else {
          const plain = data.lyrics_plain || contextLyricsText;
          body.innerHTML = `<div class="context-track">${esc(title)} · ${esc(artist)}${sourceLabel}</div>${plain ? `<div class="lyrics">${esc(plain)}</div>` : '<div class="context-empty">Lyrics aren’t available for this track.</div>'}`;
        }
      } catch (error) {
        if (contextTrackId === id) body.innerHTML = `<div class="context-empty">${esc(error.message || 'Lyrics are unavailable.')}</div>`;
      }
    }

    function renderContextInfo(track) {
      const body = $('#contextBody');

        <div class="kv">${fields.map(([label, value]) => `<div class="kv-item"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`).join('')}</div>
