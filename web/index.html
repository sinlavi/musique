    function renderSearch() {
      setNavigation('search');
      const genres = ['Pop', 'Indie', 'Jazz', 'Classical', 'Electronic', 'R&B', 'Rock', 'Hip-Hop', 'Country', 'Metal', 'Persian', 'Lo-Fi'];

      app.innerHTML = `${pageHeading('Find your next favorite.', 'Search songs, albums and artists. Download them and keep the music you come back to.')}
        <div class="searchrow page-enter">
          <div class="search-field">
            ${ic('search')}
            <input id="searchInput" type="search" value="${esc(query)}" placeholder="Search a song, artist, album or mood…" enterkeyhint="search" autocomplete="off" aria-label="Search music">
            <button type="button" class="icon-btn ripple" id="clearSearch" data-action="clear-search" aria-label="Clear search" ${query ? '' : 'hidden'}>${ic('close')}</button>
          </div>
          <button type="button" class="icon-btn icon-btn--filled ripple" id="searchGo" data-action="do-search" aria-label="Search">${ic('arrow_forward')}</button>
        </div>
        <div class="tabs" role="tablist" aria-label="Search type">
          ${ENTITIES.map((value, index) => `<button type="button" class="tab ripple ${entity === value ? 'active' : ''}" role="tab" aria-selected="${entity === value}" data-entity="${value}">${ENTITY_LABELS[index]}</button>`).join('')}
        </div>
        <div class="sort-row" hidden>
          <div class="select">
            <select id="sort" aria-label="Sort search results">
              <option value="relevance" selected>Best match</option>
              <option value="title">Title</option>
              <option value="artist">Artist</option>
            </select>
            ${ic('arrow_drop_down')}
          </div>
        </div>
        <div id="recentArea">${query ? '' : recentMarkup()}</div>
        <div id="resultsArea">${query ? loadingRows() : `
          ${sectionHead('Browse genres', 'Tap a genre to start searching')}
          <div class="chips">${genres.map(genre => `<button type="button" class="chip ripple" data-action="genre" data-term="${esc(genre)}">${esc(genre)}</button>`).join('')}</div>
        `}</div>`;
      if (query) search(query);
    }

    async function search(term) {
      const nextQuery = String(term ?? $('#searchInput')?.value ?? query).trim();
      if (!nextQuery) return;
      query = nextQuery;
      if (page !== 'search') { setNavigation('search'); renderSearch(); return; }
      const input = $('#searchInput');
      if (input) input.value = query;
      const container = $('#resultsArea');
      if (!container) return;
      container.innerHTML = loadingRows();
      const version = ++searchVersion;
      try {
        const data = await api('search', { term: query, entity, limit: 50 });
        if (version !== searchVersion || page !== 'search') return;
        results = data.results || [];
        recent = [query, ...recent.filter(value => value.toLowerCase() !== query.toLowerCase())].slice(0, 8);
        try { localStorage.setItem(RECENT_KEY, JSON.stringify(recent)); } catch { /* Storage can be unavailable. */ }
        const recentArea = $('#recentArea');
        if (recentArea) recentArea.innerHTML = recentMarkup();
        showResults();
      } catch (error) {
        if (version !== searchVersion) return;
        container.innerHTML = emptyState('Search didn’t finish', error.message, 'error', btnContained('Try again', 'data-action="retry-search"'));
      }
    }

    function showResults() {
      const container = $('#resultsArea');
      if (!container) return;
      if (entity === 'album') {
        tracks = [];
        const albums = results.filter(item => item.wrapperType === 'collection');
        container.innerHTML = albums.length
          ? `${sectionHead(`${albums.length} albums`, `Matching “${esc(query)}”`)}<div class="grid">${albums.map(albumCard).join('')}</div>`
          : emptyState('No albums found', 'Try a different title, artist or spelling.', 'album');
        return;
      }
      if (entity === 'musicArtist') {
        tracks = [];
        container.innerHTML = results.length
          ? `${sectionHead(`${results.length} artists`, `Matching “${esc(query)}”`)}<div class="rows">${results.map(artistRow).join('')}</div>`
          : emptyState('No artists found', 'Try a different name or a shorter search.', 'group');
        return;
      }
      tracks = results.filter(item => item.wrapperType === 'track').map(asTrack);
      container.innerHTML = tracks.length
        ? `${sectionHead(`${tracks.length} songs`, `Matching “${esc(query)}”`, 'Previews and full tracks')}<div class="rows">${tracks.map(track => trackRow(track, { add: true, ctx: 'search' })).join('')}</div>`
        : emptyState('No songs found', 'Try another title or artist. You can also search by album or mood.', 'music_note');
    }

    function albumCard(item) {
      const track = item.track_id ? item : asTrack(item);
      const id = Number(track.collection_id || item.collectionId || 0);
      const title = track.name || track.collection_name || item.collectionName || 'Untitled album';
      const artist = track.artist_name || item.artistName || '';
      return `<article class="album">
        <button type="button" class="album-art ripple" data-action="open-album" data-id="${id}" aria-label="Open ${esc(title)}">
          <img loading="lazy" src="${esc(track.artwork || item.artworkUrl100 || '')}" alt="">
        </button>
        <div class="album-meta">
          <div><strong title="${esc(title)}">${esc(title)}</strong><span title="${esc(artist)}">${esc(artist)}</span></div>
          ${iconBtn('download', `data-action="queue-add" data-type="collection" data-id="${id}"`, 'Download album')}
        </div>
      </article>`;
    }

    function artistRow(item) {
      const id = Number(item.artistId || 0);
      return `<article class="artist-row">
        <div class="avatar"><img loading="lazy" src="${esc(item.artwork || '')}" alt=""></div>
        <div class="row__text"><div class="row__title"><span>${esc(item.artistName || 'Unknown artist')}</span></div><div class="row__sub">${esc(item.primaryGenreName || 'Artist')}</div></div>
        <div class="artist-actions">
          ${btnOutlined('View', `data-action="open-artist" data-id="${id}"`)}
          ${btnOutlined('Follow', `data-action="follow-artist" data-id="${id}"`, 'person_add')}
          ${btnContained('Crawl 300', `data-action="queue-add" data-type="artist" data-id="${id}"`, 'download')}
        </div>
      </article>`;
    }

    /* ───────────── track rows ───────────── */
    function queueStageMarkup(status) {
      const current = ({ searching: 0, downloading: 1, lyrics: 2, tagging: 3, uploading_bale: 4, uploading_telegram: 4, done: 5 })[status] ?? -1;
      return `<div class="stages" aria-label="Processing stages">${QUEUE_STAGES.map(([label], index) => {
        const state = current > index ? 'complete' : current === index ? 'active' : '';
        return `<span class="stage ${state}"><i></i><span>${label}</span></span>`;
      }).join('')}</div>`;
    }

    function queuePhaseHint(status) {
      return ({
        queued: 'Waiting for an available worker',
        searching: 'Looking for a matching audio source',
        downloading: 'Retrieving and preparing the audio file',
        lyrics: 'Finding and matching lyrics',
        tagging: 'Writing track information and artwork',
        uploading_bale: 'Publishing the finished track to Bale',
        uploading_telegram: 'Publishing the finished track to Telegram',
        done: 'Your track is ready to play and download',
        failed: 'This item needs attention. You can try it again.'
      })[status] || 'Waiting for the next processing update';
    }

    function queueBlock(track, id, title, fullUrl) {
      const status = track.status || 'queued';
      const running = RUNNING.includes(status);
      const progress = Math.max(0, Math.min(100, Number(track.progress) || 0));
      const queueId = Number(track.id || 0);
      const symbol = status === 'done' ? 'check_circle' : status === 'failed' ? 'error' : running ? 'sync' : 'schedule';
      const barValue = running && progress === 0 ? 'indeterminate' : (status === 'done' ? 1 : progress / 100);
      const stepIndex = ({ searching: 0, downloading: 1, lyrics: 2, tagging: 3, uploading_bale: 4, uploading_telegram: 4 })[status];
      const stepLabel = stepIndex === undefined ? '' : `Step ${stepIndex + 1} of 5 · ${QUEUE_STAGES[stepIndex][0]}`;

      return `<div class="q ${running ? 'running' : ''} ${status === 'failed' ? 'failed' : status === 'done' ? 'done' : ''}">
        <div class="q-top"><span class="q-status">${ic(symbol)}${esc(statusLabel(status))}</span><span class="caption muted">${stepLabel || `${progress}%`}</span></div>
        ${progressBar(barValue, `Processing progress for ${title}`)}
        ${!['done', 'failed'].includes(status) ? queueStageMarkup(status) : ''}
        <div class="q-hint">${esc(track.message || queuePhaseHint(status))}</div>
        <div class="q-links">
          ${status === 'done' && fullUrl && !isOfflineReady(id) ? btnText('Download file', `data-action="download" data-url="${esc(fullUrl)}" data-name="${esc(fileName(track))}"`) : ''}
          ${status === 'done' && isOfflineReady(id) ? btnText('Save file', `data-action="save-offline" data-id="${id}"`) : ''}
          ${track.telegram_url ? `<a class="btn btn--text" href="${esc(track.telegram_url)}" target="_blank" rel="noopener">Telegram</a>` : ''}
          ${track.bale_url ? `<a class="btn btn--text" href="${esc(track.bale_url)}" target="_blank" rel="noopener">Bale</a>` : ''}
          ${status === 'failed' ? btnText('Try again', `data-action="retry" data-id="${id}"`) : ''}
          ${['queued', 'failed', 'done'].includes(status) ? btnText('Remove', `data-action="remove-queue" data-id="${queueId}"`) : ''}
        </div>
      </div>`;
    }

    function trackRow(track, options = {}) {
      const { add = false, queue = false, ctx = 'search' } = options;
      const id = trackId(track);
      const title = track.name || track.trackName || 'Unknown track';
      const artist = track.artist_name || track.artistName || 'Unknown artist';
      const playable = source(track);
      const album = track.collection_name || track.collectionName || '';
      const fullUrl = downloadUrl(track);
      const isPlaying = currentTrack() && trackId(currentTrack()) === id && !$('#player').hidden;
      const artwork = track.artwork || track.artworkUrl100 || '';
      const offlineReady = isOfflineReady(id);

      return `<article class="row ${isPlaying ? 'row--now' : ''}" data-track="${id}">
        <button type="button" class="art ripple" ${playable ? `data-action="play" data-src="${esc(playable)}" data-title="${esc(title)}" data-artist="${esc(artist)}" data-id="${id}"` : 'disabled'} aria-label="${playable ? `Play ${esc(title)}` : 'No preview available'}">
          <img loading="lazy" src="${esc(artwork)}" alt=""><span class="art__play">${ic('play_arrow')}</span>
        </button>
        <div class="row__text">
          <div class="row__title">
            <span title="${esc(title)}">${esc(title)}</span>
            ${offlineReady
              ? '<span class="badge offline">Offline</span>'
              : `<span class="badge ${track.is_crawled ? 'full' : ''}">${track.is_crawled ? 'Full' : 'Preview'}</span>`}
          </div>
          <div class="row__sub" title="${esc(artist)}">${esc(artist)}${album ? ` · ${esc(album)}` : ''}</div>
        </div>
        <div class="row__actions">
          ${iconBtn('favorite', `data-action="favorite" data-id="${id}"`, track.is_favorite ? `Remove ${title} from liked songs` : `Like ${title}`, `fav ${track.is_favorite ? 'on' : ''}`)}
          ${add ? iconBtn('download', `data-action="queue-add" data-type="track" data-id="${id}"`, 'Download / add to queue') : ''}
          ${iconBtn('more_vert', `data-action="track-menu" data-id="${id}" data-ctx="${ctx}"`, 'More actions')}
        </div>
        ${queue ? queueBlock(track, id, title, fullUrl) : ''}
        <div class="offline-slot" data-offline-slot="${id}">${offlineSlotHTML(id)}</div>
      </article>`;
    }

    function findTrack(id) {
      return [...tracks, ...results].find(item => trackId(item) === Number(id) && (item.name || item.trackName)) || null;
    }

    function openTrackMenu(anchor, id, ctx) {
      const track = findTrack(id);
      if (!track) return;
      const title = track.name || track.trackName || 'Unknown track';
      const artist = track.artist_name || track.artistName || 'Unknown artist';
      const playable = source(track);
      const fullUrl = downloadUrl(track);
      const ready = track.status === 'done' || (ctx !== 'queue' && track.is_crawled);
      const offlineReady = isOfflineReady(id);
      let html = '';
      if (playable) html += menuItem('play', 'play_arrow', 'Play', `data-src="${esc(playable)}" data-title="${esc(title)}" data-artist="${esc(artist)}" data-id="${id}"`);
      if (offlineReady) html += menuItem('save-offline', 'save_alt', 'Save file to device', `data-id="${id}"`);
      html += menuItem('details', 'info', 'Details', `data-id="${id}"`);
      html += menuItem('lyrics', 'lyrics', 'Lyrics', `data-id="${id}" data-title="${esc(title)}"`);
      html += menuItem('playlist-add-track', 'playlist_add', 'Add to playlist', `data-id="${id}"`);
      if (ready && fullUrl && !offlineReady) html += menuItem('download', 'download', 'Download file', `data-url="${esc(fullUrl)}" data-name="${esc(fileName(track))}"`);
      if (!offlineReady && fullUrl) html += menuItem('queue-add', 'cloud_download', 'Save for offline', `data-type="track" data-id="${id}"`);
      if (ctx === 'queue') {
        if (track.status === 'failed') html += menuItem('retry', 'replay', 'Try again', `data-id="${id}"`);
        if (['queued', 'failed', 'done'].includes(track.status)) html += menuItem('remove-queue', 'delete', 'Remove from queue', `data-id="${Number(track.id || 0)}"`);
      }
      if (ctx === 'playlist') html += menuItem('playlist-remove-track', 'playlist_remove', 'Remove from playlist', `data-id="${id}"`);
      showMenu(anchor, html);
    }

    function markNowPlaying() {
      const playing = currentTrack() && !$('#player').hidden ? trackId(currentTrack()) : 0;
      $$('.row[data-track]').forEach(row => row.classList.toggle('row--now', Boolean(playing) && Number(row.dataset.track) === playing));
    }

    /* ───────────── album / artist pages ───────────── */
    async function openAlbum(id) {
      app.innerHTML = loadingRows(4);
      try {
        const { results: items = [] } = await api('lookup', { id, entity: 'song' });
        const songItems = items.filter(item => item.wrapperType === 'track');
        const first = songItems[0] || items[0] || {};
        tracks = songItems.map(asTrack);
        const totalMs = tracks.reduce((sum, track) => sum + Number(track.duration_ms || 0), 0);
        const year = first.releaseDate ? new Date(first.releaseDate).getFullYear() : '';
        app.innerHTML = `<div class="page-enter">
          ${btnText('Back', 'data-action="back"', 'arrow_back')}
          <div class="entity">
            <img src="${esc(first.artwork || first.artworkUrl100 || '')}" alt="">
            <div class="entity-meta">
              <div class="overline muted">Album</div>
              <h2 class="h5">${esc(first.collectionName || 'Album')}</h2>
              <p class="body2 muted">${esc(first.artistName || '')}${year ? ` · ${year}` : ''} · ${songItems.length} songs${totalMs ? ` · ${seconds(totalMs / 1000)}` : ''}</p>
              <div class="chips">
                ${btnContained('Play', 'data-action="play-all"', 'play_arrow')}
                ${btnOutlined('Download album', `data-action="queue-add" data-type="collection" data-id="${Number(id)}"`, 'download')}
                ${first.artistId ? btnOutlined('Artist', `data-action="open-artist" data-id="${Number(first.artistId)}"`, 'person') : ''}
              </div>
            </div>
          </div>
          <div class="rows">${tracks.map(track => trackRow(track, { add: true, ctx: 'album' })).join('') || emptyState('No tracks listed', 'This album does not have any available tracks.', 'album')}</div>

    function autoOfflineFromQueue(items) {

      items.forEach(item => {

      });

    async function loadQueue(silent = false) {
      const list = $('#queueItems');
      if (!user) {
        if (list) list.innerHTML = emptyState('Your queue is private', 'Sign in to see the songs you’ve added and follow their progress.', 'lock', btnContained('Sign in', 'data-action="auth"'));
        clearInterval(poll);
        return;
      }
      if (!silent && list) list.innerHTML = loadingRows(5);
      try {
        const data = await api('queue_list', { page: queuePage, per_page: 25, status: queueStatus }, { silent });
        const items = data.items || [];
        tracks = items;
        autoOfflineFromQueue(items);
        if (page !== 'queue') return;
        $('#queueCount').textContent = `${data.total || 0} ${Number(data.total) === 1 ? 'song' : 'songs'}`;
        const counts = data.status_counts || {};
        const all = Object.values(counts).reduce((sum, value) => sum + Number(value || 0), 0);
        const active = RUNNING.reduce((sum, key) => sum + Number(counts[key] || 0), 0);
        const readyCount = Number(counts.done || 0);
        const waitingCount = Number(counts.queued || 0);
        const completion = all ? Math.round((readyCount / all) * 100) : 0;
        const overview = $('#queueOverview');
        if (overview) {
          overview.hidden = !all;
          overview.innerHTML = all ? `<div class="overview-head">
            <div><div class="overline muted">Queue completion</div><div class="h6">${completion}% prepared</div></div>
            <span class="caption muted">Synced ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
          </div>
          ${progressBar(completion / 100, 'Queue completion')}
          <div class="overview-foot"><span><b>${readyCount}</b> ready</span><span><b>${active}</b> processing</span><span><b>${waitingCount}</b> waiting</span></div>` : '';
        }
        $('#queueStats').innerHTML = [
          ['', 'All songs', all, 'library_music'],
          ['queued', 'Up next', counts.queued || 0, 'schedule'],
          ['downloading', 'In progress', active, 'sync'],
          ['done', 'Ready', counts.done || 0, 'check_circle']
        ].map(([status, label, count, symbol]) => `<button type="button" class="stat ripple ${queueStatus === status ? 'active' : ''}" data-action="queue-filter-card" data-status="${status}">
          <div class="stat-top"><strong>${Number(count).toLocaleString()}</strong>${ic(symbol)}</div><span class="l">${label}</span>
        </button>`).join('');
        $('#queueItems').innerHTML = items.length
          ? `<div class="rows">${items.map(track => trackRow(track, { queue: true, ctx: 'queue' })).join('')}</div>`
          : emptyState(
              queueStatus ? `Nothing ${statusLabel(queueStatus)} right now` : 'Your queue is empty',
              queueStatus ? 'Choose another status to see more songs.' : 'Find a song you love and add it here.',
              'queue_music',
              btnContained('Discover music', 'data-page="search"'));
        $('#queuePager').innerHTML = data.pages > 1 ? `
          ${btnText('Newer', `data-action="queue-page" data-page-number="${queuePage - 1}" ${queuePage <= 1 ? 'disabled' : ''}`, 'chevron_left')}
          <span class="caption">Page ${data.page} of ${data.pages}</span>
          ${btnText('Older', `data-action="queue-page" data-page-number="${queuePage + 1}" ${queuePage >= data.pages ? 'disabled' : ''}`, 'chevron_right')}` : '';
      } catch (error) {
        if (list) list.innerHTML = emptyState('Queue could not load', error.message, 'error', btnContained('Try again', 'data-action="refresh"'));
      }
    }

    async function paintDownloads() {
      let metas = [];
      try { metas = await dbAll('meta'); } catch { metas = []; }
      metas.sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0));
      const total = metas.reduce((sum, meta) => sum + (meta.size || 0), 0);
      let quota = 0;
      try { const estimate = await navigator.storage?.estimate?.(); quota = estimate?.quota || 0; } catch { /* optional */ }
      tracks = metas.map(meta => ({
        track_id: meta.id,
        name: meta.name,
        artist_name: meta.artist,
        collection_name: meta.album,
        artwork: meta.artwork,
        is_crawled: true,
        offline_meta: meta
      }));

      const stats = $('#downloadStats');
      if (stats) {
        const pending = offlinePending.length + (offlineRunning ? 1 : 0);
        stats.innerHTML = `
          <div class="stat"><div class="stat-top"><strong>${metas.length}</strong>${ic('download_done')}</div><span class="l">Tracks offline</span></div>
          <div class="stat"><div class="stat-top"><strong>${formatBytes(total)}</strong>${ic('storage')}</div><span class="l">Space used</span></div>
          <div class="stat"><div class="stat-top"><strong>${quota ? formatBytes(quota) : '—'}</strong>${ic('sd_storage')}</div><span class="l">Storage quota</span></div>
          <div class="stat"><div class="stat-top"><strong>${pending}</strong>${ic('sync')}</div><span class="l">In progress</span></div>`;
      }
      const count = $('#downloadCount');
      if (count) count.textContent = `${metas.length} ${metas.length === 1 ? 'track' : 'tracks'}`;
      const container = $('#downloadItems');
      if (!container) return;
      container.innerHTML = metas.length
        ? `<div class="rows">${metas.map(offlineRow).join('')}</div>`
        : emptyState('No downloads yet', 'Tracks that finish processing in your queue are saved here automatically so you can listen offline.', 'cloud_download', btnContained('Open queue', 'data-page="queue"'));
    }

    function offlineRow(meta) {
      return `<article class="row" data-track="${meta.id}">
        <button type="button" class="art ripple" data-action="play-offline" data-id="${meta.id}" aria-label="Play ${esc(meta.name)}">
          <img loading="lazy" src="${esc(meta.artwork || '')}" alt=""><span class="art__play">${ic('play_arrow')}</span>
        </button>
        <div class="row__text">
          <div class="row__title"><span title="${esc(meta.name)}">${esc(meta.name)}</span><span class="badge offline">Offline</span></div>
          <div class="row__sub">${esc(meta.artist)}${meta.album ? ` · ${esc(meta.album)}` : ''} · <span data-offline-size="${meta.id}">${formatBytes(meta.size)}</span></div>
        </div>
        <div class="row__actions">
          ${iconBtn('save_alt', `data-action="save-offline" data-id="${meta.id}"`, 'Save file to device')}
          ${iconBtn('delete', `data-action="remove-offline" data-id="${meta.id}"`, 'Remove download')}
        </div>
        <div class="offline-slot" data-offline-slot="${meta.id}">${offlineSlotHTML(meta.id)}</div>
      </article>`;
    }

    async function playOfflineTrack(id) {
      const meta = await dbGet('meta', id).catch(() => null);
      if (!meta) { notify('Offline file not found', 'error'); return; }
      const url = await offlineUrl(id);
      if (!url) { notify('Offline file not found', 'error'); return; }
      const entry = {
        track_id: meta.id,
        name: meta.name,
        artist_name: meta.artist,
        collection_name: meta.album,
        artwork: meta.artwork,
        is_crawled: true
      };
      if (!tracks.some(track => trackId(track) === meta.id)) tracks.push(entry);
      playTrack(url, meta.name, meta.artist, meta.id, entry);
    }

    async function saveOfflineFile(id) {
      const record = await dbGet('blobs', id).catch(() => null);
      if (!record?.blob) { notify('No offline copy found for this track', 'error'); return; }
      const meta = await dbGet('meta', id).catch(() => null);
      const url = URL.createObjectURL(record.blob);
      triggerDownload(url, `${meta?.artist ? `${meta.artist} - ` : ''}${meta?.name || 'track'}`);
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      notify('Saved to your device', 'check_circle');
    }

    async function removeOfflineFile(id) {
      try {
        await dbDelete('blobs', id);
        await dbDelete('meta', id);
        offline.delete(id);
        const cached = offlineUrls.get(id);
        if (cached) { URL.revokeObjectURL(cached); offlineUrls.delete(id); }
        notify('Download removed', 'delete');
        refreshOfflineSlot(id);
        if (page === 'downloads') paintDownloads();
        else markOfflineBadges();
      } catch (error) { notify(error.message, 'error'); }
    }

    function markOfflineBadges() {
      $$('.row[data-track]').forEach(row => {
        const id = Number(row.dataset.track);
        const title = row.querySelector('.row__title');
        if (!title) return;
        const existing = title.querySelector('.badge.offline');
        if (isOfflineReady(id) && !existing) {
          title.querySelector('.badge:not(.offline)')?.remove();
          title.insertAdjacentHTML('beforeend', '<span class="badge offline">Offline</span>');
        }
      });
    }

    async function clearAllOffline() {
      const metas = await dbAll('meta').catch(() => []);
      if (!metas.length) { notify('There is nothing to remove', 'info'); return; }
      for (const meta of metas) {
        await dbDelete('blobs', meta.id).catch(() => {});
        await dbDelete('meta', meta.id).catch(() => {});
        offline.delete(meta.id);
        const cached = offlineUrls.get(meta.id);
        if (cached) { URL.revokeObjectURL(cached); offlineUrls.delete(meta.id); }
      }
      notify('All downloads removed', 'delete');
      paintDownloads();
    }

    function parseSyncedLyrics(text) {
      return String(text || '').split(/\r?\n/).flatMap(line => {
        const timestamps = [...line.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
        if (!timestamps.length) return [];
        const lyric = line.replace(/\[\d+:(?:\d+(?:\.\d+)?)\]/g, '').trim();
        return timestamps.map(match => ({
          time: (Number(match[1]) * 60 + Number(match[2])) * 1000,
          text: lyric
        }));
      }).sort((left, right) => left.time - right.time);
    }

    function syncPanelLyrics() {
      if ($('#nowPanel').hidden || panelTab !== 'lyrics' || !syncedLines.length) return;
      const currentTime = (audio.currentTime || 0) * 1000;
      let activeIndex = -1;
      syncedLines.forEach((line, index) => { if (line.time <= currentTime) activeIndex = index; });
      if (activeIndex === lastSyncedLine) return;
      lastSyncedLine = activeIndex;
      $$('.synced-line', $('#nowPanelBody')).forEach((line, index) => {
        line.classList.toggle('past', index < activeIndex);
        line.classList.toggle('active', index === activeIndex);
      });
      if (activeIndex >= 0) $$('.synced-line', $('#nowPanelBody'))[activeIndex]?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    async function renderPanelLyrics(track) {
      const id = trackId(track);
      const body = $('#nowPanelBody');
      syncedLines = [];
      lastSyncedLine = -1;
      body.innerHTML = '<div class="now-panel__empty">Finding lyrics…</div>';
      try {
        const data = await api('lyrics', { track_id: id });
        if (panelTrackId !== id || panelTab !== 'lyrics') return;
        syncedLines = parseSyncedLyrics(data.lyrics_synced);
        const title = track.name || track.trackName || 'Unknown track';
        const artist = track.artist_name || track.artistName || 'Unknown artist';
        const source = data.lyrics_source ? ` · ${esc(data.lyrics_source)}` : '';
        const header = `<div class="now-panel__track">${esc(title)} · ${esc(artist)}${source}</div>`;
        if (syncedLines.length) {
          body.innerHTML = `${header}<div class="synced-lyrics">${syncedLines.map((line, index) => `<button type="button" class="synced-line" data-action="lyric-seek" data-time="${line.time}" data-index="${index}">${esc(line.text || '♪')}</button>`).join('')}</div>`;
          syncPanelLyrics();
        } else if (data.lyrics_plain) {
          body.innerHTML = `${header}<div class="lyrics">${esc(data.lyrics_plain)}</div>`;
        } else {
          body.innerHTML = `${header}<div class="now-panel__empty">Synced lyrics aren’t available for this track.</div>`;
        }
      } catch (error) {
        if (panelTrackId === id) body.innerHTML = `<div class="now-panel__empty">${esc(error.message || 'Lyrics are unavailable.')}</div>`;
      }
    }

    function renderPanelInfo(track) {
      const body = $('#nowPanelBody');

    /* ───────────── downloads / player ───────────── */
    function triggerDownload(url, name) {
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = `${safeName(name || 'track')}.mp3`;
      document.body.append(anchor);
      anchor.click();
      anchor.remove();
    }

    async function downloadTrack(url, name, button) {
      if (!url) return;
      if (button) button.disabled = true;
      notify('Preparing your download…', 'download');
      try {
        const response = await fetch(url, { credentials: 'same-origin' });
        if (!response.ok) throw new Error('Download could not be fetched.');
        const blob = await response.blob();
        const objectUrl = URL.createObjectURL(blob);
        triggerDownload(objectUrl, name);
        setTimeout(() => URL.revokeObjectURL(objectUrl), 4000);
        notify('Download ready', 'check_circle');
      } catch {
        window.open(url, '_blank', 'noopener');
        notify('Opened the file in a new tab', 'open_in_new');
      } finally { if (button) button.disabled = false; }
    }

    async function saveTrack(id, remoteUrl, name) {
      if (id && isOfflineReady(id)) { await saveOfflineFile(id); return; }
      if (remoteUrl) { await downloadTrack(remoteUrl, name); return; }
      notify('This track is not ready to download yet', 'info');
    }

    function setPlaylist(items, id) {
      playlist = items.filter(track => source(track) || isOfflineReady(trackId(track)));
      const target = playlist.findIndex(track => trackId(track) === Number(id));
      playlistIndex = target >= 0 ? target : 0;
    }

    function currentTrack() {
      return playlist[playlistIndex] || null;
    }

    function rememberPlayed(track, title, artist, url) {
      const entry = {
        id: trackId(track) || playerId,
        name: title,
        artist,
        artwork: track?.artwork || track?.artworkUrl100 || $('#p-art').getAttribute('src') || '',
        src: url && !url.startsWith('blob:') ? url : source(track) || ''
      };
      played = [entry, ...played.filter(item => Number(item.id) !== Number(entry.id))].slice(0, 12);
      try { localStorage.setItem(PLAYED_KEY, JSON.stringify(played)); } catch { /* ignore */ }
    }

    async function playTrack(url, title, artist, id = 0, fallback = null) {
      const numericId = Number(id) || 0;
      const track = tracks.find(item => trackId(item) === numericId) || fallback || null;
      let playUrl = url;
      if (numericId && isOfflineReady(numericId)) {
        const local = await offlineUrl(numericId);
        if (local) playUrl = local;
      }
      if (!playUrl) return;
      if (tracks.length) setPlaylist(tracks, numericId);
      playerId = numericId;
      $('#player').hidden = false;
      document.body.classList.add('has-player');
      $('#p-title').textContent = title || track?.name || track?.trackName || 'Unknown track';
      $('#p-artist').textContent = `${artist || track?.artist_name || track?.artistName || ''}${isOfflineReady(numericId) ? ' · Offline' : track ? ` · ${track.is_crawled ? 'Full track' : 'Preview'}` : ''}`;
      const art = $('#p-art');
      art.src = track?.artwork || track?.artworkUrl100 || '';
      art.style.visibility = art.getAttribute('src') ? 'visible' : 'hidden';
      const saveButton = $('#p-dl');
      saveButton.hidden = !(isOfflineReady(numericId) || downloadUrl(track));
      saveButton.dataset.id = String(numericId);
      saveButton.dataset.url = downloadUrl(track);
      saveButton.dataset.name = track ? fileName(track) : '';
      const favoriteButton = $('#p-fav');
      favoriteButton.dataset.id = String(numericId);
      paintFavorite(favoriteButton, Boolean(track?.is_favorite));
      audio.src = playUrl;
      $('#player').classList.remove('is-playing');
      $('#player').classList.add('is-loading');
      audio.play().then(updatePlayButton).catch(() => { updatePlayButton(); notify('Tap play to start audio', 'play_circle'); });
      rememberPlayed(track, $('#p-title').textContent, artist || track?.artist_name || '', playUrl);
      markNowPlaying();
      if (!$('#nowPanel').hidden) showContextPanel(panelTab);
    }

    async function playFromTrack(track) {
      if (!track) return;
      const id = trackId(track);
      let url = source(track);
      if (id && isOfflineReady(id)) {
        const local = await offlineUrl(id);
        if (local) url = local;
      }
      if (!url) return;
      playTrack(url, track.name || track.trackName || 'Unknown track', track.artist_name || track.artistName || 'Unknown artist', id, track);
    }

    function updatePlayButton() {
      const button = $('#toggle');
      const player = $('#player');
      const playing = !audio.paused && !audio.ended;
      button.querySelector('.material-icons').textContent = audio.paused ? 'play_arrow' : 'pause';
      button.setAttribute('aria-label', audio.paused ? 'Play' : 'Pause');
      player.classList.toggle('is-playing', playing && audio.readyState >= 2);
      player.classList.toggle('is-loading', playing && audio.readyState < 3);
    }

    async function skipTrack(direction) {
      if (!playlist.length) return;
      let next = playlistIndex + direction;
      if (shuffleEnabled) {
        const candidates = playlist.map((_, index) => index).filter(index => index !== playlistIndex);
        next = candidates[Math.floor(Math.random() * candidates.length)] ?? playlistIndex;
      }
      if (next < 0 || next >= playlist.length) {
        if (repeatEnabled) next = (next + playlist.length) % playlist.length;
        else return;
      }
      playlistIndex = next;
      await playFromTrack(playlist[playlistIndex]);
    }

    async function playAll() {
      const playable = tracks.filter(track => source(track) || isOfflineReady(trackId(track)));
      if (!playable.length) { notify('Nothing playable here yet', 'info'); return; }
      setPlaylist(playable, trackId(playable[0]));
      await playFromTrack(playlist[playlistIndex]);
    }

    function exportCsv(items, filename) {
      const columns = ['name', 'artist_name', 'collection_name', 'status', 'progress', 'bale_file_id', 'bale_message_id', 'telegram_file_id'];
      const value = item => `"${String(item ?? '').replace(/^[\s]*[=+\-@]/, '').replaceAll('"', '""')}"`;
      const content = [columns.join(','), ...items.map(item => columns.map(key => value(item[key])).join(','))].join('\r\n');
      const url = URL.createObjectURL(new Blob([content], { type: 'text/csv;charset=utf-8' }));
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = filename;
      anchor.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function exportAll(action, params, filename) {
      try {
        const first = await api(action, { page: 1, per_page: 100, ...params });
        const items = [...(first.items || [])];
        for (let number = 2; number <= Number(first.pages || 1); number++) {
          const next = await api(action, { page: number, per_page: 100, ...params });
          items.push(...(next.items || []));
        }
        exportCsv(items, `${filename}-${new Date().toISOString().slice(0, 10)}.csv`);
        notify(`Exported ${items.length} songs`, 'check_circle');
      } catch (error) { notify(`Export failed: ${error.message}`, 'error'); }
    }

    /* ───────────── events (delegated) ───────────── */
    document.addEventListener('click', event => {
      const panelTabButton = event.target.closest('[data-panel-tab]');
      if (panelTabButton) {
        showContextPanel(panelTabButton.dataset.panelTab);
        return;
      }
      /* Tabs */
      const tabButton = event.target.closest('.tab[data-entity]');
      if (tabButton) {
        const next = tabButton.dataset.entity;
        $$('.tab').forEach(tab => {
          const active = tab === tabButton;
          tab.classList.toggle('active', active);
          tab.setAttribute('aria-selected', String(active));
        });
        if (next !== entity) {
          entity = next;
          if (query) search(query);
          else showResults();
        }
        return;
      }

      /* Page switching */
      const pageButton = event.target.closest('[data-page]');
      if (pageButton) {
        event.preventDefault();
        closeMenu();
        setPage(pageButton.dataset.page);
        return;
      }

      const button = event.target.closest('[data-action]');
      if (!button) return;
      const { action, id, type, term } = button.dataset;

      switch (action) {
        case 'genre':
        case 'mood':
          query = term || '';
          entity = 'song';
          if (page !== 'search') setNavigation('search');
          renderSearch();
          break;
        case 'recent': search(term); break;
        case 'clear-recent': {
          recent = [];
          try { localStorage.removeItem(RECENT_KEY); } catch { /* Ignore storage errors. */ }
          const recentArea = $('#recentArea');
          if (recentArea) recentArea.innerHTML = '';
          break;
        }
        case 'do-search': search(); break;
        case 'retry-search': search(query); break;
        case 'clear-search':
          query = '';
          searchVersion++;
          renderSearch();
          $('#searchInput')?.focus();
          break;
        case 'play': playTrack(button.dataset.src, button.dataset.title, button.dataset.artist, Number(id)); break;
        case 'play-offline': playOfflineTrack(Number(id)); break;
        case 'download': downloadTrack(button.dataset.url, button.dataset.name, button); break;
        case 'save-offline': saveOfflineFile(Number(id)); break;
        case 'remove-offline': removeOfflineFile(Number(id)); break;
        case 'retry-offline': {
          const track = findTrack(Number(id));
          if (track) { offline.delete(Number(id)); queueOfflineDownload(track); }
          else notify('Track is no longer in this list', 'info');
          break;
        }
        case 'clear-offline': clearAllOffline(); break;
        case 'sync-offline':
          syncOfflineFromQueue().then(() => {
            notify('Checking your queue for finished downloads…', 'cloud_sync');
            if (page === 'downloads') setTimeout(paintDownloads, 800);
          });
          break;
        case 'favorite': toggleFavorite(Number(id)); break;
        case 'follow-artist': toggleArtistFollow(Number(id)); break;
        case 'library-tab':
          libraryView = button.dataset.view || 'liked';
          activePlaylistId = 0;
          loadLibrary();
          break;
        case 'create-playlist': showCreatePlaylist(); break;
        case 'playlist-create-submit': createPlaylistSubmit(); break;
        case 'open-playlist': openPlaylist(Number(id)); break;
        case 'playlist-page': openPlaylist(activePlaylistId, Number(button.dataset.pageNumber)); break;
        case 'delete-playlist': deletePlaylist(Number(id)); break;
        case 'playlist-add-track': choosePlaylistForTrack(Number(id)); break;
        case 'playlist-select': addTrackToPlaylist(Number(button.dataset.playlistId), Number(button.dataset.trackId)); break;
        case 'playlist-remove-track': removeTrackFromPlaylist(Number(id)); break;
        case 'lyrics': showLyrics(Number(id), button.dataset.title || 'Lyrics'); break;
        case 'lyric-seek':
          if (audio.src) {
            audio.currentTime = Number(button.dataset.time) / 1000;
            if (audio.paused) audio.play().catch(() => notify('Audio could not be started', 'error'));
          }
          break;
        case 'details': showDetails(Number(id)); break;
        case 'track-menu': openTrackMenu(button, Number(id), button.dataset.ctx); break;
        case 'queue-add': addQueue(type, Number(id)); break;
        case 'open-album': openAlbum(Number(id)); break;
        case 'open-artist': openArtist(Number(id)); break;
        case 'back': setNavigation('search'); renderSearch(); break;
        case 'remove-queue': removeQueue(Number(id)); break;
        case 'refresh': loadQueue(); break;
        case 'export': exportAll('queue_list', { status: queueStatus }, 'mman-queue'); break;
        case 'export-favorites': exportAll('favorites', {}, 'mman-liked'); break;
        case 'queue-filter-card':
          queueStatus = button.dataset.status || '';
          queuePage = 1;
          renderQueue();
          break;
        case 'queue-page':
          queuePage = Number(button.dataset.pageNumber);
          loadQueue();
          break;
        case 'favorites-page':
          libraryPage = Number(button.dataset.pageNumber);
          loadLibrary();
          break;
        case 'retry': addQueue('track', Number(id)); break;
        case 'play-all': playAll(); break;
        case 'expand': showNowPlaying(); break;
        case 'auth': showAuth(); break;
        case 'auth-switch': showAuth(button.dataset.register === 'true'); break;
        case 'auth-submit': submitAuth(); break;
        case 'dialog-close': dialog.close(); break;
        case 'account':
          if (!user) { showAuth(); break; }
          showMenu(button, `<button type="button" class="menu-item" disabled>${ic('account_circle')}<span>${esc(user.email || 'Account')}</span></button>
            <div class="menu-divider"></div>
            ${installPrompt ? menuItem('install-app', 'install_desktop', 'Install app') : ''}
            ${menuItem('logout', 'logout', 'Sign out')}`);
          break;
        case 'install-app':
          if (installPrompt) {
            installPrompt.prompt();
            installPrompt.userChoice?.then(choice => {
              notify(choice.outcome === 'accepted' ? 'mman installed' : 'Install dismissed', 'install_desktop');
            });
            installPrompt = null;
          }
          break;
        case 'logout': logout(); break;
        case 'retry-favorites': loadLibrary(); break;
      }

      if (button.closest('#menu')) closeMenu();
    });

    app.addEventListener('input', event => {
      if (event.target.id === 'searchInput') {
        const clearButton = $('#clearSearch');
        if (clearButton) clearButton.hidden = !event.target.value;
      }
    });

    app.addEventListener('keydown', event => {
      if (event.key === 'Enter' && event.target.id === 'searchInput') {
        event.preventDefault();
        search();
      }
    });

    dialogEl.addEventListener('keydown', event => {
      if (event.key === 'Enter' && ['authEmail', 'authPassword'].includes(event.target.id)) {
        event.preventDefault();
        submitAuth();
      }
    });

    app.addEventListener('change', event => {
      const target = event.target;
      if (target.id === 'queueFilter') {
        const next = target.value === 'all' ? '' : target.value;
        if (next === queueStatus) return;
        queueStatus = next;
        queuePage = 1;
        loadQueue();
      }
      if (target.id === 'sort') {
        const sort = target.value;
        const titleOf = item => item.trackName || item.collectionName || item.artistName || '';
        if (sort === 'title') results.sort((a, b) => titleOf(a).localeCompare(titleOf(b)));
        if (sort === 'artist') results.sort((a, b) => (a.artistName || '').localeCompare(b.artistName || ''));
        if (sort === 'relevance' && query) { search(query); return; }
        showResults();
      }
    }, true);

    /* ───────────── player controls ───────────── */
    $('#toggle').addEventListener('click', () => {
      if (!audio.src) return;
      audio.paused ? audio.play().catch(() => notify('Audio could not be started', 'error')) : audio.pause();
    });
    $('#prev').addEventListener('click', () => skipTrack(-1));
    $('#next').addEventListener('click', () => skipTrack(1));
    $('#shuffle').addEventListener('click', event => {
      shuffleEnabled = !shuffleEnabled;
      const button = event.currentTarget;
      button.setAttribute('aria-pressed', String(shuffleEnabled));
      button.classList.toggle('is-active', shuffleEnabled);
      notify(shuffleEnabled ? 'Shuffle is on' : 'Shuffle is off', 'shuffle');
    });
    $('#repeat').addEventListener('click', event => {
      repeatEnabled = !repeatEnabled;
      const button = event.currentTarget;
      button.setAttribute('aria-pressed', String(repeatEnabled));
      button.classList.toggle('is-active', repeatEnabled);
      notify(repeatEnabled ? 'Repeat is on' : 'Repeat is off', 'repeat');
    });
    $('#vol').addEventListener('input', event => { audio.volume = Number(event.target.value); });
    $('#seek').addEventListener('pointerdown', () => { seeking = true; });
    window.addEventListener('pointerup', () => { seeking = false; });
    $('#seek').addEventListener('input', event => {
      if (audio.duration) audio.currentTime = audio.duration * Number(event.target.value) / 1000;
    });
    $('#close').addEventListener('click', () => {
      audio.pause();
      audio.removeAttribute('src');
      audio.load();
      $('#player').hidden = true;
      document.body.classList.remove('has-player');
      updatePlayButton();
      markNowPlaying();
    });
    $('#p-expand').addEventListener('click', showNowPlaying);
    $('#nowPanelClose').addEventListener('click', () => {
      $('#nowPanel').hidden = true;
      document.body.classList.remove('now-panel-open');
    });
    $('#p-dl').addEventListener('click', event => {
      const element = event.currentTarget;
      saveTrack(Number(element.dataset.id), element.dataset.url, element.dataset.name);
    });

    function updateProgress() {
      $('#cur').textContent = seconds(audio.currentTime || 0);
      $('#tot').textContent = seconds(audio.duration || 0);
      if (!seeking) $('#seek').value = audio.duration ? Math.round(audio.currentTime / audio.duration * 1000) : 0;
      syncPanelLyrics();
    }
    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('durationchange', updateProgress);
    ['play', 'playing', 'waiting', 'canplay', 'pause'].forEach(name => audio.addEventListener(name, updatePlayButton));
    audio.addEventListener('error', () => {
      updatePlayButton();
      if (audio.src) notify('This audio stream could not be played', 'error');
    });
    audio.addEventListener('ended', () => {
      if (repeatEnabled && playlist.length === 1) {
        audio.currentTime = 0;
        audio.play().catch(() => updatePlayButton());
      } else skipTrack(1);
    });

    document.addEventListener('keydown', event => {
      const tag = document.activeElement?.tagName || '';
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(tag) || document.activeElement?.isContentEditable;
      if (event.key === '/' && !typing && !dialog.open) {
        event.preventDefault();
        if (page !== 'search') setPage('search');
        $('#searchInput')?.focus();
      }
      if (event.key === 'Escape' && !menu.hidden) closeMenu();
      if (event.code === 'Space' && !typing && !/^(BUTTON|A)$/.test(tag) && !dialog.open && audio.src) {
        event.preventDefault();
        audio.paused ? audio.play().catch(() => {}) : audio.pause();
      }
    });

    /* ───────────── misc wiring ───────────── */
    document.addEventListener('load', event => {
      if (event.target instanceof HTMLImageElement) event.target.classList.add('image-loaded');
    }, true);
    document.addEventListener('error', event => {
      if (event.target instanceof HTMLImageElement) event.target.classList.add('image-failed');
    }, true);

    const appbar = $('#appbar');
    window.addEventListener('scroll', () => appbar.classList.toggle('scrolled', window.scrollY > 4), { passive: true });

    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      installPrompt = event;
    });
    window.addEventListener('appinstalled', () => {
      installPrompt = null;
      notify('mman installed — you can open it from your home screen', 'install_desktop');
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') syncOfflineFromQueue();
    });

    /* ───────────── boot ───────────── */
    document.body.classList.add('ready');

    await hydrateOfflineIndex();

    try { user = (await api('me')).user || null; }
    catch { user = null; }
    updateAccountButton();

    // Deep links via hash (#search, #queue, #downloads …)
    const hashPage = (location.hash || '').replace('#', '');
    setPage(['home', 'search', 'library', 'downloads', 'queue'].includes(hashPage) ? hashPage : 'home');

    // Background sync: finished queue items are stored offline automatically.
    syncOfflineFromQueue();
    syncTimer = setInterval(syncOfflineFromQueue, 20000);
  </script>
</body>
</html>
