<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#3f51b5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Discover music, save favorites and manage your personal music queue with mman.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="mman">
  <meta name="mobile-web-app-capable" content="yes">
  <title>mman — music, made personal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    /* ═══════════════════════════════════════════════════════════
       Material Design 2 — design tokens
       ═══════════════════════════════════════════════════════════ */
    :root {
      color-scheme: light dark;

      --primary:           light-dark(#3f51b5, #7986cb);
      --primary-variant:   light-dark(#303f9f, #9fa8da);
      --on-primary:        light-dark(#ffffff, #000000);

      --secondary:         light-dark(#e91e63, #f48fb1);
      --on-secondary:      light-dark(#ffffff, #000000);

      --surface:           light-dark(#ffffff, #121212);
      --surface-1:         light-dark(#ffffff, #1e1e1e);
      --surface-2:         light-dark(#ffffff, #232323);
      --background:        light-dark(#fafafa, #0a0a0a);

      --on-surface:        light-dark(rgba(0,0,0,.87), rgba(255,255,255,.87));
      --on-surface-med:    light-dark(rgba(0,0,0,.60), rgba(255,255,255,.60));
      --on-surface-dis:    light-dark(rgba(0,0,0,.38), rgba(255,255,255,.38));
      --divider:           light-dark(rgba(0,0,0,.12), rgba(255,255,255,.12));
      --divider-strong:    light-dark(rgba(0,0,0,.42), rgba(255,255,255,.42));

      --hover:             light-dark(rgba(0,0,0,.04), rgba(255,255,255,.06));
      --tint:              light-dark(rgba(63,81,181,.08), rgba(121,134,203,.16));
      --tint-strong:       light-dark(rgba(63,81,181,.12), rgba(121,134,203,.24));
      --field:             light-dark(rgba(0,0,0,.06), rgba(255,255,255,.09));
      --field-hover:       light-dark(rgba(0,0,0,.09), rgba(255,255,255,.13));

      --error:             light-dark(#b00020, #cf6679);
      --on-error:          light-dark(#ffffff, #000000);
      --snack-bg:          light-dark(#323232, #e0e0e0);
      --on-snack:          light-dark(#ffffff, #121212);

      --mood-1-bg:         light-dark(#e8eaf6, #1f2340);
      --mood-1-fg:         light-dark(#303f9f, #c5cae9);
      --mood-2-bg:         light-dark(#fce4ec, #3a1f28);
      --mood-2-fg:         light-dark(#c2185b, #f8bbd0);
      --mood-3-bg:         light-dark(#e0f2f1, #16302f);
      --mood-3-fg:         light-dark(#00695c, #b2dfdb);
      --mood-4-bg:         light-dark(#fff8e1, #33290f);
      --mood-4-fg:         light-dark(#ff8f00, #ffe082);

      /* Elevation (Material 2 dp scale) */
      --shadow-1:  0 2px 1px -1px rgba(0,0,0,.2), 0 1px 1px 0 rgba(0,0,0,.14), 0 1px 3px 0 rgba(0,0,0,.12);
      --shadow-2:  0 3px 1px -2px rgba(0,0,0,.2), 0 2px 2px 0 rgba(0,0,0,.14), 0 1px 5px 0 rgba(0,0,0,.12);
      --shadow-3:  0 3px 3px -2px rgba(0,0,0,.2), 0 3px 4px 0 rgba(0,0,0,.14), 0 1px 8px 0 rgba(0,0,0,.12);
      --shadow-4:  0 2px 4px -1px rgba(0,0,0,.2), 0 4px 5px 0 rgba(0,0,0,.14), 0 1px 10px 0 rgba(0,0,0,.12);
      --shadow-6:  0 3px 5px -1px rgba(0,0,0,.2), 0 6px 10px 0 rgba(0,0,0,.14), 0 1px 18px 0 rgba(0,0,0,.12);
      --shadow-8:  0 5px 5px -3px rgba(0,0,0,.2), 0 8px 10px 1px rgba(0,0,0,.14), 0 3px 14px 2px rgba(0,0,0,.12);
      --shadow-16: 0 8px 10px -5px rgba(0,0,0,.2), 0 16px 24px 2px rgba(0,0,0,.14), 0 6px 30px 5px rgba(0,0,0,.12);
      --shadow-24: 0 11px 15px -7px rgba(0,0,0,.2), 0 24px 38px 3px rgba(0,0,0,.14), 0 9px 46px 8px rgba(0,0,0,.12);

      --bar-h: 56px;
      --nav-h: 56px;
      --drawer-w: 256px;
      --safe-b: env(safe-area-inset-bottom, 0px);
    }

    /* ═══════════════════════════════════════════════════════════
       Base
       ═══════════════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; }
    html { background: var(--background); }
    body {
      margin: 0;
      min-height: 100vh;
      padding-top: calc(var(--bar-h) + env(safe-area-inset-top, 0px));
      padding-bottom: calc(var(--nav-h) + var(--safe-b) + 16px);
      background: var(--background);
      color: var(--on-surface);
      font: 400 14px/20px Roboto, system-ui, -apple-system, sans-serif;
      letter-spacing: .25px;
      -webkit-font-smoothing: antialiased;
      transition: opacity .15s;
    }
    body:not(.ready) { opacity: 0; }
    body.has-player { padding-bottom: calc(var(--nav-h) + var(--safe-b) + 176px); }

    [hidden] { display: none !important; }
    button { padding: 0; border: 0; color: inherit; background: none; font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:disabled { cursor: default; }
    a { color: var(--primary); }
    img { display: block; }
    ::selection { background: var(--tint-strong); }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    .material-icons {
      font-family: 'Material Icons';
      font-weight: normal; font-style: normal;
      font-size: 24px; line-height: 1;
      letter-spacing: normal; text-transform: none;
      display: inline-block; white-space: nowrap; word-wrap: normal;
      direction: ltr; -webkit-font-feature-settings: 'liga';
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* ── Material 2 type scale ── */
    .h4 { margin: 0; font: 400 34px/40px Roboto; letter-spacing: .25px; }
    .h5 { margin: 0; font: 400 24px/32px Roboto; letter-spacing: 0; }
    .h6 { margin: 0; font: 500 20px/32px Roboto; letter-spacing: .15px; }
    .subtitle1 { font: 400 16px/24px Roboto; letter-spacing: .15px; }
    .subtitle2 { font: 500 14px/24px Roboto; letter-spacing: .1px; }
    .body1 { font: 400 16px/24px Roboto; letter-spacing: .5px; }
    .body2 { font: 400 14px/20px Roboto; letter-spacing: .25px; }
    .caption { font: 400 12px/16px Roboto; letter-spacing: .4px; }
    .overline { font: 500 10px/16px Roboto; letter-spacing: 1.5px; text-transform: uppercase; }
    .muted { color: var(--on-surface-med); }
    .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ═══════════════════════════════════════════════════════════
       Ripple
       ═══════════════════════════════════════════════════════════ */
    .ripple { position: relative; overflow: hidden; }
    .ripple__wave {
      position: absolute; border-radius: 50%; pointer-events: none;
      background: currentColor; opacity: .22;
      transform: scale(0); animation: ripple .55s cubic-bezier(.2,.6,.4,1) forwards;
    }
    @keyframes ripple { to { transform: scale(1); opacity: 0; } }

    /* ═══════════════════════════════════════════════════════════
       Buttons (M2: contained / outlined / text / icon)
       ═══════════════════════════════════════════════════════════ */
    .btn {
      position: relative; display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; height: 36px; padding: 0 16px; border-radius: 4px;
      font: 500 14px/36px Roboto; letter-spacing: 1.25px; text-transform: uppercase;
      white-space: nowrap; overflow: hidden;
      transition: box-shadow .2s, background-color .2s;
    }
    .btn .material-icons { font-size: 18px; }
    .btn--contained { background: var(--primary); color: var(--on-primary); box-shadow: var(--shadow-2); }
    .btn--contained:hover { box-shadow: var(--shadow-4); }
    .btn--contained::before { content: ''; position: absolute; inset: 0; background: currentColor; opacity: 0; transition: opacity .2s; }
    .btn--contained:hover::before { opacity: .08; }
    .btn--contained:disabled { background: var(--on-surface-dis); color: var(--surface-1); box-shadow: none; }
    .btn--outlined {
      border: 1px solid var(--divider); color: var(--primary);
      background: transparent; line-height: 34px;
    }
    .btn--outlined:hover { background: var(--tint); }
    .btn--text { color: var(--primary); padding: 0 8px; }
    .btn--text:hover { background: var(--tint); }
    .btn--text:disabled { color: var(--on-surface-dis); background: none; }
    .btn--danger { color: var(--error); }

    .icon-btn {
      position: relative; display: inline-grid; place-items: center;
      width: 40px; height: 40px; flex: 0 0 auto; border-radius: 50%;
      color: var(--on-surface-med); overflow: hidden;
      transition: background-color .15s, color .15s;
    }
    .icon-btn:hover { background: var(--hover); }
    .icon-btn:disabled { color: var(--on-surface-dis); background: none; }
    .icon-btn--filled {
      width: 48px; height: 48px; background: var(--primary); color: var(--on-primary);
      box-shadow: var(--shadow-2);
    }
    .icon-btn--filled:hover { background: var(--primary); box-shadow: var(--shadow-4); }
    .icon-btn--filled .material-icons { font-size: 28px; }
    .icon-btn.is-active { color: var(--primary); }

    /* ═══════════════════════════════════════════════════════════
       Top app bar (M2: fixed, surface colour, elevation on scroll)
       ═══════════════════════════════════════════════════════════ */
    .appbar {
      position: fixed; z-index: 40; top: 0; right: 0; left: 0;
      display: flex; align-items: center; gap: 8px;
      height: calc(var(--bar-h) + env(safe-area-inset-top, 0px));
      padding: env(safe-area-inset-top, 0px) 8px 0 16px;
      background: var(--surface-1);
      transition: box-shadow .2s;
    }
    .appbar.scrolled { box-shadow: var(--shadow-4); }
    .brand {
      display: inline-flex; align-items: center; gap: 12px;
      color: var(--on-surface); text-decoration: none;
      height: 100%; padding: 0 4px; border-radius: 4px;
    }
    .brand-mark {
      display: grid; place-items: center; width: 36px; height: 36px;
      border-radius: 50%; background: var(--primary); color: var(--on-primary);
    }
    .brand-mark .material-icons { font-size: 22px; }
    .brand-name { font: 500 22px/28px Roboto; letter-spacing: .15px; }
    .brand-name b { color: var(--primary); font-weight: 700; }
    .spacer { flex: 1; }
    #acct { max-width: 200px; }
    #acct .acct-label { display: inline-block; max-width: 116px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-transform: none; letter-spacing: .25px; }
    #acct.btn--text { font: 500 14px/20px Roboto; letter-spacing: .25px; text-transform: none; }

    /* ═══════════════════════════════════════════════════════════
       Navigation — bottom navigation bar (compact) → drawer (≥900px)
       ═══════════════════════════════════════════════════════════ */
    .nav {
      position: fixed; z-index: 30; right: 0; bottom: 0; left: 0;
      display: flex;
      height: calc(var(--nav-h) + var(--safe-b));
      padding-bottom: var(--safe-b);
      background: var(--surface-1);
      box-shadow: var(--shadow-8);
    }
    .nav-item {
      position: relative; display: flex; flex: 1; min-width: 0;
      flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      color: var(--on-surface-med); overflow: hidden;
      font: 500 12px/16px Roboto; letter-spacing: .5px;
      transition: color .15s;
    }
    .nav-item .material-icons { font-size: 24px; }
    .nav-item[aria-current="page"] { color: var(--primary); }
    .nav-item:focus-visible { outline-offset: -4px; }
    .nav-badge {
      position: absolute; top: 6px; left: 50%; transform: translateX(6px);
      min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
      background: var(--error); color: var(--on-error);
      font: 500 10px/16px Roboto; text-align: center;
    }

    main { width: 100%; max-width: 1040px; margin: 0 auto; padding: 16px 16px 24px; }
    .page-enter { animation: fade-in .16s ease-out both; }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    @media (min-width: 900px) {
      :root { --bar-h: 64px; }
      body, body.has-player { padding-bottom: 24px; }
      body.has-player { padding-bottom: 168px; }
      .shell { margin-left: var(--drawer-w); }
      main { padding: 24px 32px 32px; }

      .nav {
        top: calc(var(--bar-h) + env(safe-area-inset-top, 0px));
        bottom: 0; right: auto; left: 0;
        width: var(--drawer-w); height: auto;
        flex-direction: column; justify-content: flex-start;
        padding: 8px 0; gap: 2px;
        background: var(--surface-1);
        border-right: 1px solid var(--divider);
        box-shadow: none;
      }
      .nav-item {
        flex: none; flex-direction: row; justify-content: flex-start;
        gap: 32px; height: 48px; padding: 0 16px;
        margin-right: 8px; border-radius: 0 4px 4px 0;
        font: 500 14px/20px Roboto; letter-spacing: .1px;
        transition: background-color .15s, color .15s;
      }
      .nav-item:hover { background: var(--hover); }
      .nav-item[aria-current="page"] { background: var(--tint); color: var(--primary); }
      .nav-badge { position: static; transform: none; margin-left: auto; }
    }

    /* ═══════════════════════════════════════════════════════════
       Page structure
       ═══════════════════════════════════════════════════════════ */
    .page-head { margin-bottom: 8px; }
    .page-head h1 { margin: 0 0 8px; }
    .page-head p { max-width: 40rem; margin: 0; }
    .section-head {
      display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
      margin: 32px 0 12px;
    }
    .section-head h2 { margin: 0; }
    .section-head p { margin: 2px 0 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }

    /* ═══════════════════════════════════════════════════════════
       Search field + tabs + select
       ═══════════════════════════════════════════════════════════ */
    .searchrow { display: flex; align-items: center; gap: 12px; margin: 20px 0 4px; }
    .search-field {
      position: relative; display: flex; flex: 1; align-items: center; gap: 12px;
      min-width: 0; height: 48px; padding: 0 8px 0 16px;
      border-radius: 4px; background: var(--field);
      border-bottom: 1px solid var(--divider-strong);
      transition: background-color .15s;
    }
    .search-field:focus-within { background: var(--field-hover); }
    .search-field::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
      background: var(--primary); transform: scaleX(0); transition: transform .18s ease;
    }
    .search-field:focus-within::after { transform: scaleX(1); }
    .search-field > .material-icons { color: var(--on-surface-med); flex: 0 0 auto; }
    .search-field input {
      flex: 1; min-width: 0; height: 100%;
      border: 0; outline: 0; background: transparent;
      color: var(--on-surface); font: 400 16px/24px Roboto; letter-spacing: .15px;
    }
    .search-field input::placeholder { color: var(--on-surface-dis); }

    .tabs {
      position: relative; display: flex; margin: 16px 0 0;
      border-bottom: 1px solid var(--divider);
    }
    .tab {
      position: relative; flex: 1 1 0; min-width: 0; height: 48px; padding: 0 8px;
      color: var(--on-surface-med);
      font: 500 14px/48px Roboto; letter-spacing: 1.25px; text-transform: uppercase;
      transition: color .15s;
    }
    .tab:hover { background: var(--hover); }
    .tab.active { color: var(--primary); }
    .tab.active::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: -1px;
      height: 2px; background: var(--primary);
    }

    .sort-row { display: flex; justify-content: flex-end; margin-top: 12px; }

    .select { position: relative; display: inline-flex; align-items: center; min-width: 180px; }
    .select select {
      appearance: none; -webkit-appearance: none;
      width: 100%; height: 48px; padding: 0 40px 0 16px;
      border: 1px solid var(--divider); border-radius: 4px;
      background: transparent; color: var(--on-surface);
      font: 400 16px/24px Roboto; letter-spacing: .15px;
      cursor: pointer; outline: none;
    }
    .select select:focus { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
    .select .material-icons {
      position: absolute; right: 12px; color: var(--on-surface-med); pointer-events: none;
    }

    .recent { display: flex; align-items: center; gap: 8px; margin-top: 16px; overflow-x: auto; scrollbar-width: none; }
    .recent::-webkit-scrollbar { display: none; }
    .recent > * { flex: 0 0 auto; }

    /* M2 chip */
    .chip {
      position: relative; display: inline-flex; align-items: center; gap: 6px;
      height: 32px; padding: 0 12px; border-radius: 16px;
      border: 1px solid var(--divider); background: transparent;
      color: var(--on-surface); font: 400 13px/32px Roboto; letter-spacing: .15px;
      white-space: nowrap; overflow: hidden;
      transition: background-color .15s;
    }
    .chip:hover { background: var(--hover); }
    .chip .material-icons { font-size: 18px; color: var(--on-surface-med); }

    /* ═══════════════════════════════════════════════════════════
       Mood cards
       ═══════════════════════════════════════════════════════════ */
    .mood-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 24px; }
    .mood {
      position: relative; display: flex; flex-direction: column; justify-content: space-between;
      min-height: 112px; padding: 16px; border-radius: 4px; text-align: left;
      overflow: hidden; box-shadow: var(--shadow-1);
      transition: box-shadow .2s, transform .2s;
    }
    .mood:hover { box-shadow: var(--shadow-4); }
    .mood .material-icons { font-size: 28px; }
    .mood strong { display: block; margin-top: 16px; font: 500 16px/24px Roboto; letter-spacing: .15px; }
    .mood small { display: block; font: 400 12px/16px Roboto; letter-spacing: .4px; opacity: .8; }
    .mood.m1 { background: var(--mood-1-bg); color: var(--mood-1-fg); }
    .mood.m2 { background: var(--mood-2-bg); color: var(--mood-2-fg); }
    .mood.m3 { background: var(--mood-3-bg); color: var(--mood-3-fg); }
    .mood.m4 { background: var(--mood-4-bg); color: var(--mood-4-fg); }
    @media (min-width: 840px) { .mood-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

    /* ═══════════════════════════════════════════════════════════
       Shelves
       ═══════════════════════════════════════════════════════════ */
    .shelf { display: flex; gap: 12px; overflow-x: auto; padding: 4px 0 8px; scrollbar-width: none; }
    .shelf::-webkit-scrollbar { display: none; }
    .shelf-card { flex: 0 0 132px; min-width: 0; text-align: left; border-radius: 4px; padding-bottom: 4px; }
    .shelf-art {
      position: relative; display: block; width: 132px; height: 132px; overflow: hidden;
      border-radius: 4px; background: var(--field); box-shadow: var(--shadow-1);
    }
    .shelf-art img { width: 100%; height: 100%; object-fit: cover; }
    .shelf-card strong, .shelf-card span.s { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .shelf-card strong { margin-top: 8px; font: 500 14px/20px Roboto; letter-spacing: .1px; }
    .shelf-card span.s { color: var(--on-surface-med); font: 400 12px/16px Roboto; letter-spacing: .4px; }

    /* ═══════════════════════════════════════════════════════════
       Track rows
       ═══════════════════════════════════════════════════════════ */
    .rows { display: flex; flex-direction: column; }
    .row {
      position: relative;
      display: grid; grid-template-columns: 56px minmax(0, 1fr) auto;
      align-items: center; gap: 4px 16px;
      padding: 8px; border-radius: 4px;
      transition: background-color .15s;
    }
    .row:hover { background: var(--hover); }
    .row.row--now { background: var(--tint); }
    .art {
      position: relative; width: 56px; height: 56px; overflow: hidden;
      border-radius: 4px; background: var(--field); box-shadow: var(--shadow-1);
    }
    .art img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .25s; }
    .art img.image-loaded { opacity: 1; }
    .art__play {
      position: absolute; inset: 0; display: grid; place-items: center;
      color: #fff; background: rgba(0,0,0,.5); opacity: 0;
      transition: opacity .15s; pointer-events: none;
    }
    .row:hover .art__play, .art:focus-visible .art__play, .row--now .art__play { opacity: 1; }
    .art:disabled .art__play { display: none; }
    .row__text { min-width: 0; }
    .row__title {
      display: flex; align-items: center; gap: 8px; min-width: 0;
      font: 500 16px/24px Roboto; letter-spacing: .15px;
    }
    .row__title > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row__sub {
      overflow: hidden; color: var(--on-surface-med);
      font: 400 14px/20px Roboto; letter-spacing: .25px;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .row--now .row__sub { color: var(--on-surface-med); }
    .row__actions { display: flex; align-items: center; }

    .badge {
      flex: 0 0 auto; padding: 0 6px; border-radius: 4px;
      background: var(--field); color: var(--on-surface-med);
      font: 500 10px/16px Roboto; letter-spacing: .8px; text-transform: uppercase;
    }
    .badge.full { background: var(--tint-strong); color: var(--primary); }
    .badge.offline { background: var(--tint-strong); color: var(--primary); }

    .fav { color: var(--on-surface-med); }
    .fav.on { color: var(--error); }

    /* Queue extras inside a row */
    .q { grid-column: 2 / -1; min-width: 0; padding: 4px 8px 4px 0; }
    .q-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .q-status {
      display: inline-flex; align-items: center; gap: 6px;
      font: 500 12px/16px Roboto; letter-spacing: .8px; text-transform: uppercase;
      color: var(--on-surface-med);
    }
    .q-status .material-icons { font-size: 18px; }
    .q.running .q-status { color: var(--primary); }
    .q.running .q-status .material-icons { animation: spin 1.4s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .q.done .q-status { color: var(--primary); }
    .q.failed .q-status { color: var(--error); }
    .q .progress { margin-bottom: 2px; }

    .stages { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin: 12px 0 2px; }
    .stage {
      position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px;
      color: var(--on-surface-dis); font: 500 11px/16px Roboto; letter-spacing: .3px;
    }
    .stage:not(:last-child)::after {
      position: absolute; top: 4px; left: calc(50% + 8px);
      width: calc(100% - 16px); height: 2px; border-radius: 1px;
      background: var(--divider); content: '';
    }
    .stage i { position: relative; z-index: 1; width: 10px; height: 10px; border-radius: 50%; background: var(--divider); }
    .stage.complete { color: var(--on-surface-med); }
    .stage.complete i, .stage.complete::after { background: var(--primary); }
    .stage.active { color: var(--primary); }
    .stage.active i { background: var(--primary); box-shadow: 0 0 0 4px var(--tint-strong); }

    .q-hint { margin-top: 6px; color: var(--on-surface-med); font: 400 12px/16px Roboto; letter-spacing: .4px; }
    .q.failed .q-hint { color: var(--error); }
    .q-links { display: flex; flex-wrap: wrap; gap: 0 4px; margin: 4px 0 0 -8px; }
    .q-links .btn { height: 32px; font-size: 13px; letter-spacing: .8px; }

    /* ═══════════════════════════════════════════════════════════
       Offline strip
       ═══════════════════════════════════════════════════════════ */
    .offline-slot { grid-column: 2 / -1; min-width: 0; }
    .offline-slot:empty { display: none; }
    .offline-strip { padding: 6px 8px 2px 0; }
    .o-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin-bottom: 8px; color: var(--on-surface-med);
      font: 500 12px/16px Roboto; letter-spacing: .4px;
    }
    .o-head > span { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
    .o-head .material-icons { font-size: 16px; }
    .o-head.ok { color: var(--primary); }
    .o-head.err { color: var(--error); }
    .o-head .btn { height: 28px; font-size: 12px; letter-spacing: .8px; }
    .o-steps { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; color: var(--on-surface-dis); font: 500 11px/16px Roboto; }
    .o-step.active { color: var(--primary); }
    .o-step.complete { color: var(--on-surface-med); }
    .o-step::before { content: '○ '; }
    .o-step.active::before { content: '◐ '; }
    .o-step.complete::before { content: '● '; }

    /* ═══════════════════════════════════════════════════════════
       Albums / artists / entity headers
       ═══════════════════════════════════════════════════════════ */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 24px 16px; }
    .album { min-width: 0; }
    .album-art {
      position: relative; display: block; width: 100%; aspect-ratio: 1;
      overflow: hidden; border-radius: 4px; background: var(--field);
      box-shadow: var(--shadow-1); transition: box-shadow .2s;
    }
    .album-art:hover { box-shadow: var(--shadow-4); }
    .album-art img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .25s; }
    .album-art img.image-loaded { opacity: 1; }
    .album-meta { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin-top: 8px; }
    .album-meta > div { min-width: 0; }
    .album-meta strong, .album-meta span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .album-meta strong { font: 500 14px/20px Roboto; letter-spacing: .1px; }
    .album-meta span { color: var(--on-surface-med); font: 400 12px/16px Roboto; letter-spacing: .4px; }

    .artist-row {
      display: grid; grid-template-columns: 56px minmax(0, 1fr) auto;
      align-items: center; gap: 16px; padding: 8px; border-radius: 4px;
      transition: background-color .15s;
    }
    .artist-row:hover { background: var(--hover); }
    .avatar { width: 56px; height: 56px; overflow: hidden; border-radius: 50%; background: var(--field); }
    .avatar img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .25s; }
    .avatar img.image-loaded { opacity: 1; }
    .artist-actions { display: flex; flex-direction: column; gap: 6px; }
    .artist-actions .btn { height: 32px; font-size: 12px; letter-spacing: .8px; }

    .entity {
      display: flex; align-items: center; gap: 16px; margin: 8px 0 20px; padding: 16px;
      border-radius: 4px; background: var(--surface-1); box-shadow: var(--shadow-1);
    }
    .entity img {
      flex: 0 0 auto; width: 96px; height: 96px; object-fit: cover;
      border-radius: 4px; background: var(--field); box-shadow: var(--shadow-2);
    }
    .entity img.round { border-radius: 50%; }
    .entity h2 { margin: 0 0 4px; overflow-wrap: anywhere; }
    .entity p { margin: 0 0 12px; }
    .entity-meta { min-width: 0; flex: 1; }
    @media (min-width: 720px) {
      .entity img { width: 176px; height: 176px; }
    }

    /* ═══════════════════════════════════════════════════════════
       Stats / overview / toolbar
       ═══════════════════════════════════════════════════════════ */
    .stat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 20px 0 12px; }
    .stat {
      position: relative; display: block; min-width: 0; overflow: hidden;
      padding: 12px 16px; border-radius: 4px; text-align: left;
      background: var(--surface-1); box-shadow: var(--shadow-1);
      transition: box-shadow .2s, background-color .2s;
    }
    .stat:hover { box-shadow: var(--shadow-3); }
    .stat.active { background: var(--tint-strong); box-shadow: var(--shadow-2); }
    .stat.active .stat-top, .stat.active strong, .stat.active span.l { color: var(--primary); }
    .stat-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--on-surface-med); }
    .stat strong { font: 400 24px/32px Roboto; font-variant-numeric: tabular-nums; letter-spacing: 0; }
    .stat span.l { display: block; color: var(--on-surface-med); font: 500 11px/16px Roboto; letter-spacing: .8px; text-transform: uppercase; }
    @media (min-width: 600px) { .stat-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

    .overview {
      margin: 0 0 12px; padding: 16px; border-radius: 4px;
      background: var(--surface-1); box-shadow: var(--shadow-1);
    }
    .overview-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .overview-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; color: var(--on-surface-med); font: 400 12px/16px Roboto; }
    .overview-foot b { color: var(--on-surface); font-weight: 500; }

    .toolbar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 8px 12px; margin: 16px 0 8px;
    }
    .toolbar-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .pager { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 16px 0 4px; color: var(--on-surface-med); }

    /* ═══════════════════════════════════════════════════════════
       Empty / skeleton / banner
       ═══════════════════════════════════════════════════════════ */
    .empty {
      margin-top: 16px; padding: 40px 24px; border-radius: 4px;
      background: var(--surface-1); box-shadow: var(--shadow-1);
      text-align: center; animation: fade-in .2s both;
    }
    .empty__icon {
      display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto 16px;
      border-radius: 50%; background: var(--tint-strong); color: var(--primary);
    }
    .empty__icon .material-icons { font-size: 30px; }
    .empty h3 { margin: 0 0 4px; }
    .empty p { max-width: 26rem; margin: 0 auto; }
    .empty__actions { margin-top: 20px; }

    .sk { position: relative; overflow: hidden; border-radius: 4px; background: var(--field); }
    .sk::after {
      position: absolute; inset: 0; transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, var(--hover), transparent);
      content: ''; animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { to { transform: translateX(100%); } }
    .sk-row { display: grid; grid-template-columns: 56px 1fr 80px; gap: 16px; align-items: center; padding: 8px; }
    .sk-art { width: 56px; height: 56px; }
    .sk-line { height: 12px; margin: 6px 0; }
    .sk-btn { height: 32px; border-radius: 16px; }

    .banner {
      margin: 12px 16px; padding: 12px 16px; border-radius: 4px;
      background: var(--error); color: var(--on-error); box-shadow: var(--shadow-2);
    }

    /* ═══════════════════════════════════════════════════════════
       Linear progress
       ═══════════════════════════════════════════════════════════ */
    .progress {
      position: relative; width: 100%; height: 4px; overflow: hidden;
      border-radius: 2px; background: var(--tint-strong);
    }
    .progress__bar {
      height: 100%; width: 0; border-radius: 2px;
      background: var(--primary); transition: width .2s ease;
    }
    .progress--indeterminate .progress__bar {
      width: 40% !important; position: absolute; left: -40%;
      animation: indeterminate 1.4s cubic-bezier(.4,0,.6,1) infinite;
    }
    @keyframes indeterminate {
      0% { left: -40%; }
      60% { left: 100%; }
      100% { left: 100%; }
    }
    .top-progress {
      position: fixed; z-index: 100; top: 0; right: 0; left: 0;
      height: 3px; overflow: hidden; opacity: 0;
      pointer-events: none; transition: opacity .2s;
    }
    .top-progress.active { opacity: 1; }
    .top-progress__bar {
      position: absolute; left: -35%; width: 35%; height: 100%;
      background: var(--primary); border-radius: 2px;
      animation: indeterminate 1.4s cubic-bezier(.4,0,.6,1) infinite;
    }

    /* ═══════════════════════════════════════════════════════════
       Snackbar
       ═══════════════════════════════════════════════════════════ */
    .snackbar {
      position: fixed; z-index: 60; left: 50%;
      bottom: calc(var(--nav-h) + var(--safe-b) + 12px);
      display: flex; align-items: center; gap: 12px;
      max-width: min(calc(100vw - 16px), 568px); min-height: 48px; padding: 12px 16px;
      border-radius: 4px; background: var(--snack-bg); color: var(--on-snack);
      box-shadow: var(--shadow-6);
      font: 400 14px/20px Roboto; letter-spacing: .25px;
      opacity: 0; transform: translate(-50%, 12px); pointer-events: none;
      transition: opacity .2s, transform .2s;
    }
    .snackbar.show { opacity: 1; transform: translate(-50%, 0); }
    .snackbar .material-icons { font-size: 20px; color: var(--primary); }
    body.has-player .snackbar { bottom: calc(var(--nav-h) + var(--safe-b) + 200px); }
    @media (min-width: 900px) {
      .snackbar { left: calc(50% + var(--drawer-w) / 2); bottom: 24px; }
      body.has-player .snackbar { bottom: 168px; }
    }

    /* ═══════════════════════════════════════════════════════════
       Menu
       ═══════════════════════════════════════════════════════════ */
    .menu-scrim { position: fixed; inset: 0; z-index: 70; background: transparent; }
    .menu {
      position: fixed; z-index: 71; min-width: 200px; max-width: 300px; padding: 8px 0;
      border-radius: 4px; background: var(--surface-1); box-shadow: var(--shadow-8);
      animation: menu-in .12s ease-out;
    }
    @keyframes menu-in { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: scale(1); } }
    .menu-item {
      display: flex; align-items: center; gap: 16px; width: 100%;
      height: 48px; padding: 0 16px; text-align: left;
      color: var(--on-surface); font: 400 16px/24px Roboto; letter-spacing: .15px;
      transition: background-color .15s;
    }
    .menu-item:hover { background: var(--hover); }
    .menu-item .material-icons { color: var(--on-surface-med); font-size: 22px; }
    .menu-item:disabled, .menu-item.disabled { color: var(--on-surface-dis); pointer-events: none; }
    .menu-item:disabled .material-icons { color: var(--on-surface-dis); }
    .menu-divider { height: 1px; margin: 8px 0; background: var(--divider); }

    /* ═══════════════════════════════════════════════════════════
       Dialog
       ═══════════════════════════════════════════════════════════ */
    .dialog-scrim {
      position: fixed; inset: 0; z-index: 80;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; background: rgba(0,0,0,.5);
      opacity: 0; transition: opacity .18s;
    }
    .dialog-scrim.show { opacity: 1; }
    .dialog {
      display: flex; flex-direction: column;
      width: 100%; max-width: 560px; max-height: min(680px, 90vh);
      padding: 0; border-radius: 4px; background: var(--surface-1);
      box-shadow: var(--shadow-24);
      transform: scale(.94); transition: transform .18s ease;
    }
    .dialog-scrim.show .dialog { transform: scale(1); }
    .dialog__headline {
      margin: 0; padding: 24px 24px 0;
      font: 400 20px/28px Roboto; letter-spacing: .15px;
    }
    .dialog__headline:empty { display: none; }
    .dialog__content { padding: 16px 24px; overflow: auto; }
    .dialog__headline:empty + .dialog__content { padding-top: 24px; }
    .dialog__actions {
      display: flex; align-items: center; justify-content: flex-end;
      gap: 8px; padding: 8px 16px 16px;
    }

    /* ── Text fields (M2 filled with floating label) ── */
    .text-field {
      position: relative; display: block;
      border-radius: 4px 4px 0 0;
      background: var(--field);
      border-bottom: 1px solid var(--divider-strong);
      transition: background-color .15s;
    }
    .text-field:hover { background: var(--field-hover); }
    .text-field::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
      background: var(--primary); transform: scaleX(0); transition: transform .18s ease;
    }
    .text-field:focus-within::after { transform: scaleX(1); }
    .text-field input {
      width: 100%; height: 56px; padding: 22px 16px 6px;
      border: 0; outline: 0; background: transparent;
      color: var(--on-surface); font: 400 16px/24px Roboto; letter-spacing: .15px;
    }
    .text-field label {
      position: absolute; left: 16px; top: 17px;
      color: var(--on-surface-med); font: 400 16px/24px Roboto;
      pointer-events: none; transition: top .15s ease, font-size .15s ease, color .15s ease;
    }
    .text-field input:focus + label,
    .text-field input:not(:placeholder-shown) + label {
      top: 7px; font-size: 12px; line-height: 16px;
    }
    .text-field input:focus + label { color: var(--primary); }

    .form { display: grid; gap: 20px; min-width: min(400px, 74vw); padding-top: 4px; }
    .dlg-sub { margin: 0 0 16px; color: var(--on-surface-med); }

    .detail-top { display: flex; align-items: flex-start; gap: 16px; }
    .detail-top img {
      flex: 0 0 auto; width: 88px; height: 88px; object-fit: cover;
      border-radius: 4px; background: var(--field); box-shadow: var(--shadow-2);
    }
    .detail-top > div { flex: 1; min-width: 0; }
    .detail-top audio { width: 100%; margin-top: 4px; }
    .kv { display: grid; grid-template-columns: 1fr; gap: 0 24px; margin-top: 20px; }
    .kv-item {
      display: flex; justify-content: space-between; gap: 16px;
      padding: 8px 0; border-bottom: 1px solid var(--divider);
      font: 400 12px/16px Roboto; letter-spacing: .4px;
    }
    .kv-item span { color: var(--on-surface-med); }
    .kv-item strong { max-width: 62%; overflow-wrap: anywhere; font-weight: 500; text-align: right; }
    @media (min-width: 600px) { .kv { grid-template-columns: 1fr 1fr; } }
    .links { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 16px; font-size: 12px; }
    .lyrics { color: var(--on-surface); font: 400 16px/32px Roboto; letter-spacing: .2px; white-space: pre-wrap; }
    .now-panel {
      position: fixed; z-index: 24; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 12px); right: 16px; bottom: 164px;
      display: flex; width: min(360px, calc(100vw - 32px)); flex-direction: column; overflow: hidden;
      border: 1px solid var(--divider); border-radius: 8px; background: var(--surface-1); box-shadow: var(--shadow-8);
      animation: panel-in .18s ease-out both;
    }
    .now-panel[hidden] { display: none; }
    .now-panel__head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 12px 8px 16px; }
    .now-panel__tabs { display: flex; gap: 4px; padding: 0 12px 8px; border-bottom: 1px solid var(--divider); }
    .now-panel__tab { padding: 7px 12px; border-radius: 4px; color: var(--on-surface-med); font: 500 13px/18px Roboto; }
    .now-panel__tab[aria-selected="true"] { background: var(--tint-strong); color: var(--primary); }
    .now-panel__body { min-height: 0; overflow: auto; padding: 16px; }
    .now-panel__track { margin-bottom: 14px; color: var(--on-surface-med); font: 500 12px/18px Roboto; }
    .synced-lyrics { display: grid; gap: 10px; padding: 8px 0 36px; }
    .synced-line { width: 100%; color: var(--on-surface-med); text-align: left; font: 500 18px/1.5 Roboto; transition: color .2s, transform .2s; }
    .synced-line.active { color: var(--on-surface); transform: translateX(4px); }
    .synced-line.past { color: var(--on-surface-dis); }
    .now-panel__empty { padding: 28px 8px; color: var(--on-surface-med); text-align: center; }
    @keyframes panel-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (min-width: 1200px) { body.now-panel-open .shell { margin-right: 392px; } }
    @media (max-width: 599px) {
      .now-panel { top: calc(var(--bar-h) + env(safe-area-inset-top, 0px) + 8px); right: 8px; bottom: calc(var(--nav-h) + var(--safe-b) + 184px); width: calc(100vw - 16px); }
    }

    /* ═══════════════════════════════════════════════════════════
       Player
       ═══════════════════════════════════════════════════════════ */
    .player {
      position: fixed; z-index: 25; right: 8px; left: 8px;
      bottom: calc(var(--nav-h) + var(--safe-b) + 8px);
      display: grid; grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas: "track end" "center center";
      gap: 2px 8px; padding: 8px 8px 4px 12px;
      border-radius: 4px; background: var(--surface-1);
      box-shadow: var(--shadow-8);
    }
    .player-track { grid-area: track; display: flex; align-items: center; gap: 12px; min-width: 0; }
    .player-art {
      flex: 0 0 auto; width: 48px; height: 48px; object-fit: cover;
      border-radius: 4px; background: var(--field); box-shadow: var(--shadow-1);
    }
    .player-meta { flex: 1; min-width: 0; }
    .player-meta strong, .player-meta span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .player-meta strong { font: 500 14px/20px Roboto; letter-spacing: .1px; }
    .player-meta span { color: var(--on-surface-med); font: 400 12px/16px Roboto; letter-spacing: .4px; }
    .player-center { grid-area: center; display: flex; flex-direction: column; align-items: center; min-width: 0; }
    .player-controls { display: flex; align-items: center; justify-content: center; gap: 2px; }
    #toggle { margin: 0 8px; }
    .player-seek {
      display: flex; align-items: center; gap: 10px; width: 100%;
      color: var(--on-surface-med); font: 400 12px/16px Roboto; font-variant-numeric: tabular-nums;
    }
    .player-seek input[type="range"] { flex: 1; min-width: 0; }
    .player-end { grid-area: end; display: flex; align-items: center; justify-content: flex-end; }
    .player-vol { display: none; align-items: center; gap: 4px; color: var(--on-surface-med); }
    .player-vol input[type="range"] { width: 104px; }

    input[type="range"] {
      appearance: none; -webkit-appearance: none;
      height: 20px; margin: 0; background: transparent;
      accent-color: var(--primary); cursor: pointer;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 4px; border-radius: 2px; background: var(--tint-strong);
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 14px; height: 14px; margin-top: -5px; border-radius: 50%;
      background: var(--primary); box-shadow: var(--shadow-1);
    }
    input[type="range"]::-moz-range-track {
      height: 4px; border-radius: 2px; background: var(--tint-strong);
    }
    input[type="range"]::-moz-range-thumb {
      width: 14px; height: 14px; border: 0; border-radius: 50%;
      background: var(--primary); box-shadow: var(--shadow-1);
    }

    .eq { display: inline-flex; align-items: flex-end; gap: 2px; width: 16px; height: 16px; flex: 0 0 auto; opacity: 0; transition: opacity .2s; }
    .eq i { display: block; width: 3px; height: 4px; border-radius: 2px; background: var(--primary); transform-origin: bottom; }
    .player.is-playing .eq { opacity: 1; }
    .player.is-playing .eq i { animation: eq .7s ease-in-out infinite alternate; }
    .player.is-playing .eq i:nth-child(2) { animation-delay: -.4s; }
    .player.is-playing .eq i:nth-child(3) { animation-delay: -.15s; }
    @keyframes eq { from { height: 3px; } to { height: 16px; } }
    .player.is-loading #toggle { opacity: .7; }

    @media (min-width: 900px) {
      .player {
        right: 24px; left: calc(var(--drawer-w) + 24px); bottom: 16px;
        max-width: 1080px; margin-inline: auto;
        grid-template-columns: minmax(200px, 1fr) minmax(320px, 1.6fr) minmax(200px, 1fr);
        grid-template-areas: "track center end";
        align-items: center; gap: 20px; padding: 10px 16px;
      }
      .player-vol { display: flex; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>

  <div class="snackbar" id="snackbar" role="status" aria-live="polite" aria-atomic="true">

  </div>

  <script type="module">
    'use strict';

    const path = location.pathname;
    const base = path.endsWith('/web/index.html')
      ? path.slice(0, -'web/index.html'.length)
      : path.endsWith('/') ? path : path.slice(0, path.lastIndexOf('/') + 1);
    const API = new URL(`${base}api/index.php`, location.origin).toString();
    const RECENT_KEY = `mman-recent-searches:${base}`;
    const PLAYED_KEY = `mman-recently-played:${base}`;

    /* ───────────── PWA: manifest + icons + service worker ───────────── */
    const appIcon = (size = 512, rounded = true) => 'data:image/svg+xml,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="${size}" height="${size}">` +
      `<rect width="512" height="512" rx="${rounded ? 112 : 0}" fill="#3f51b5"/>` +
      `<g fill="#ffffff">` +
      `<rect x="120" y="240" width="36" height="132" rx="18"/>` +
      `<rect x="184" y="176" width="36" height="196" rx="18"/>` +
      `<rect x="248" y="120" width="36" height="252" rx="18"/>` +
      `<rect x="312" y="200" width="36" height="172" rx="18"/>` +
      `<rect x="376" y="256" width="36" height="116" rx="18"/>` +
      `</g></svg>`
    );

    (function installPWA() {
      const root = location.origin + base;
      const manifest = {
        id: root,
        name: 'mman — music, made personal',
        short_name: 'mman',
        description: 'Discover music, save favorites, download tracks for offline listening and manage your personal queue.',
        start_url: root,
        scope: root,
        display: 'standalone',
        display_override: ['standalone', 'minimal-ui'],
        orientation: 'portrait-primary',
        background_color: '#fafafa',
        theme_color: '#3f51b5',
        categories: ['music', 'entertainment'],
        icons: [
          { src: appIcon(192), sizes: '192x192', type: 'image/svg+xml', purpose: 'any' },
          { src: appIcon(512), sizes: '512x512', type: 'image/svg+xml', purpose: 'any' },
          { src: appIcon(512, false), sizes: '512x512', type: 'image/svg+xml', purpose: 'maskable' }
        ],
        shortcuts: [
          { name: 'Search music', url: `${root}#search`, icons: [{ src: appIcon(192), sizes: '192x192', type: 'image/svg+xml' }] },
          { name: 'My queue', url: `${root}#queue`, icons: [{ src: appIcon(192), sizes: '192x192', type: 'image/svg+xml' }] },
          { name: 'Downloads', url: `${root}#downloads`, icons: [{ src: appIcon(192), sizes: '192x192', type: 'image/svg+xml' }] }
        ]
      };
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
      document.head.append(link);

      const icon = document.createElement('link');
      icon.rel = 'icon';
      icon.type = 'image/svg+xml';
      icon.href = appIcon(64);
      document.head.append(icon);

      const apple = document.createElement('link');
      apple.rel = 'apple-touch-icon';
      apple.href = appIcon(180);
      document.head.append(apple);

      if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register(new URL('sw.js', root).toString(), { scope: base })
            .catch(() => { /* sw.js is optional — the app still works, just without asset caching. */ });
        });
      }
    })();

    /* ───────────── tiny helpers ───────────── */
    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];

    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[char]);
    const seconds = value => value ? `${Math.floor(value / 60)}:${String(Math.floor(value % 60)).padStart(2, '0')}` : '0:00';
    const millis = value => value ? seconds(Math.floor(value / 1000)) : '';
    const post = body => ({ method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

    /* Material 2 icon + icon-button helpers */
    const ic = (name, cls = '') => `<i class="material-icons ${cls}" aria-hidden="true">${name}</i>`;
    const iconBtn = (name, attrs, label, cls = '') =>
      `<button type="button" class="icon-btn ripple ${cls}" ${attrs} aria-label="${esc(label)}" title="${esc(label)}">${ic(name)}</button>`;

    /* M2 buttons */
    const btnContained = (label, attrs = '', symbol = '') =>
      `<button type="button" class="btn btn--contained ripple" ${attrs}>${symbol ? ic(symbol) : ''}${esc(label)}</button>`;
    const btnOutlined = (label, attrs = '', symbol = '') =>
      `<button type="button" class="btn btn--outlined ripple" ${attrs}>${symbol ? ic(symbol) : ''}${esc(label)}</button>`;
    const btnText = (label, attrs = '', symbol = '') =>
      `<button type="button" class="btn btn--text ripple" ${attrs}>${symbol ? ic(symbol) : ''}${esc(label)}</button>`;

    /* M2 linear progress */
    const progressBar = (value, label) => value === 'indeterminate'
      ? `<div class="progress progress--indeterminate" role="progressbar" aria-label="${esc(label)}"><div class="progress__bar"></div></div>`
      : `<div class="progress" role="progressbar" aria-label="${esc(label)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(Number(value) * 100)}"><div class="progress__bar" style="width:${Math.min(100, Math.max(0, Number(value) * 100))}%"></div></div>`;

    const trackId = track => Number(track?.track_id || track?.trackId || track?.id || 0);
    const source = track => (track?.is_crawled || track?.bale_stream_url)
      ? (track.bale_stream_url || '')
      : (track?.preview_url || track?.previewUrl || '');
    const downloadUrl = track => track?.bale_stream_url || '';
    const statusLabel = status => String(status || '').replaceAll('_', ' ');
    const formatBytes = bytes => {
      const n = Number(bytes) || 0;
      if (n <= 0) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB'];
      const index = Math.min(units.length - 1, Math.floor(Math.log(n) / Math.log(1024)));
      return `${(n / 1024 ** index).toFixed(index ? 1 : 0)} ${units[index]}`;
    };
    const safeName = name => String(name || 'track').replace(/[\\/:*?"<>|]/g, '');
    const fileName = track => `${track.artist_name || track.artistName || 'Unknown'} - ${track.name || track.trackName || 'Track'}`
      .replace(/[\\/:*?"<>|]/g, '');

    const asTrack = item => ({
      ...item,
      track_id: item.trackId,
      name: item.trackName,
      artist_name: item.artistName,
      collection_name: item.collectionName,
      duration_ms: item.trackTimeMillis,
      preview_url: item.previewUrl,
      collection_id: item.collectionId,
      artist_id: item.artistId
    });

    const RUNNING = ['searching', 'downloading', 'lyrics', 'tagging', 'uploading_bale', 'uploading_telegram'];
    const ENTITIES = ['song', 'album', 'musicArtist'];
    const ENTITY_LABELS = ['Songs', 'Albums', 'Artists'];
    const QUEUE_STAGES = [
      ['Find', 'searching'],
      ['Audio', 'downloading'],
      ['Lyrics', 'lyrics'],
      ['Tags', 'tagging'],
      ['Publish', 'uploading_bale']
    ];

    /* ───────────── app state ───────────── */
    const app = $('#app');
    const audio = $('#audio');

    let user = null;
    let page = 'home';
    let libraryView = 'liked';
    let activePlaylistId = 0;
    let activePlaylistName = '';
    let playlistPage = 1;
    let entity = 'song';
    let query = '';
    let recent = [];
    let played = [];
    let results = [];
    let queuePage = 1;
    let queueStatus = '';
    let libraryPage = 1;
    let poll = null;
    let syncTimer = null;
    let searchVersion = 0;
    let toastTimer = null;
    let tracks = [];
    let playlist = [];
    let playlistIndex = -1;
    let shuffleEnabled = false;
    let repeatEnabled = false;
    let seeking = false;
    let playerId = 0;
    let apiInFlight = 0;
    let apiProgressTimer = null;
    let apiHideTimer = null;
    let installPrompt = null;
    let panelTab = 'lyrics';
    let panelTrackId = 0;
    let syncedLines = [];
    let lastSyncedLine = -1;

    try {
      const stored = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]');
      if (Array.isArray(stored)) recent = stored.filter(value => typeof value === 'string').slice(0, 8);
    } catch { recent = []; }
    try {
      const storedPlayed = JSON.parse(localStorage.getItem(PLAYED_KEY) || '[]');
      if (Array.isArray(storedPlayed)) played = storedPlayed.slice(0, 12);
    } catch { played = []; }

    /* ───────────── ripple ───────────── */
    document.addEventListener('pointerdown', event => {
      const host = event.target.closest('.ripple');
      if (!host) return;
      if (host.disabled) return;
      const rect = host.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height) * 2.2;
      const wave = document.createElement('span');
      wave.className = 'ripple__wave';
      wave.style.width = wave.style.height = `${size}px`;
      wave.style.left = `${event.clientX - rect.left - size / 2}px`;
      wave.style.top = `${event.clientY - rect.top - size / 2}px`;
      host.appendChild(wave);
      setTimeout(() => wave.remove(), 600);
    }, { passive: true });

    /* ───────────── IndexedDB (offline library) ───────────── */
    const DB_NAME = 'mman-offline';
    const DB_VERSION = 1;
    let dbPromise = null;

    function openDB() {
      if (!dbPromise) {
        dbPromise = new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME, DB_VERSION);
          request.onupgradeneeded = () => {
            const db = request.result;
            if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'id' });
            if (!db.objectStoreNames.contains('blobs')) db.createObjectStore('blobs', { keyPath: 'id' });
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }
      return dbPromise;
    }
    async function dbGet(store, key) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const request = db.transaction(store).objectStore(store).get(key);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }
    async function dbAll(store) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const request = db.transaction(store).objectStore(store).getAll();
        request.onsuccess = () => resolve(request.result || []);
        request.onerror = () => reject(request.error);
      });
    }
    async function dbPut(store, value) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const request = db.transaction(store, 'readwrite').objectStore(store).put(value);
        request.onsuccess = () => resolve(true);
        request.onerror = () => reject(request.error);
      });
    }
    async function dbDelete(store, key) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const request = db.transaction(store, 'readwrite').objectStore(store).delete(key);
        request.onsuccess = () => resolve(true);
        request.onerror = () => reject(request.error);
      });
    }

    /* ───────────── offline download manager ───────────── */
    const offline = new Map();        // trackId -> { state, pct, loaded, total, size, phase, error }
    const offlineUrls = new Map();    // trackId -> object URL
    const offlinePending = [];        // queue of tracks waiting to be stored
    let offlineRunning = false;

    async function hydrateOfflineIndex() {
      try {
        const metas = await dbAll('meta');
        metas.forEach(meta => {
          if (!offline.has(meta.id)) offline.set(meta.id, { state: 'ready', pct: 100, size: meta.size || 0 });
        });
      } catch { /* Storage can be unavailable (private mode). */ }
    }

    async function offlineUrl(id) {
      if (offlineUrls.has(id)) return offlineUrls.get(id);
      try {
        const record = await dbGet('blobs', id);
        if (!record?.blob) return '';
        const url = URL.createObjectURL(record.blob);
        offlineUrls.set(id, url);
        return url;
      } catch { return ''; }
    }

    function isOfflineReady(id) {
      return offline.get(Number(id))?.state === 'ready';
    }

    function queueOfflineDownload(track) {
      const id = trackId(track);
      if (!id || !downloadUrl(track)) return false;
      const state = offline.get(id)?.state;
      if (state === 'ready' || state === 'downloading' || state === 'saving' || state === 'queued' || state === 'error') return false;
      offline.set(id, { state: 'queued', pct: 0 });
      offlinePending.push(track);
      refreshOfflineSlot(id);
      runOfflineQueue();
      return true;
    }

    async function runOfflineQueue() {
      if (offlineRunning) return;
      offlineRunning = true;
      try {
        while (offlinePending.length) {
          const track = offlinePending.shift();
          try {
            await storeTrackOffline(track);
          } catch (error) {
            const id = trackId(track);
            offline.set(id, { state: 'error', pct: 0, error: error.message || 'Download failed' });
            refreshOfflineSlot(id);
          }
        }
      } finally {
        offlineRunning = false;
        if (page === 'downloads') paintDownloads();
      }
    }

    async function storeTrackOffline(track) {
      const id = trackId(track);
      const url = downloadUrl(track);
      if (!url) throw new Error('No downloadable audio for this track');

      offline.set(id, { state: 'downloading', phase: 'Connecting', pct: 0, loaded: 0, total: 0 });
      refreshOfflineSlot(id);

      const response = await fetch(url, { credentials: 'same-origin' });
      if (!response.ok) throw new Error(`Server returned HTTP ${response.status}`);

      const total = Number(response.headers.get('content-length')) || 0;
      const type = response.headers.get('content-type') || 'audio/mpeg';
      const chunks = [];
      let loaded = 0;
      let lastPaint = 0;

      if (response.body && typeof response.body.getReader === 'function') {
        const reader = response.body.getReader();
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          loaded += value.length;
          const now = performance.now();
          if (now - lastPaint > 100) {
            lastPaint = now;
            paintOfflineProgress(id, loaded, total, 'Downloading');
          }
        }
      } else {
        const buffer = await response.arrayBuffer();
        chunks.push(new Uint8Array(buffer));
        loaded = buffer.byteLength;
      }
      paintOfflineProgress(id, loaded, total || loaded, 'Downloading');

      offline.set(id, { state: 'saving', phase: 'Saving to this device', pct: 100, loaded, total: total || loaded });
      refreshOfflineSlot(id);

      const blob = new Blob(chunks, { type });
      await dbPut('blobs', { id, blob });
      await dbPut('meta', {
        id,
        name: track.name || track.trackName || 'Unknown track',
        artist: track.artist_name || track.artistName || 'Unknown artist',
        album: track.collection_name || track.collectionName || '',
        artwork: track.artwork || track.artworkUrl100 || '',
        size: blob.size,
        mime: type,
        savedAt: Date.now()
      });

      offline.set(id, { state: 'ready', pct: 100, size: blob.size });
      refreshOfflineSlot(id);
      notify(`Saved “${track.name || track.trackName || 'track'}” for offline listening`, 'offline_pin');
      if (page === 'downloads') paintDownloads();
      return blob.size;
    }

    function paintOfflineProgress(id, loaded, total, phase) {
      const previous = offline.get(id) || {};
      const pct = total ? Math.min(100, Math.round((loaded / total) * 100)) : 0;
      offline.set(id, { ...previous, state: 'downloading', phase, loaded, total, pct });
      refreshOfflineSlot(id);
      if (page === 'downloads') {
        const sizeEl = $(`[data-offline-size="${id}"]`);
        if (sizeEl) sizeEl.textContent = `${formatBytes(loaded)}${total ? ` / ${formatBytes(total)}` : ''}`;
      }
    }

    function offlineSlotHTML(id) {
      const state = offline.get(id);
      if (!state) return '';
      if (state.state === 'queued') {
        return `<div class="offline-strip"><div class="o-head"><span>${ic('hourglass_top')} Waiting to save offline…</span></div></div>`;
      }
      if (state.state === 'downloading' || state.state === 'saving') {
        const stepIndex = state.state === 'saving' ? 2 : 1;
        const steps = ['Connect', 'Download', 'Save'];
        const value = state.state === 'saving' ? 1 : state.total ? state.pct / 100 : 'indeterminate';
        return `<div class="offline-strip">
          <div class="o-head">
            <span>${ic('cloud_download')} ${esc(state.phase || 'Downloading')}${state.state === 'downloading' && state.total ? ` · ${state.pct}%` : ''}</span>
            <span>${state.total ? `${formatBytes(state.loaded)} / ${formatBytes(state.total)}` : formatBytes(state.loaded || 0)}</span>
          </div>
          ${progressBar(value, 'Offline save progress')}
          <div class="o-steps">${steps.map((label, index) => `<span class="o-step ${index < stepIndex ? 'complete' : index === stepIndex ? 'active' : ''}">${label}</span>`).join('')}</div>
        </div>`;
      }
      if (state.state === 'error') {
        return `<div class="offline-strip"><div class="o-head err">
          <span>${ic('error')} Offline copy failed — ${esc(state.error || 'unknown error')}</span>
          ${btnText('Retry', `data-action="retry-offline" data-id="${id}"`)}
        </div></div>`;
      }
      if (state.state === 'ready') {
        return `<div class="offline-strip"><div class="o-head ok">
          <span>${ic('offline_pin')} Available offline${state.size ? ` · ${formatBytes(state.size)}` : ''}</span>
          <span style="display:flex;gap:4px">
            ${btnText('Save file', `data-action="save-offline" data-id="${id}"`)}
            ${btnText('Remove', `data-action="remove-offline" data-id="${id}"`)}
          </span>
        </div></div>`;
      }
      return '';
    }

    function refreshOfflineSlot(id) {
      $$(`[data-offline-slot="${id}"]`).forEach(slot => { slot.innerHTML = offlineSlotHTML(id); });
    }

    /* ───────────── API ───────────── */
    async function api(action, params = {}, options = {}) {
      const { silent = false, ...fetchOptions } = options;
      const url = `${API}?action=${encodeURIComponent(action)}&${new URLSearchParams(params)}`;
      if (!silent) {
        apiInFlight++;
        clearTimeout(apiHideTimer);
        if (!apiProgressTimer) {
          apiProgressTimer = setTimeout(() => {
            if (apiInFlight > 0) $('#requestProgress')?.classList.add('active');
            apiProgressTimer = null;
          }, 130);
        }
      }
      try {
        const response = await fetch(url, { credentials: 'same-origin', ...fetchOptions });
        let data;
        try { data = await response.json(); }
        catch { throw new Error(`Server returned HTTP ${response.status}`); }
        if (!response.ok) throw new Error(data.message || data.error || `Request failed (${response.status})`);
        return data;
      } finally {
        if (!silent) {
          apiInFlight = Math.max(0, apiInFlight - 1);
          if (apiInFlight === 0) {
            clearTimeout(apiProgressTimer);
            apiProgressTimer = null;
            apiHideTimer = setTimeout(() => $('#requestProgress')?.classList.remove('active'), 180);
          }
        }
      }
    }

    function notify(message, symbol = 'info') {
      $('#snackText').textContent = message;
      $('#snackIcon').textContent = symbol;
      const el = $('#snackbar');
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 3400);
    }

    /* ───────────── menu (M2 popup menu) ───────────── */
    const menu = $('#menu');
    const menuScrim = $('#menuScrim');

    function closeMenu() {
      menu.hidden = true;
      menuScrim.hidden = true;
      menu.innerHTML = '';
    }

    function showMenu(anchor, html) {
      menu.innerHTML = html;
      menuScrim.hidden = false;
      menu.hidden = false;
      menu.style.visibility = 'hidden';
      requestAnimationFrame(() => {
        const rect = anchor.getBoundingClientRect();
        const box = menu.getBoundingClientRect();
        let left = rect.right - box.width;
        let top = rect.bottom + 4;
        if (left < 8) left = 8;
        if (left + box.width > window.innerWidth - 8) left = window.innerWidth - box.width - 8;
        if (top + box.height > window.innerHeight - 8) top = Math.max(8, rect.top - box.height - 4);
        menu.style.left = `${left}px`;
        menu.style.top = `${top}px`;
        menu.style.visibility = 'visible';
      });
    }

    menuScrim.addEventListener('click', closeMenu);

    const menuItem = (action, symbol, label, attrs = '') =>
      `<button type="button" class="menu-item" role="menuitem" data-action="${action}" ${attrs}>${ic(symbol)}<span>${esc(label)}</span></button>`;

    /* ───────────── dialog (M2) ───────────── */
    const dialogEl = $('#dialog');
    const dialog = {
      open: false,
      _timer: null,
      show() {
        clearTimeout(this._timer);
        dialogEl.hidden = false;
        requestAnimationFrame(() => dialogEl.classList.add('show'));
        this.open = true;
      },
      close() {
        dialogEl.classList.remove('show');
        this.open = false;
        clearTimeout(this._timer);
        this._timer = setTimeout(() => { dialogEl.hidden = true; }, 180);
      }
    };
    dialogEl.addEventListener('click', event => { if (event.target === dialogEl) dialog.close(); });

    function openDialog(headline, body, actions = '') {
      $('#dlgHead').textContent = headline;
      $('#dlgBody').innerHTML = body;
      $('#dlgActions').innerHTML = actions || btnText('Close', 'data-action="dialog-close"');
      dialog.show();
    }

    /* ───────────── navigation ───────────── */
    function setNavigation(nextPage) {
      page = nextPage;
      $$('.nav-item').forEach(button => {
        if (button.dataset.page === nextPage) button.setAttribute('aria-current', 'page');
        else button.removeAttribute('aria-current');
      });
    }

    function setPage(nextPage) {
      setNavigation(nextPage);
      clearInterval(poll);
      window.scrollTo({ top: 0 });
      if (nextPage === 'queue') {
        renderQueue();
        poll = setInterval(() => loadQueue(true), 6000);
      } else if (nextPage === 'library') {
        loadLibrary();
      } else if (nextPage === 'downloads') {
        renderDownloads();
      } else if (nextPage === 'search') {
        renderSearch();
      } else {
        renderHome();
      }
    }

    /* ───────────── shared markup ───────────── */
    function pageHeading(title, description) {

        <p class="body1 muted">${esc(description)}</p>

    }

    function sectionHead(title, subtitle = '', kicker = '') {
      return `<div class="section-head">
        <div><h2 class="h6">${esc(title)}</h2>${subtitle ? `<p class="caption muted">${esc(subtitle)}</p>` : ''}</div>
        ${kicker ? `<span class="overline muted">${esc(kicker)}</span>` : ''}
      </div>`;
    }

    function emptyState(title, description, symbol = 'music_note', action = '') {
      return `<div class="empty">
        <div class="empty__icon">${ic(symbol)}</div>
        <h3 class="h6">${esc(title)}</h3>

    /* ───────────── home ───────────── */
    function shelfCard(item) {
      return `<button type="button" class="shelf-card ripple" data-action="play" data-src="${esc(item.src || '')}" data-title="${esc(item.name || 'Track')}" data-artist="${esc(item.artist || '')}" data-id="${item.id}">

    function renderHome() {

      const moods = [
        ['Easy listening', 'Soft sounds for slower days', 'acoustic relaxing', 'headphones', 'm1'],
        ['A little energy', 'Something with a pulse', 'feel good pop', 'bolt', 'm2'],
        ['After hours', 'Quiet music for late nights', 'ambient night', 'bedtime', 'm3'],
        ['Back in time', 'Old favorites and classics', 'classic hits', 'history', 'm4']
      ];
      const genres = ['Pop', 'Indie', 'Jazz', 'Classical', 'Electronic', 'R&B', 'Rock', 'Hip-Hop', 'Country', 'Metal', 'Persian', 'Lo-Fi', 'Soundtrack', 'Folk'];
      const liked = played.slice(0, 8);

      app.innerHTML = `${pageHeading(`${greeting}.`, 'Discover music, save what you love and keep it available offline.')}
        <section class="mood-grid" aria-label="Discover by mood">

        </section>

    /* ───────────── search ───────────── */
    function recentMarkup() {
      if (!recent.length) return '';
      return `<div class="recent" aria-label="Recent searches">
        ${recent.map(term => `<button type="button" class="chip ripple" data-action="recent" data-term="${esc(term)}">${ic('history')}${esc(term)}</button>`).join('')}
        ${btnText('Clear', 'data-action="clear-recent"')}
      </div>`;
