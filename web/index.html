<body>
<div class="layout">
  <aside class="sidebar">
    <a class="brand" href="#" data-page="home"><span class="brand-mark">m</span><span>mman<span class="brand-sub">music, made personal</span></span></a>
    <div class="nav-label">Listen</div>
    <div class="nav-list">
      <button class="nav-button active" data-page="home"><span class="nav-icon">⌂</span>Home</button>
      <button class="nav-button" data-page="search"><span class="nav-icon">⌕</span>Discover</button>
    </div>
    <div class="nav-label">Your space</div>
    <div class="nav-list">
      <button class="nav-button" data-page="queue"><span class="nav-icon">≋</span>My queue <span id="queue-badge"></span></button>
      <button class="nav-button" data-page="favorites"><span class="nav-icon">♡</span>Liked songs</button>
    </div>
    <div class="sidebar-bottom">
      <div class="sidebar-user"><span class="avatar" id="avatar">♪</span><div class="sidebar-user-copy"><strong id="sidebar-account">Guest listener</strong><span>mman listener</span></div><button class="icon-button" id="sidebar-auth" aria-label="Account">⋯</button></div>
    </div>
  </aside>
  <div class="main">
    <header class="mobile-header">
      <a class="brand" href="#" data-page="home"><span class="brand-mark">m</span><span>mman</span></a>
      <button class="account-button" id="mobile-account">Sign in</button>
    </header>
    <div class="topbar">
      <form class="top-search" id="global-search"><span class="search-symbol">⌕</span><input id="global-query" type="search" placeholder="What would you like to listen to?" aria-label="Search music"><kbd>/</kbd></form>
      <div class="topbar-spacer"></div><span class="topbar-caption">Your own little corner of music</span>

</div>
<nav class="mobile-nav" aria-label="Main navigation">

  <button class="nav-button" data-page="search"><span class="nav-icon">⌕</span>Search</button>
  <button class="nav-button" data-page="queue"><span class="nav-icon">≋</span>Queue</button>

</nav>
<section class="player" id="player" hidden>
  <div class="player-inner">
    <div class="player-track"><img class="player-art" id="player-art" alt=""><div class="now-playing"><strong id="player-title">Choose a song</strong><span id="player-artist">Your music starts here</span></div><button class="icon-button favorite" id="player-favorite" aria-label="Like track">♡</button></div>
    <div class="player-center">
      <div class="player-controls"><button class="icon-button skip" id="previous-track" aria-label="Previous track">⏮</button><button class="player-toggle" id="play-toggle" aria-label="Play">▶</button><button class="icon-button skip" id="next-track" aria-label="Next track">⏭</button></div>
      <div class="player-seek"><span id="current-time">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><span id="total-time">0:00</span></div>
    </div>
    <div class="player-extra"><button class="icon-button" id="shuffle" aria-label="Shuffle">⤨</button><button class="icon-button" id="repeat" aria-label="Repeat">↻</button><span>🔈</span><input class="volume" id="volume" type="range" min="0" max="1" step=".01" value=".8" aria-label="Volume"><button class="player-close" id="close-player" aria-label="Close player">×</button></div>
  </div>
  <audio id="audio" preload="none"></audio>
</section>
<dialog id="dialog"><div id="dialog-content"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const pathname=window.location.pathname;
const appBase=pathname.endsWith('/web/index.html')?pathname.slice(0,-'web/index.html'.length):pathname.endsWith('/')?pathname:pathname.slice(0,pathname.lastIndexOf('/')+1);
const API=new URL(`${appBase}api/index.php`,window.location.origin).toString();
const RECENT_KEY=`mman-recent-searches:${appBase}`;
const $=selector=>document.querySelector(selector), app=$('#app'), dialog=$('#dialog'), audio=$('#audio');
let user=null,page='home',entity='song',query='',recentSearches=[],currentResults=[],queuePage=1,queueStatus='',favoritesPage=1,pollTimer=null,toastTimer=null;
let queueItems=[],visibleTracks=[],playerItems=[],playerIndex=-1,shuffleOn=false,repeatOn=false;
try{const stored=JSON.parse(localStorage.getItem(RECENT_KEY)||'[]');if(Array.isArray(stored))recentSearches=stored.filter(value=>typeof value==='string').slice(0,6)}catch{}
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const seconds=value=>value?`${Math.floor(value/60)}:${String(Math.floor(value%60)).padStart(2,'0')}`:'0:00';
const millis=value=>value?seconds(Math.floor(value/1000)):'';
async function api(action,params={},options={}){
 const url=`${API}?action=${encodeURIComponent(action)}&${new URLSearchParams(params)}`;
 const response=await fetch(url,{credentials:'same-origin',...options});
 let data;try{data=await response.json()}catch{throw Error(`Server returned HTTP ${response.status}`)}
 if(!response.ok)throw Error(data.message||data.error||`Request failed (${response.status})`);
 return data;
}
function toast(message){
 const node=$('#toast');node.textContent=message;node.classList.add('show');
 clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.remove('show'),2800);
}
function authHeader(){
 const account=user?`<button class="account-button" data-action="logout">${esc(user.email)} · Sign out</button>`:'<button class="account-button" data-action="auth">Sign in</button>';
 $('#desktop-account').outerHTML=account.replace('<button','<button id="desktop-account"');
 $('#mobile-account').outerHTML=account.replace('<button','<button id="mobile-account"');
 $('#sidebar-account').textContent=user?.email||'Guest listener';
 $('#avatar').textContent=user?(user.email[0]||'♪').toUpperCase():'♪';
 $('#sidebar-auth').dataset.action=user?'logout':'auth';
 $('#queue-badge').textContent='';
}
function setPage(next){
 page=next;clearInterval(pollTimer);
 document.querySelectorAll('[data-page]').forEach(button=>button.classList.toggle('active',button.dataset.page===next));
 if(next==='queue'){renderQueue();pollTimer=setInterval(()=>loadQueue(true),6000)}
 else if(next==='favorites')loadFavorites();
 else if(next==='search')renderSearch();
 else renderHome();
}
function pageHead(eyebrow,title,subtitle,extra=''){
 return `<div class="page-head"><div><span class="eyebrow">${esc(eyebrow)}</span><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div>${extra}</div>`;
}
function renderHome(){
 app.innerHTML=`<section class="hero"><div class="hero-copy"><span class="eyebrow">Good music, no rush</span><h1>Find a song that feels like yours.</h1><p>Explore the catalogue, save the things you love, and build a little listening space of your own.</p><button class="btn" data-page="search">Explore music <span>→</span></button></div></section>
 <section class="section"><div class="section-title"><div><h2>Find your next favorite</h2><p>A few places to begin.</p></div></div><div class="mood-grid">${[['Easy listening','Soft sounds for slow days','acoustic relaxing'],['A little energy','Songs with a brighter pulse','feel good pop'],['After hours','Quiet music for late nights','ambient night'],['Back in time','Old favorites and classics','classic hits']].map(([title,sub,term])=>`<button class="mood-card" data-action="mood" data-term="${esc(term)}"><strong>${esc(title)}</strong><span>${esc(sub)}</span><i class="mood-orb"></i></button>`).join('')}</div></section>
 <section class="section"><div class="section-title"><div><h2>Browse by sound</h2><p>Follow a genre and see where it takes you.</p></div></div><div class="pill-row">${['Pop','Indie','Jazz','Classical','Electronic','R&B','Rock','Persian'].map(genre=>`<button class="pill" data-action="genre" data-term="${esc(genre)}">${esc(genre)}</button>`).join('')}</div></section>
 <section class="section" id="home-library"></section>`;
 loadHomeLibrary();
}
async function loadHomeLibrary(){
 const section=$('#home-library');if(!section)return;
 if(!user){section.innerHTML=`<div class="identity-note">Sign in to keep your liked songs and personal music queue together on this device.</div>`;return}
 try{
  const [queue,favorites]=await Promise.all([api('queue_list',{page:1,per_page:6}),api('favorites',{page:1,per_page:6})]);
  if(page!=='home')return;
  const recent=queue.items||[],liked=(favorites.items||[]).map(item=>({...item,is_favorite:true}));
  visibleTracks=recent.length?recent:liked;
  section.innerHTML=`<div class="section-title"><div><h2>Back to your music</h2><p>Your recent additions and saved songs.</p></div><button class="text-button" data-page="queue">Open my queue →</button></div>${recent.length?`<div class="track-list">${recent.map((track,index)=>trackRow(track,index,{meta:false,context:'queue'})).join('')}</div>`:`<div class="empty"><strong>Your listening space is ready</strong>Add songs from Discover and they’ll find a home here.<button class="btn secondary" data-page="search">Find music</button></div>`}${liked.length?`<div class="section section-title"><div><h2>Liked songs</h2><p>A few you’ve saved for later.</p></div><button class="text-button" data-page="favorites">View all →</button></div><div class="results-grid">${liked.map(track=>albumCard(track,{playable:true})).join('')}</div>`:''}`;
 }catch(error){if(page==='home')section.innerHTML=`<div class="empty">Could not load your library: ${esc(error.message)}</div>`}
}
function renderSearch(){
 app.innerHTML=`${pageHead('Explore','Discover','Search songs, albums, and artists from the catalogue.')}
 <form class="search-panel" id="search-form"><input id="search-query" type="search" placeholder="Try a song, artist, album, or mood…" value="${esc(query)}" autocomplete="off"><button class="btn" type="submit">Search</button></form>
 <div class="toolbar"><div class="pill-row" id="entity-pills">${[['song','Songs'],['album','Albums'],['musicArtist','Artists']].map(([value,label])=>`<button class="pill ${entity===value?'active':''}" data-action="entity" data-value="${value}">${label}</button>`).join('')}</div><select class="select" id="sort-results" aria-label="Sort results"><option value="relevance">Best match</option><option value="title">Title</option><option value="artist">Artist</option></select></div>
 <div id="recent-searches">${recentMarkup()}</div><div class="section-title"><div><h2 id="results-title">${query?'Search results':'Made for exploring'}</h2><p id="results-subtitle">${query?'Search the catalogue to see matches.':'Choose a genre or search for a feeling.'}</p></div></div>
 <div id="results">${query?'<div class="empty">Search to see matching songs and records.</div>':`<div class="mood-grid">${[['Indie discoveries','indie essentials'],['Gentle mornings','acoustic morning'],['Golden oldies','oldies classics'],['Persian favorites','Persian music']].map(([label,term])=>`<button class="mood-card" data-action="mood" data-term="${esc(term)}"><strong>${esc(label)}</strong><span>Explore the collection</span><i class="mood-orb"></i></button>`).join('')}</div>`}</div>`;
 if(query)$('#search-query').value=query;
}
function recentMarkup(){return recentSearches.length?`<div class="recent-searches"><span class="muted">Recent</span>${recentSearches.map(term=>`<button data-action="recent" data-term="${esc(term)}">${esc(term)}</button>`).join('')}<button class="text-button" data-action="clear-recent">Clear</button></div>`:''}
async function performSearch(term=null){
 const input=$('#search-query');query=(term??input?.value??query).trim();if(!query)return;
 if(input)input.value=query;
 $('#global-query').value=query;
 if(page!=='search'){page='search';document.querySelectorAll('[data-page]').forEach(button=>button.classList.toggle('active',button.dataset.page==='search'));renderSearch()}
 const results=$('#results');if(!results)return;
 $('#results-title').textContent=`Searching “${query}”…`;$('#results-subtitle').textContent='Looking through the catalogue.';results.innerHTML='<div class="empty">Finding a few good matches…</div>';
 try{
  const data=await api('search',{term:query,entity,limit:50});
  currentResults=data.results||[];
  recentSearches=[query,...recentSearches.filter(value=>value.toLowerCase()!==query.toLowerCase())].slice(0,6);
  try{localStorage.setItem(RECENT_KEY,JSON.stringify(recentSearches))}catch{}
  const recent=$('#recent-searches');if(recent)recent.innerHTML=recentMarkup();
  renderSearchResults();
 }catch(error){$('#results-title').textContent='Search could not finish';$('#results-subtitle').textContent='Please try again.';results.innerHTML=`<div class="empty">${esc(error.message)}</div>`}
}
function renderSearchResults(){
 const results=$('#results');if(!results)return;
 const label=entity==='musicArtist'?'artists':entity==='album'?'albums':'songs';
 $('#results-title').textContent=`${currentResults.length} ${label}`;
 $('#results-subtitle').textContent=`Results for “${query}”.`;
 if(entity==='album'){visibleTracks=[];results.innerHTML=currentResults.length?`<div class="results-grid">${currentResults.filter(item=>item.wrapperType==='collection').map(item=>albumCard(item)).join('')}</div>`:'<div class="empty"><strong>No records found</strong>Try another title or spelling.</div>';return}
 if(entity==='musicArtist'){visibleTracks=[];results.innerHTML=currentResults.length?`<div class="track-list">${currentResults.map(artistRow).join('')}</div>`:'<div class="empty"><strong>No artists found</strong>Try another artist name.</div>';return}
 const songs=currentResults.filter(item=>item.wrapperType==='track').map(catalogTrack);visibleTracks=songs;
 results.innerHTML=songs.length?`<div class="track-list">${songs.map((item,index)=>trackRow(item,index,{actions:true})).join('')}</div>`:'<div class="empty"><strong>No songs found</strong>Try another title or spelling.</div>';
}
function catalogTrack(item){
 return {track_id:item.trackId,name:item.trackName,artist_name:item.artistName,collection_name:item.collectionName,artwork:item.artwork,duration_ms:item.trackTimeMillis,preview_url:item.previewUrl,wrapperType:item.wrapperType,collection_id:item.collectionId,artist_id:item.artistId};
}
function albumCard(item,{playable=false}={}){
 const track=item.track_id?item:catalogTrack(item);
 const id=Number(track.track_id||track.collection_id||item.collectionId||0);
 const type=track.track_id?'track':'collection';
 const title=track.name||track.collection_name||item.collectionName||'Untitled album';
 const subtitle=track.artist_name||item.artistName||'Album';
 const play=track.bale_stream_url||track.preview_url;
 const playAttrs=play?`data-action="play" data-src="${esc(play)}" data-title="${esc(title)}" data-artist="${esc(subtitle)}" data-track-id="${Number(track.track_id)||0}"`:'';
 return `<article class="album-card"><div class="album-cover" ${id&&type==='collection'?`data-action="open-album" data-id="${id}"`:''}><img loading="lazy" src="${esc(track.artwork||'')}" alt="${esc(title)}"><button class="cover-play" aria-label="Play ${esc(title)}" ${play?playAttrs:'disabled'}>▶</button></div><strong>${esc(title)}</strong><span class="card-subtitle">${esc(subtitle)}</span><div class="track-actions">${track.track_id?`<button class="icon-button favorite ${track.is_favorite?'active':''}" data-action="favorite" data-id="${Number(track.track_id)}" aria-label="Like ${esc(title)}">♡</button>`:''}${id?`<button class="icon-button" data-action="queue-add" data-type="${type}" data-id="${id}" aria-label="Add ${esc(title)} to queue">＋</button>`:''}</div></article>`;
}
function artistRow(item){
 const artwork=item.artwork||'';
 return `<article class="track"><span class="track-number">♪</span><img loading="lazy" src="${esc(artwork)}" alt=""><div class="track-info"><strong>${esc(item.artistName||'Unknown artist')}</strong><span>${esc(item.primaryGenreName||'Artist')}</span></div><div class="track-actions"><button class="btn secondary" data-action="open-artist" data-id="${Number(item.artistId)}">View artist</button><button class="btn" data-action="queue-add" data-type="artist" data-id="${Number(item.artistId)}">Add to queue</button></div></article>`;
}
function trackRow(track,index=0,{actions=false,meta=false,context=''}={}){
 const id=Number(track.track_id||track.trackId||0),title=track.name||track.trackName||'Unknown track',artist=track.artist_name||track.artistName||'Unknown artist';
 const playable=track.bale_stream_url||track.preview_url||track.previewUrl;
 const source=track.bale_stream_url||track.preview_url||track.previewUrl||'';
 const durationText=millis(track.duration_ms||track.trackTimeMillis)||'';
 return `<article class="track" data-track-row="${id}"><span class="track-number">${index+1}</span><img loading="lazy" src="${esc(track.artwork||'')}" alt=""><div class="track-info"><strong>${esc(title)}</strong><span>${esc(artist)}${track.collection_name||track.collectionName?' · '+esc(track.collection_name||track.collectionName):''}</span></div><div class="track-actions">${playable?`<button class="icon-button" data-action="play" data-src="${esc(source)}" data-title="${esc(title)}" data-artist="${esc(artist)}" data-track-id="${id}" aria-label="Play ${esc(title)}">▶</button>`:''}<button class="icon-button favorite ${track.is_favorite?'active':''}" data-action="favorite" data-id="${id}" aria-label="Like ${esc(title)}">♡</button><button class="icon-button" data-action="lyrics" data-id="${id}" data-title="${esc(title)}" aria-label="Lyrics for ${esc(title)}">≡</button>${actions?`<button class="btn secondary" data-action="queue-add" data-type="track" data-id="${id}">＋ Queue</button>`:''}${context==='queue'&&track.status==='failed'?`<button class="btn secondary" data-action="retry" data-id="${id}">Retry</button>`:''}</div>${durationText?`<span class="track-duration">${durationText}</span>`:'<span class="track-duration"></span>'}${meta?`<div class="track-meta">${esc(track.status||'')} · ${Number(track.progress)||0}%${track.message?' · '+esc(track.message):''}</div>`:''}</article>`;
}
async function openAlbum(id){
 app.innerHTML='<div class="empty">Opening album…</div>';
 try{
  const {results=[]}=await api('lookup',{id,entity:'song'}),songs=results.filter(item=>item.wrapperType==='track'),album=songs[0]||results[0]||{};
  const queue= songs.map(catalogTrack);visibleTracks=queue;
  app.innerHTML=`<button class="text-button" data-action="back-search">← Back to discovery</button><div class="artist-head"><img src="${esc(album.artwork||'')}" alt=""><div><span class="eyebrow">Album</span><h2>${esc(album.collectionName||'Album')}</h2><p>${esc(album.artistName||'')} · ${songs.length} songs</p><button class="btn" data-action="queue-add" data-type="collection" data-id="${Number(id)}">＋ Add album to queue</button></div></div><div class="section-title"><h2>Tracks</h2><span class="muted">${songs.length} songs</span></div><div class="track-list">${queue.map((track,index)=>trackRow(track,index,{actions:true})).join('')||'<div class="empty">No tracks are listed for this record.</div>'}</div>`;
  setPageNav('search');
 }catch(error){app.innerHTML=`<div class="empty">${esc(error.message)}</div>`}
}
async function openArtist(id){
 app.innerHTML='<div class="empty">Opening artist…</div>';
 try{
  const {results=[]}=await api('lookup',{id,entity:'album'}),albums=results.filter(item=>item.wrapperType==='collection'),artist=results[0]||{};
  app.innerHTML=`<button class="text-button" data-action="back-search">← Back to discovery</button><div class="artist-head"><img src="${esc(artist.artwork||'')}" alt=""><div><span class="eyebrow">Artist</span><h2>${esc(artist.artistName||'Artist')}</h2><p>${albums.length} records in the catalogue</p><button class="btn" data-action="queue-add" data-type="artist" data-id="${Number(id)}">＋ Add artist to queue</button></div></div><div class="section-title"><h2>Albums</h2></div><div class="results-grid">${albums.map(album=>albumCard(album)).join('')||'<div class="empty">No albums found for this artist.</div>'}</div>`;
  setPageNav('search');
 }catch(error){app.innerHTML=`<div class="empty">${esc(error.message)}</div>`}
}
function setPageNav(next){page=next;document.querySelectorAll('[data-page]').forEach(button=>button.classList.toggle('active',button.dataset.page===next))}
async function addToQueue(type,id){
 if(!user){showAuth();toast('Sign in to save music to your queue');return}
 try{const data=await api('queue_add',{}, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,id})});toast(`${data.added} ${data.added===1?'song':'songs'} added to your queue`);if(page==='queue')loadQueue(true)}
 catch(error){toast(error.message)}
}
async function toggleFavorite(trackId){
 if(!trackId){toast('Open a song first to save it to liked songs.');return}
 if(!user){showAuth();return}
 try{const result=await api('favorite',{}, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({track_id:trackId})});document.querySelectorAll('[data-action="favorite"]').forEach(button=>{if(Number(button.dataset.id)===trackId)button.classList.toggle('active',result.favorite)});if(Number($('#player-favorite').dataset.id)===trackId)$('#player-favorite').classList.toggle('active',result.favorite);toast(result.favorite?'Added to liked songs':'Removed from liked songs');if(page==='favorites')loadFavorites();if(page==='home')loadHomeLibrary()}
 catch(error){toast(error.message)}
}
function renderQueue(){
 app.innerHTML=`${pageHead('Your listening space','My queue','Your personal music, with progress when you choose to download it.')}<div class="identity-note"><span>◈</span> Private to your account · Other listeners’ queues and legacy items are not shown here.</div><div class="dashboard" id="queue-summary"></div><div class="toolbar"><select class="select" id="queue-status" aria-label="Filter queue"><option value="">All your songs</option>${['queued','searching','downloading','lyrics','tagging','uploading_bale','uploading_telegram','done','failed'].map(status=>`<option value="${status}" ${status===queueStatus?'selected':''}>${status.replaceAll('_',' ')}</option>`).join('')}</select><div class="search-tools"><span class="muted" id="queue-count"></span><button class="btn secondary" data-action="play-visible">▶ Play ready</button><button class="btn secondary" data-action="refresh">Refresh</button><button class="btn secondary" data-action="export">Export</button></div></div><div id="queue-items"></div><div class="pager" id="queue-pager"></div>`;
 loadQueue();
}
async function loadQueue(silent=false){
 if(!user){$('#queue-items').innerHTML=`<div class="empty"><strong>Your queue is yours</strong>Sign in to see the songs you have added.<br><button class="btn" data-action="auth">Sign in</button></div>`;clearInterval(pollTimer);return}
 if(!silent)$('#queue-items').innerHTML='<div class="empty">Loading your music…</div>';
 try{
  const data=await api('queue_list',{page:queuePage,per_page:25,status:queueStatus});
  queueItems=data.items||[];visibleTracks=queueItems;$('#queue-count').textContent=`${data.total} ${data.total===1?'song':'songs'}`;
  renderQueueSummary(data.status_counts||{});
  $('#queue-items').innerHTML=queueItems.length?`<div class="track-list">${queueItems.map((item,index)=>`${trackRow(item,index,{context:'queue'})}<details class="activity-details"><summary><span><i class="state-dot" data-status="${esc(item.status)}"></i>${esc(item.status.replaceAll('_',' '))}</span><span>${Number(item.progress)}%</span></summary>${item.message?`<p class="activity-copy">${esc(item.message)}</p>`:''}<div class="progress ${item.status==='failed'?'failed':''}"><i style="width:${Math.max(0,Math.min(100,Number(item.progress)||0))}%"></i></div>${item.bale_message_id||item.bale_file_id?`<p class="activity-copy">Bale message ${esc(item.bale_message_id||'—')} · file ${esc(item.bale_file_id||'—')}</p>`:''}<div class="activity-links">${item.telegram_url?`<a href="${esc(item.telegram_url)}" target="_blank" rel="noopener">Open Telegram</a>`:''}${item.bale_url?`<a href="${esc(item.bale_url)}" target="_blank" rel="noopener">Open Bale channel</a>`:''}${item.status==='failed'?`<button class="text-button" data-action="retry" data-id="${Number(item.track_id)}">Try again</button>`:''}${['queued','failed','done'].includes(item.status)?`<button class="text-button" data-action="remove-queue" data-id="${Number(item.id)}">Remove from queue</button>`:''}</div></details>`).join('')}</div>`:`<div class="empty"><strong>${queueStatus?'No '+esc(queueStatus.replaceAll('_',' '))+' songs':'A little room for more music'}</strong>${queueStatus?'Change the filter to see other songs.':'Discover something you love and add it here. Your queue is always personal.'}<br><button class="btn secondary" data-page="search">Discover music</button></div>`;
  $('#queue-pager').innerHTML=data.pages>1?`<button class="btn secondary" data-action="queue-page" data-page-number="${queuePage-1}" ${queuePage<=1?'disabled':''}>← Newer</button><span>Page ${data.page} of ${data.pages}</span><button class="btn secondary" data-action="queue-page" data-page-number="${queuePage+1}" ${queuePage>=data.pages?'disabled':''}>Older →</button>`:'';
 }catch(error){$('#queue-items').innerHTML=`<div class="empty">${esc(error.message)}<br><button class="btn secondary" data-action="auth">Sign in</button></div>`}
}
function renderQueueSummary(counts){
 const all=Object.values(counts).reduce((sum,value)=>sum+Number(value||0),0),active=['searching','downloading','lyrics','tagging','uploading_bale','uploading_telegram'].reduce((sum,key)=>sum+Number(counts[key]||0),0);
 const cards=[['','All songs',all],['queued','Up next',counts.queued||0],['downloading','In progress',active],['done','Ready',counts.done||0]];
 $('#queue-summary').innerHTML=cards.map(([status,label,count])=>`<button class="stat-card ${queueStatus===status?'active':''}" data-action="queue-filter" data-status="${status}"><span>${label}</span><strong>${count}</strong></button>`).join('');
}
async function removeQueue(id){
 try{await api('queue_remove',{}, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({queue_id:id})});toast('Removed from your queue');loadQueue(true)}
 catch(error){toast(error.message)}
}
async function loadFavorites(){
 clearInterval(pollTimer);
 if(!user){app.innerHTML=`${pageHead('Your collection','Liked songs','Your saved music, all in one place.')}<div class="empty"><strong>Keep the songs you love</strong>Sign in to build your own collection.<br><button class="btn" data-action="auth">Sign in</button></div>`;return}
 app.innerHTML=`${pageHead('Your collection','Liked songs','Songs you have saved to come back to.')}<div class="toolbar"><span class="muted" id="favorite-count"></span><div class="search-tools"><button class="btn secondary" data-action="play-visible">▶ Play available</button><button class="btn secondary" data-action="export-favorites">Export saved songs</button></div></div><div id="favorite-items"></div><div class="pager" id="favorite-pager"></div>`;
 try{
  const data=await api('favorites',{page:favoritesPage,per_page:30});data.items=(data.items||[]).map(item=>({...item,is_favorite:true}));visibleTracks=data.items;
  $('#favorite-count').textContent=`${data.total} ${data.total===1?'song':'songs'}`;
  $('#favorite-items').innerHTML=data.items.length?`<div class="track-list">${data.items.map((item,index)=>trackRow(item,index,{actions:true})).join('')}</div>`:`<div class="empty"><strong>Your favorites start with one song</strong>Search the catalogue and tap ♡ on anything you’d like to keep.<br><button class="btn secondary" data-page="search">Find a song</button></div>`;
  $('#favorite-pager').innerHTML=data.pages>1?`<button class="btn secondary" data-action="favorite-page" data-page-number="${favoritesPage-1}" ${favoritesPage<=1?'disabled':''}>← Previous</button><span>Page ${data.page} of ${data.pages}</span><button class="btn secondary" data-action="favorite-page" data-page-number="${favoritesPage+1}" ${favoritesPage>=data.pages?'disabled':''}>Next →</button>`:'';
 }catch(error){$('#favorite-items').innerHTML=`<div class="empty">${esc(error.message)}</div>`}
}
async function showLyrics(trackId,title){
 dialog.showModal();$('#dialog-content').innerHTML=`<div class="dialog-head"><div><span class="eyebrow">Words & music</span><h2>${esc(title)}</h2></div><button class="icon-button" data-action="close-dialog" aria-label="Close">×</button></div><div class="lyrics">Finding lyrics…</div>`;
 try{const data=await api('lyrics',{track_id:trackId});const content=data.lyrics_synced||data.lyrics_plain||'Lyrics aren’t available for this song yet.';$('#dialog-content').innerHTML=`<div class="dialog-head"><div><span class="eyebrow">${data.lyrics_synced?'Synced lyrics':'Lyrics'}</span><h2>${esc(title)}</h2></div><button class="icon-button" data-action="close-dialog" aria-label="Close">×</button></div><p class="muted">${data.lyrics_source?`Source · ${esc(data.lyrics_source)}`:''}</p><div class="lyrics">${esc(content)}</div>`}
 catch(error){$('#dialog-content').innerHTML=`<div class="dialog-head"><h2>${esc(title)}</h2><button class="icon-button" data-action="close-dialog" aria-label="Close">×</button></div><div class="empty">${esc(error.message)}</div>`}
}
function setPlayerContext(items,index){
 playerItems=items.filter(item=>item.bale_stream_url||item.preview_url||item.previewUrl);playerIndex=playerItems.findIndex(item=>Number(item.track_id||item.trackId)===Number(index));
 if(playerIndex<0)playerIndex=0;
}
function playTrack(source,title,artist,trackId=0){
 if(!source)return;
 if(visibleTracks.length){setPlayerContext(visibleTracks,trackId)}
 const activeTrack=currentTrack();
 $('#player').hidden=false;$('#player-title').textContent=title;$('#player-artist').textContent=`${artist}${activeTrack?.preview_url&&!activeTrack?.bale_stream_url?' · catalogue preview':''}`;$('#player-art').src=activeTrack?.artwork||'';
 audio.src=source;audio.play().then(()=>updatePlayButton()).catch(()=>{updatePlayButton();toast('Tap play to start this track')});
 updateFavoriteButton(trackId);
}
function currentTrack(){return playerItems[playerIndex]||null}
function setPlayerTrack(track){
 if(!track)return;
 const source=track.bale_stream_url||track.preview_url||track.previewUrl;
 const title=track.name||track.trackName||'Unknown track';
 const artist=track.artist_name||track.artistName||'Unknown artist';
 playTrack(source,title,artist,track.track_id||track.trackId);
}
function updatePlayButton(){const button=$('#play-toggle');button.textContent=audio.paused?'▶':'Ⅱ';button.setAttribute('aria-label',audio.paused?'Play':'Pause')}
function updateFavoriteButton(trackId){
 const button=$('#player-favorite');button.dataset.id=String(trackId||0);button.classList.toggle('active',Boolean(currentTrack()?.is_favorite));button.setAttribute('aria-label','Like current track');
}
function updatePlayerProgress(){
 $('#current-time').textContent=seconds(audio.currentTime||0);$('#total-time').textContent=seconds(audio.duration||0);
 $('#seek').value=audio.duration?String(Math.round(audio.currentTime/audio.duration*1000)):'0';
}
function skipTrack(direction){
 if(!playerItems.length)return;
 let next=playerIndex+direction;
 if(shuffleOn){const candidates=playerItems.map((_,index)=>index).filter(index=>index!==playerIndex);next=candidates[Math.floor(Math.random()*candidates.length)]??playerIndex}
 if(next<0||next>=playerItems.length){if(repeatOn)next=(next+playerItems.length)%playerItems.length;else return}
 playerIndex=next;setPlayerTrack(playerItems[playerIndex]);
}
function playVisible(){
 const playable=visibleTracks.filter(track=>track.bale_stream_url||track.preview_url||track.previewUrl);
 if(!playable.length){toast('No playable uploads in this view yet.');return}
 setPlayerContext(visibleTracks,playable[0].track_id||playable[0].trackId);
 setPlayerTrack(playerItems[playerIndex]);
}
function exportCsv(items,filename){
 const columns=['name','artist_name','collection_name','status','progress','bale_file_id','bale_message_id','telegram_file_id'];
 const value=item=>`"${String(item??'').replace(/^[\s]*[=+\-@]/,'').replaceAll('"','""')}"`;
 const csv=[columns.join(','),...items.map(item=>columns.map(key=>value(item[key])).join(','))].join('\r\n');
 const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),link=document.createElement('a');
 link.href=url;link.download=filename;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function exportQueue(){
 try{const first=await api('queue_list',{page:1,per_page:100,status:queueStatus}),items=[...first.items];for(let n=2;n<=first.pages;n++)items.push(...(await api('queue_list',{page:n,per_page:100,status:queueStatus})).items);exportCsv(items,`mman-queue-${new Date().toISOString().slice(0,10)}.csv`);toast(`Exported ${items.length} songs from your queue`)}
 catch(error){toast(`Export failed: ${error.message}`)}
}
async function exportFavorites(){
 try{const first=await api('favorites',{page:1,per_page:100}),items=[...first.items];for(let n=2;n<=first.pages;n++)items.push(...(await api('favorites',{page:n,per_page:100})).items);exportCsv(items,`mman-liked-songs-${new Date().toISOString().slice(0,10)}.csv`);toast(`Exported ${items.length} saved songs`)}
 catch(error){toast(`Export failed: ${error.message}`)}
}
function showAuth(register=false){
 dialog.showModal();
 $('#dialog-content').innerHTML=`<div class="auth"><div class="dialog-head"><div><span class="eyebrow">Your music, your space</span><h2>${register?'Create your account':'Welcome back'}</h2></div><button class="icon-button" data-action="close-dialog" aria-label="Close">×</button></div><p>${register?'Save your collection and keep your queue close.':'Sign in to find your queue and liked songs.'}</p><form id="auth-form" data-register="${register}"><input id="auth-email" type="email" placeholder="Email address" required maxlength="254" autocomplete="email"><input id="auth-password" type="password" placeholder="Password (at least 10 characters)" required minlength="10" autocomplete="${register?'new-password':'current-password'}"><button class="btn" type="submit">${register?'Create account':'Sign in'}</button><button class="auth-switch" type="button" data-action="auth-switch" data-register="${!register}">${register?'Already have an account? Sign in':'New to mman? Create an account'}</button></form></div>`;
}
async function submitAuth(register){
 const email=$('#auth-email').value,password=$('#auth-password').value;
 try{const data=await api(register?'register':'login',{}, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});user=data.user;dialog.close();authHeader();toast(`Welcome, ${user.email}`);if(page==='queue')setPage('queue');else if(page==='favorites')loadFavorites();else if(page==='home')loadHomeLibrary()}
 catch(error){toast(error.message)}
}
async function logout(){
 try{await api('logout',{}, {method:'POST'});user=null;authHeader();toast('You’ve signed out');setPage('home')}
 catch(error){toast(error.message)}
}
function bindEvents(){
 document.addEventListener('click',event=>{
  const pageButton=event.target.closest('[data-page]');
  if(pageButton){event.preventDefault();setPage(pageButton.dataset.page);return}
  const button=event.target.closest('[data-action]');if(!button)return;
  const {action,id,type,term,value}=button.dataset;
  if(action==='mood'||action==='genre'){query=term;entity='song';setPage('search');performSearch(term)}
  else if(action==='recent'){query=term;performSearch(term)}
  else if(action==='clear-recent'){recentSearches=[];try{localStorage.removeItem(RECENT_KEY)}catch{}const node=$('#recent-searches');if(node)node.innerHTML=''}
  else if(action==='entity'){entity=value;document.querySelectorAll('#entity-pills .pill').forEach(pill=>pill.classList.toggle('active',pill.dataset.value===value));if(query)performSearch(query)}
  else if(action==='play')playTrack(button.dataset.src,button.dataset.title,button.dataset.artist,Number(button.dataset.trackId))
  else if(action==='favorite')toggleFavorite(Number(id))
  else if(action==='lyrics')showLyrics(Number(id),button.dataset.title||'Lyrics')
  else if(action==='queue-add')addToQueue(type,Number(id))
  else if(action==='open-album')openAlbum(Number(id))
  else if(action==='open-artist')openArtist(Number(id))
  else if(action==='back-search'){setPage('search');if(query)performSearch(query)}
  else if(action==='remove-queue')removeQueue(Number(id))
  else if(action==='refresh')loadQueue()
  else if(action==='export')exportQueue()
  else if(action==='export-favorites')exportFavorites()
  else if(action==='queue-filter'){queueStatus=button.dataset.status;queuePage=1;renderQueue()}
  else if(action==='queue-page'){queuePage=Number(button.dataset.pageNumber);loadQueue()}
  else if(action==='favorite-page'){favoritesPage=Number(button.dataset.pageNumber);loadFavorites()}
  else if(action==='retry')addToQueue('track',Number(id))
  else if(action==='play-visible')playVisible()
  else if(action==='auth')showAuth()
  else if(action==='logout')logout()
  else if(action==='auth-switch')showAuth(button.dataset.register==='true')
  else if(action==='close-dialog')dialog.close()
 });
 $('#global-search').addEventListener('submit',event=>{event.preventDefault();query=$('#global-query').value.trim();entity='song';setPage('search');performSearch(query)});
 app.addEventListener('submit',event=>{if(event.target.id==='search-form'){event.preventDefault();performSearch()}if(event.target.id==='auth-form'){event.preventDefault();submitAuth(event.target.dataset.register==='true')}});
 $('#global-query').addEventListener('input',event=>{if($('#search-query'))$('#search-query').value=event.target.value});
 document.addEventListener('keydown',event=>{
  if(event.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){event.preventDefault();$('#global-query').focus()}
  if(event.code==='Space'&&!['INPUT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName)&&!dialog.open){event.preventDefault();if(audio.src){audio.paused?audio.play():audio.pause()}}
  if(event.key==='Escape'&&dialog.open)dialog.close();
 });
 $('#play-toggle').addEventListener('click',()=>{if(!audio.src)return;audio.paused?audio.play():audio.pause()});
 $('#previous-track').addEventListener('click',()=>skipTrack(-1));$('#next-track').addEventListener('click',()=>skipTrack(1));
 $('#shuffle').addEventListener('click',event=>{shuffleOn=!shuffleOn;event.currentTarget.classList.toggle('active',shuffleOn);toast(shuffleOn?'Shuffle is on':'Shuffle is off')});
 $('#repeat').addEventListener('click',event=>{repeatOn=!repeatOn;event.currentTarget.classList.toggle('active',repeatOn);toast(repeatOn?'Repeat is on':'Repeat is off')});
 $('#volume').addEventListener('input',event=>audio.volume=Number(event.target.value));
 $('#seek').addEventListener('input',event=>{if(audio.duration)audio.currentTime=audio.duration*Number(event.target.value)/1000});
 $('#close-player').addEventListener('click',()=>{audio.pause();audio.removeAttribute('src');$('#player').hidden=true});
 $('#player-favorite').addEventListener('click',event=>toggleFavorite(Number(event.currentTarget.dataset.id)));
 app.addEventListener('change',event=>{
  if(event.target.id==='queue-status'){queueStatus=event.target.value;queuePage=1;loadQueue()}
  if(event.target.id==='sort-results'){
   if(event.target.value==='title')currentResults.sort((a,b)=>(a.trackName||a.collectionName||a.artistName||'').localeCompare(b.trackName||b.collectionName||b.artistName||''));
   if(event.target.value==='artist')currentResults.sort((a,b)=>(a.artistName||'').localeCompare(b.artistName||''));
   if(event.target.value==='relevance'&&query){performSearch(query);return}
   renderSearchResults();
  }
 });
 audio.addEventListener('timeupdate',updatePlayerProgress);audio.addEventListener('durationchange',updatePlayerProgress);
 audio.addEventListener('play',updatePlayButton);audio.addEventListener('pause',updatePlayButton);
 audio.addEventListener('ended',()=>{if(repeatOn){audio.currentTime=0;audio.play()}else skipTrack(1)});
}
async function init(){
 bindEvents();
 try{const data=await api('me');user=data.user}catch{user=null}
 authHeader();setPage('home');
}
init();
</script>
</body>
