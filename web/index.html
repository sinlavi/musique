    /* ───────── downloads + player ───────── */
    async function downloadTrack(url, name, button) {
      if (!url) return;
      if (button) button.disabled = true;
      notify('Preparing your download…', 'download');
      try {
        const response = await fetch(url, { credentials: 'same-origin' });
        if (!response.ok) throw new Error('Download could not be fetched.');
        const blob = await response.blob();
        const objectUrl = URL.createObjectURL(blob);
        const anchor = document.createElement('a');
        anchor.href = objectUrl;
        anchor.download = `${name || 'track'}.mp3`;
        document.body.append(anchor);
        anchor.click();
        anchor.remove();
        setTimeout(() => URL.revokeObjectURL(objectUrl), 2000);
        notify('Download ready', 'check_circle');
      } catch {
        window.open(url, '_blank', 'noopener');
        notify('Opened the file in a new tab', 'open_in_new');
      } finally { if (button) button.disabled = false; }
    }

    function setPlaylist(items, id) {
      playlist = items.filter(track => source(track));
      const target = playlist.findIndex(track => trackId(track) === Number(id));
      playlistIndex = target >= 0 ? target : 0;
    }

    function playTrack(url, title, artist, id = 0) {
      if (!url) return;
      if (tracks.length) setPlaylist(tracks, id);
      const track = tracks.find(item => trackId(item) === Number(id)) || null;
      activeTrack = track ? { ...track } : { track_id: Number(id), name: title, artist_name: artist };
      $('#player').hidden = false;
      document.body.classList.add('has-player');
      $('#p-title').textContent = title || track?.name || track?.trackName || 'Unknown track';
      $('#p-artist').textContent = `${artist || track?.artist_name || track?.artistName || ''}${track ? ` · ${track.is_crawled ? 'Full track' : 'Preview'}` : ''}`;
      const art = $('#p-art');
      art.src = track?.artwork || track?.artworkUrl100 || '';
      art.style.visibility = art.getAttribute('src') ? 'visible' : 'hidden';
      const full = track ? downloadUrl(track) : '';
      const downloadButton = $('#p-dl');
      downloadButton.hidden = !(full && (track.status === 'done' || track.is_crawled));
      downloadButton.dataset.url = full;
      downloadButton.dataset.name = track ? fileName(track) : '';
      const favoriteButton = $('#p-fav');
      favoriteButton.dataset.id = String(id || 0);
      favoriteButton.dataset.action = 'favorite';
      paintFavorite(favoriteButton, Boolean(track?.is_favorite));
      audio.src = url;
      $('#player').classList.remove('is-playing');
      $('#player').classList.add('is-loading');
      audio.play().then(updatePlayButton).catch(() => { updatePlayButton(); notify('Tap play to start audio', 'play_circle'); });
      markNowPlaying();
      if (!$('#contextPanel').hidden) showContext(contextTab);
    }

    function playFromTrack(track) {
      if (track) playTrack(source(track), track.name || track.trackName || 'Unknown track', track.artist_name || track.artistName || 'Unknown artist', trackId(track));
    }

    function updatePlayButton() {
      const button = $('#toggle');
      const player = $('#player');
      const playing = !audio.paused && !audio.ended;
      button.querySelector('md-icon').textContent = audio.paused ? 'play_arrow' : 'pause';
      button.setAttribute('aria-label', audio.paused ? 'Play' : 'Pause');
      player.classList.toggle('is-playing', playing && audio.readyState >= 2);
      player.classList.toggle('is-loading', playing && audio.readyState < 3);
    }

    function skipTrack(direction) {
      if (!playlist.length) return;
      let next = playlistIndex + direction;
      if (shuffleEnabled) {
        const candidates = playlist.map((_, index) => index).filter(index => index !== playlistIndex);
        next = candidates[Math.floor(Math.random() * candidates.length)] ?? playlistIndex;
      }
      if (next < 0 || next >= playlist.length) {
        if (repeatEnabled) next = (next + playlist.length) % playlist.length;
        else return;
      }
      playlistIndex = next;
      playFromTrack(playlist[playlistIndex]);
    }

    function playAll() {
      const playable = tracks.filter(track => source(track));
      if (!playable.length) { notify('Nothing playable here yet', 'info'); return; }
      setPlaylist(playable, trackId(playable[0]));
      playFromTrack(playlist[playlistIndex]);
    }

    function exportCsv(items, filename) {
      const columns = ['name', 'artist_name', 'collection_name', 'status', 'progress', 'bale_file_id', 'bale_message_id', 'telegram_file_id'];
      const value = item => `"${String(item ?? '').replace(/^[\s]*[=+\-@]/, '').replaceAll('"', '""')}"`;
      const content = [columns.join(','), ...items.map(item => columns.map(key => value(item[key])).join(','))].join('\r\n');
      const url = URL.createObjectURL(new Blob([content], { type: 'text/csv;charset=utf-8' }));
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = filename;
      anchor.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function exportAll(action, params, filename) {
      try {
        const first = await api(action, { page: 1, per_page: 100, ...params });
        const items = [...(first.items || [])];
        for (let number = 2; number <= Number(first.pages || 1); number++) {
          const next = await api(action, { page: number, per_page: 100, ...params });
          items.push(...(next.items || []));
        }
        exportCsv(items, `${filename}-${new Date().toISOString().slice(0, 10)}.csv`);
        notify(`Exported ${items.length} songs`, 'check_circle');
      } catch (error) { notify(`Export failed: ${error.message}`, 'error'); }
    }

    /* ───────── events (delegated) ───────── */
    document.addEventListener('click', event => {
      const contextTabButton = event.target.closest('[data-context-tab]');
      if (contextTabButton) {
        showContext(contextTabButton.dataset.contextTab);
        return;
      }
      const pageButton = event.target.closest('[data-page]');
      if (pageButton) {
        event.preventDefault();
        setPage(pageButton.dataset.page);
        return;
      }
      const button = event.target.closest('[data-action]');
      if (!button) return;
      const { action, id, type, term } = button.dataset;

      switch (action) {
        case 'mood':
          query = term || '';
          entity = 'song';
          if (page !== 'search') setPage('search'); else renderSearch();
          break;
        case 'recent': search(term); break;
        case 'clear-recent':
          recent = [];
          try { localStorage.removeItem(RECENT_KEY); } catch { /* Ignore storage errors. */ }
          $('#recentArea').innerHTML = '';
          break;
        case 'do-search': search(); break;
        case 'retry-search': search(query); break;
        case 'clear-search':
          query = '';
          searchVersion++;
          renderSearch();
          $('#searchInput')?.focus();
          break;
        case 'play': playTrack(button.dataset.src, button.dataset.title, button.dataset.artist, Number(id)); break;
        case 'download': downloadTrack(button.dataset.url, button.dataset.name, button); break;
        case 'save-local': saveOfflineFile(Number(id), button); break;
        case 'remove-offline': removeOfflineTrack(Number(id)); break;
        case 'favorite': toggleFavorite(Number(id)); break;
        case 'lyrics': showLyrics(Number(id), button.dataset.title || 'Lyrics'); break;
        case 'lyric-seek':
          if (audio.src) {
            audio.currentTime = Number(button.dataset.time) / 1000;
            if (audio.paused) audio.play().catch(() => notify('Audio could not be started', 'error'));
          }
          break;
        case 'details': showDetails(Number(id)); break;
        case 'track-menu': openTrackMenu(button, Number(id), button.dataset.ctx); break;
        case 'queue-add': addQueue(type, Number(id)); break;
        case 'open-album': openAlbum(Number(id)); break;
        case 'open-artist': openArtist(Number(id)); break;
        case 'back': setNavigation('search'); renderSearch(); break;
        case 'remove-queue': removeQueue(Number(id)); break;
        case 'refresh': loadQueue(); break;
        case 'export': exportAll('queue_list', { status: queueStatus }, 'mman-queue'); break;
        case 'export-favorites': exportAll('favorites', {}, 'mman-liked'); break;
        case 'queue-filter-card':
          queueStatus = button.dataset.status || '';
          queuePage = 1;
          renderQueue();
          break;
        case 'queue-page':
          queuePage = Number(button.dataset.pageNumber);
          loadQueue();
          break;
        case 'favorites-page':
          favoritesPage = Number(button.dataset.pageNumber);
          loadFavorites();
          break;
        case 'retry': addQueue('track', Number(id)); break;
        case 'play-all': playAll(); break;
        case 'auth': showAuth(); break;
        case 'auth-switch': showAuth(button.dataset.register === 'true'); break;
        case 'auth-submit': submitAuth(); break;
        case 'dialog-close': dialog.close(); break;
        case 'account':
          if (!user) { showAuth(); break; }
          showMenu(button, `<md-menu-item disabled><md-icon slot="start">account_circle</md-icon><div slot="headline">${esc(user.email || 'Account')}</div></md-menu-item>
            <md-divider role="separator" tabindex="-1"></md-divider>
            <md-menu-item data-action="logout"><md-icon slot="start">logout</md-icon><div slot="headline">Sign out</div></md-menu-item>`);
          break;
        case 'logout': logout(); break;
        case 'retry-favorites': loadFavorites(); break;
      }
    });

    app.addEventListener('input', event => {
      if (event.target.id === 'searchInput') {
        const clearButton = $('#clearSearch');
        if (clearButton) clearButton.hidden = !event.target.value;
      }
    });

    app.addEventListener('keydown', event => {
      if (event.key === 'Enter' && event.target.id === 'searchInput') {
        event.preventDefault();
        search();
      }
    });

    dialog.addEventListener('keydown', event => {
      if (event.key === 'Enter' && ['authEmail', 'authPassword'].includes(event.target.id)) {
        event.preventDefault();
        submitAuth();
      }
    });

    // Capture phase: Material Web change events are not guaranteed to bubble.
    app.addEventListener('change', event => {
      const target = event.target;
      if (target.id === 'entityTabs') {
        const next = ENTITIES[target.activeTabIndex] || 'song';
        if (next === entity) return;
        entity = next;
        if (query) search(query);
      }
      if (target.id === 'queueFilter') {
        const next = target.value === 'all' ? '' : target.value;
        if (next === queueStatus) return;
        queueStatus = next;
        queuePage = 1;
        loadQueue();
      }
      if (target.id === 'sort') {
        const sort = target.value;
        const titleOf = item => item.trackName || item.collectionName || item.artistName || '';
        if (sort === 'title') results.sort((a, b) => titleOf(a).localeCompare(titleOf(b)));
        if (sort === 'artist') results.sort((a, b) => (a.artistName || '').localeCompare(b.artistName || ''));
        if (sort === 'relevance' && query) { search(query); return; }
        showResults();
      }
    }, true);

    // Player controls and keyboard shortcuts.
    $('#toggle').addEventListener('click', () => {
      if (!audio.src) return;
      audio.paused ? audio.play().catch(() => notify('Audio could not be started', 'error')) : audio.pause();
    });
    $('#prev').addEventListener('click', () => skipTrack(-1));
    $('#next').addEventListener('click', () => skipTrack(1));
    $('#shuffle').addEventListener('click', event => {
      shuffleEnabled = !shuffleEnabled;
      event.currentTarget.selected = shuffleEnabled;
      notify(shuffleEnabled ? 'Shuffle is on' : 'Shuffle is off', 'shuffle');
    });
    $('#repeat').addEventListener('click', event => {
      repeatEnabled = !repeatEnabled;
      event.currentTarget.selected = repeatEnabled;
      notify(repeatEnabled ? 'Repeat is on' : 'Repeat is off', 'repeat');
    });
    $('#vol').addEventListener('input', event => { audio.volume = Number(event.target.value); });
    $('#seek').addEventListener('pointerdown', () => { seeking = true; });
    window.addEventListener('pointerup', () => { seeking = false; });
    $('#seek').addEventListener('input', event => {
      if (audio.duration) audio.currentTime = audio.duration * Number(event.target.value) / 1000;
    });
    $('#close').addEventListener('click', () => {
      audio.pause();
      audio.removeAttribute('src');
      audio.load();
      $('#player').hidden = true;
      document.body.classList.remove('has-player');
      updatePlayButton();
      markNowPlaying();
    });
    $('#p-dl').addEventListener('click', event => downloadTrack(event.currentTarget.dataset.url, event.currentTarget.dataset.name, event.currentTarget));
    $('#context-toggle').addEventListener('click', () => {
      if ($('#contextPanel').hidden) showContext('lyrics');
      else {
        $('#contextPanel').hidden = true;
        document.body.classList.remove('context-open');
      }
    });
    $('#context-close').addEventListener('click', () => {
      $('#contextPanel').hidden = true;
      document.body.classList.remove('context-open');
    });

    function updateProgress() {
      $('#cur').textContent = seconds(audio.currentTime || 0);
      $('#tot').textContent = seconds(audio.duration || 0);
      if (!seeking) $('#seek').value = audio.duration ? Math.round(audio.currentTime / audio.duration * 1000) : 0;
      syncContextLyrics();
    }
    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('durationchange', updateProgress);
    ['play', 'playing', 'waiting', 'canplay', 'pause'].forEach(name => audio.addEventListener(name, updatePlayButton));
    audio.addEventListener('error', () => {
      updatePlayButton();
      if (audio.src) notify('This audio stream could not be played', 'error');
    });
    audio.addEventListener('ended', () => {
      if (repeatEnabled && playlist.length === 1) {
        audio.currentTime = 0;
        audio.play().catch(() => updatePlayButton());
      } else skipTrack(1);
    });

    document.addEventListener('keydown', event => {
      const tag = document.activeElement?.tagName || '';
      const typing = /^(INPUT|TEXTAREA|SELECT|MD-.*(TEXT-FIELD|SELECT))$/.test(tag) || document.activeElement?.isContentEditable;
      if (event.key === '/' && !typing && !dialog.open) {
        event.preventDefault();
        if (page !== 'search') setPage('search');
        $('#searchInput')?.focus();
      }
      if (event.code === 'Space' && !typing && !/^(BUTTON|A|MD-)/.test(tag) && !dialog.open && audio.src) {
        event.preventDefault();
        audio.paused ? audio.play().catch(() => {}) : audio.pause();
      }
    });

    // Reveal artwork only after it has loaded; failed images keep their surface placeholder.
    document.addEventListener('load', event => {
      if (event.target instanceof HTMLImageElement) event.target.classList.add('image-loaded');
    }, true);
    document.addEventListener('error', event => {
      if (event.target instanceof HTMLImageElement) event.target.classList.add('image-failed');
    }, true);

    // M3 top app bar: tonal elevation once content scrolls under it.
    const appbar = $('#appbar');
    window.addEventListener('scroll', () => appbar.classList.toggle('scrolled', window.scrollY > 4), { passive: true });

    // Restore session without blocking the first paint.
    document.body.classList.add('ready');
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register(`${base}sw.js`, { scope: base }).catch(error => {
        console.warn('mman offline shell could not be installed', error);
      });
    }
    if (!componentsOk) {
      app.insertAdjacentHTML('beforebegin', '<div class="banner" role="alert">Material components could not be loaded from the CDN. Check your connection and reload.</div>');
    }
    try { user = (await api('me')).user || null; }
    catch { user = null; }
    updateAccountButton();
    setPage('search');
  </script>
</body>
</html>
