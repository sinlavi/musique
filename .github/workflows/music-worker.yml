name: mman queue worker

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

concurrency:
  group: mman-queue-worker
  cancel-in-progress: false

jobs:
  process-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      API_URL: ${{ secrets.API_URL || 'https://mman.ir/api/index.php' }}
      API_KEY: ${{ secrets.API_KEY || 'API_KEY' }}
      BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
      BALE_CHAT: ${{ secrets.BALE_CHAT }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TG_CHAT }}
      COOKIES: ${{ github.workspace }}/bot/cookies.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - name: Install audio tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install --upgrade pip
          pip install -r bot/requirements.txt
      - name: Configure YouTube cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          test -n "$YOUTUBE_COOKIES"
          printf '%s' "$YOUTUBE_COOKIES" > "$COOKIES"
          chmod 600 "$COOKIES"
      - name: Process queued tracks
        run: python bot/bot.py --max-jobs 10
