name: mman queue worker

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

concurrency:
  group: mman-queue-worker
  cancel-in-progress: false

jobs:
  process-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    env:
      API_URL: ${{ secrets.API_URL || 'https://mman.ir/api/index.php' }}
      API_KEY: ${{ secrets.API_KEY || 'API_KEY' }}
      BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
      BALE_CHAT: ${{ secrets.BALE_CHAT }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TG_CHAT }}
      YOUTUBE_PROXY: ${{ secrets.YOUTUBE_PROXY }}
      COOKIES: ${{ github.workspace }}/bot/cookies.txt
      DOWNLOAD_METHOD_CACHE: ${{ github.workspace }}/bot/.worker-state/last_download_method
    steps:
      - uses: actions/checkout@v4
      - name: Validate required repository secrets
        env:
          API_KEY: ${{ secrets.API_KEY }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          BALE_CHAT: ${{ secrets.BALE_CHAT }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          missing=""
          [ -n "$API_KEY" ] || missing="$missing API_KEY"
          [ -n "$YOUTUBE_COOKIES" ] || missing="$missing YOUTUBE_COOKIES"
          [ -n "$BALE_TOKEN" ] || missing="$missing BALE_TOKEN"
          [ -n "$BALE_CHAT" ] || missing="$missing BALE_CHAT"
          [ -n "$TG_BOT_TOKEN" ] || missing="$missing TG_BOT_TOKEN"
          [ -n "$TG_CHAT" ] || missing="$missing TG_CHAT"
          if [ -n "$missing" ]; then
            printf 'Missing required GitHub Actions secrets:%s\n' "$missing" >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - name: Install audio tools and dependencies
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
          python -m pip install --requirement bot/requirements.txt
      - name: Set up Cloudflare WARP proxy when no proxy is configured
        env:
          YOUTUBE_PROXY: ${{ secrets.YOUTUBE_PROXY }}
        run: |
          set -e
          if [ -n "$YOUTUBE_PROXY" ]; then
            echo "Using the configured YOUTUBE_PROXY."
            exit 0
          fi

          docker pull caomingjun/warp:latest
          docker rm -f warp 2>/dev/null || true
          docker network inspect warp-net >/dev/null 2>&1 || docker network create warp-net
          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            caomingjun/warp:latest

          warp_ready=false
          for attempt in $(seq 1 30); do
            if curl -x socks5h://127.0.0.1:1080 \
              https://cloudflare.com/cdn-cgi/trace --max-time 5 --silent |
              grep -q 'warp=on'; then
              echo "Cloudflare WARP proxy is ready."
              warp_ready=true
              break
            fi
            echo "Waiting for WARP ($attempt/30)"
            sleep 5
          done
          if [ "$warp_ready" != true ]; then
            echo "::error::Cloudflare WARP proxy did not become ready."
            docker logs warp || true
            exit 1
          fi
          curl -x socks5h://127.0.0.1:1080 \
            https://cloudflare.com/cdn-cgi/trace --max-time 10 --silent |
            grep -E '^(ip|warp)='
          echo "YOUTUBE_PROXY=socks5h://127.0.0.1:1080" >> "$GITHUB_ENV"
      - name: Configure YouTube cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          test -n "$YOUTUBE_COOKIES"
          printf '%s' "$YOUTUBE_COOKIES" > "$COOKIES"
          chmod 600 "$COOKIES"
      - name: Prepare downloader method cache
        run: mkdir -p bot/.worker-state && touch bot/.worker-state/last_download_method
      - name: Restore last working YouTube method
        uses: actions/cache/restore@v4
        with:
          path: bot/.worker-state/last_download_method
          key: mman-download-method-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            mman-download-method-${{ runner.os }}-
      - name: Process queued tracks
        run: python -u bot/bot.py --run-seconds 7200 --poll-seconds 30
      - name: Save last working YouTube method
        if: always()
        uses: actions/cache/save@v4
        with:
          path: bot/.worker-state/last_download_method
          key: mman-download-method-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

  rerun-on-failure:
    needs: process-queue
    if: failure() && github.run_attempt < 3
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Rerun failed job
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.runId;
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            await github.rest.actions.rerunFailedJobs({
              owner,
              repo,
              run_id: runId
            });
            console.log(`Rerun requested for run ${runId}`);
